<style>
  :root{
    --ink:#1b1d26; --ink-soft:#5b606f;
    --pos:#2563eb; --neg:#ea580c;
    --right:#16a34a; --wrong:#e11d48;
    --line:#e6e8ef; --card:#ffffff; --key:#f3f5f9; --key-press:#e3e7f0; --bg:#f7f8fb;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--bg);
    display:flex;justify-content:center;padding:14px;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.5px;}
  header .sub{font-size:12px;color:var(--ink-soft);}

  .levels{display:flex;gap:8px;}
  .lv{flex:1;border:none;border-radius:12px;padding:10px 0;font-family:inherit;font-size:14px;font-weight:500;
      background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);cursor:pointer;transition:.15s;}
  .lv.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 8px 24px -18px rgba(20,25,50,.35);}
  .q{font-size:18px;font-weight:500;line-height:1.65;min-height:52px;}
  .q .tag{display:inline-block;font-size:11px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;margin-bottom:10px;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fbfcfe;
       border-radius:14px;padding:13px 15px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;transition:.12s;line-height:1.4;}
  .opt:active{transform:scale(.99);}
  .opt .mk{width:26px;height:26px;flex:none;border-radius:8px;background:var(--key);color:var(--ink-soft);
           font-family:'Lexend',sans-serif;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .opt.pick{border-color:var(--ink);}
  .opt.ok{border-color:var(--right);background:#f0fdf4;color:var(--right);} .opt.ok .mk{background:var(--right);color:#fff;}
  .opt.no{border-color:var(--wrong);background:#fff1f4;color:var(--wrong);} .opt.no .mk{background:var(--wrong);color:#fff;}
  .opt.lock{cursor:default;}
  @keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
  .shake{animation:shake .35s;}
  .explain{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:14px;display:none;}
  .explain.show{display:block;}
  .explain .lead{font-size:12px;color:var(--subj);letter-spacing:1px;margin-bottom:4px;}
  .explain .body{font-size:15px;line-height:1.8;color:var(--ink);}
  .explain .kp{font-size:12px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px;}
  .go{border:none;border-radius:16px;height:56px;width:100%;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:1px;
      background:var(--pos);color:#fff;cursor:pointer;transition:.12s;}
  .go:active{transform:scale(.98);} .go:disabled{opacity:.35;}

<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"之-助詞「的」","q":"「予嘗求古仁人之心」的「之」，意義為何？","choices":["往、到","代詞，指心","用於主謂之間，無實義","的"],"answer":3,"explain":"白話：我曾探求古代志士仁人的心思。「之」是結構助詞，相當於「的」。（出自〈岳陽樓記〉）"},{"level":"basic","topic":"之-取消獨立性","q":"「無絲竹之亂耳」（〈陋室銘〉）的「之」，用法是？","choices":["用於主謂之間，取消句子的獨立性","結構助詞「的」","代詞，代絲竹","動詞，前往"],"answer":0,"explain":"白話：沒有樂器的聲音擾亂耳朵。「絲竹（主語）之亂耳（謂語）」，「之」放在主語與謂語之間，取消句子的獨立性，無實義。"},{"level":"basic","topic":"之-動詞「往」","q":"「送孟浩然之廣陵」的「之」意思是？","choices":["的","他","到、往","句末語氣詞"],"answer":2,"explain":"白話：送孟浩然到廣陵去。「之」在此是動詞，作「到、往」解。（出自李白〈黃鶴樓送孟浩然之廣陵〉）"},{"level":"adv","topic":"之-辨代詞","q":"下列各句的「之」，何者是「代詞」？","choices":["水陸草木之花","學而時習之","兩狼之並驅如故","久之，目似瞑"],"answer":1,"explain":"「學而時習之」的「之」代指「學過的內容」，是代詞。其餘：「水陸草木之花」的「之」是助詞「的」；「兩狼之並驅如故」的「之」用於主謂之間；「久之」的「之」湊足音節、無實義。"},{"level":"basic","topic":"其-代詞","q":"「擇其善者而從之」（《論語》）的「其」意思是？","choices":["代詞，他們（的）","難道","大概、恐怕","句末語氣詞"],"answer":0,"explain":"白話：選擇他們好的地方來學習。「其」是代詞，指「他們（眾人）的」。"},{"level":"adv","topic":"其-語氣詞","q":"「其真無馬邪？其真不知馬也！」（〈馬說〉）兩個「其」的用法，正確的是？","choices":["都是代詞「牠的」","都是連詞「還是」","前為「恐怕」，後為「難道」","前為「難道」，後為「恐怕、大概」（皆語氣詞）"],"answer":3,"explain":"白話：難道真的沒有千里馬嗎？恐怕是真的不認識千里馬吧！第一個「其」表反問「難道」，第二個「其」表推測「恐怕、大概」，兩者都是語氣詞。"},{"level":"basic","topic":"而-順接","q":"「溫故而知新」的「而」，表示的關係是？","choices":["轉折（卻）","順接（承接，「進而、就」）","並列（又）","因果（因此）"],"answer":1,"explain":"白話：溫習學過的舊知識，進而能領悟新的道理。「而」連接先後相承的動作，表順接（承接）。"},{"level":"basic","topic":"而-轉折","q":"「人不知而不慍」的「而」，意思是？","choices":["並且","就","卻（轉折）","來"],"answer":2,"explain":"白話：別人不了解我，我卻不惱怒。「而」表轉折，相當於「卻」。"},{"level":"adv","topic":"而-辨轉折","q":"下列「而」字，何者表「轉折」（可解為「卻」）？","choices":["溫故而知新","敏而好學","擇其善者而從之","學而不思則罔"],"answer":3,"explain":"「學而不思則罔」白話：只顧學習卻不思考，就會迷惘無所得，「而」表轉折。其餘三句的「而」分別是承接、並列（又）、承接。"},{"level":"basic","topic":"以-介詞「用」","q":"「以刀劈狼首」（〈狼〉）的「以」意思是？","choices":["因為","用、拿","來（表目的）","認為"],"answer":1,"explain":"白話：用刀砍狼的頭。「以」是介詞，作「用、拿」解。"},{"level":"basic","topic":"以-介詞「因為」","q":"「不以物喜，不以己悲」（〈岳陽樓記〉）的「以」意思是？","choices":["用","拿來","因為","把"],"answer":2,"explain":"白話：不因為外物（環境的好壞）而歡喜，不因為自己（的得失）而悲傷。「以」作「因為」解。"},{"level":"adv","topic":"以-連詞「來」","q":"下列「以」字，何者作連詞「來」（表目的）解？","choices":["屬予作文以記之","以其境過清","醒能述以文者","全石以為底"],"answer":0,"explain":"白話：囑咐我寫篇文章來記述這件事，「以」表目的，作「來」解（〈岳陽樓記〉）。其餘：「以其境過清」的「以」是「因為」（〈小石潭記〉）；「述以文」的「以」是「用」（〈醉翁亭記〉）；「全石以為底」的「以」是「把、拿」。"},{"level":"basic","topic":"於-介詞「在」","q":"「刻唐賢今人詩賦於其上」（〈岳陽樓記〉）的「於」意思是？","choices":["比","對於","向","在"],"answer":3,"explain":"白話：把唐代賢人和當代人的詩賦刻在它（岳陽樓）上面。「於」是介詞，作「在」解。"},{"level":"adv","topic":"於-介詞「比」","q":"「苛政猛於虎也」的「於」意思是？","choices":["在","對於","比","從"],"answer":2,"explain":"白話：苛刻殘暴的政治比老虎還要兇猛啊！「於」表比較，作「比」解。"},{"level":"basic","topic":"則-就","q":"「學而不思則罔，思而不學則殆」的「則」意思是？","choices":["卻","就","是","反而"],"answer":1,"explain":"白話：只學習卻不思考，就會迷惘無所得；只空想卻不學習，就會精神疲怠。「則」作「就」解，表承接。"},{"level":"adv","topic":"則-卻","q":"「余則縕袍敝衣處其間，略無慕艷意」（〈送東陽馬生序〉）的「則」意思是？","choices":["就","便","於是","卻"],"answer":3,"explain":"白話：我卻穿著破舊的袍子、破衣服夾在他們中間，一點也沒有羨慕的意思。「則」在此表轉折、對比，作「卻」解。"},{"level":"basic","topic":"乃-於是","q":"「乃記之而去」（〈小石潭記〉）的「乃」意思是？","choices":["於是、就","竟然","是","你的"],"answer":0,"explain":"白話：於是把這裡的景致記下來便離開了。「乃」作「於是、就」解。"},{"level":"adv","topic":"乃-竟然","q":"「問今是何世，乃不知有漢，無論魏晉」（〈桃花源記〉）的「乃」意思是？","choices":["於是","竟然","才","就"],"answer":1,"explain":"白話：（他們）問起現在是什麼朝代，竟然不知道有過漢朝，更不用說魏、晉了。「乃」表出乎意料，作「竟然」解。"},{"level":"basic","topic":"者-…的人","q":"「知之者不如好之者」（《論語》）的「者」意思是？","choices":["這","的","……的人","句末語氣詞，無義"],"answer":2,"explain":"白話：懂得學問的人，比不上愛好它的人。「者」附在詞語後，指「……的人」。"},{"level":"adv","topic":"者-提頓助詞","q":"下列「者」字，何者不作「……的人」解？","choices":["仁者樂山","近塞上之人有善術者","好之者不如樂之者","北山愚公者，年且九十"],"answer":3,"explain":"「北山愚公者，年且九十」（〈愚公移山〉）白話：北山有個叫愚公的人，年紀將近九十。此「者」用在主語後表示停頓、提示，不作「……的人」解。其餘三句的「者」都指「……的人」。"},{"level":"basic","topic":"也-判斷語氣","q":"「南陽劉子驥，高尚士也」（〈桃花源記〉）句末「也」的作用是？","choices":["表判斷、肯定的語氣","表疑問","表感嘆","表祈使、命令"],"answer":0,"explain":"白話：南陽的劉子驥，是個志向高潔的人。「也」用在句末，表判斷、肯定的語氣。"},{"level":"basic","topic":"矣-感嘆語氣","q":"「甚矣，汝之不惠！」（〈愚公移山〉）句中「矣」表示的語氣是？","choices":["疑問","命令","感嘆","判斷"],"answer":2,"explain":"白話：你太不聰明了！（「惠」通「慧」，聰明。）「甚矣」是「太過分了」，「矣」在此表感嘆的語氣。"},{"level":"adv","topic":"乎-反問語氣","q":"下列句末虛詞，何者表「疑問或反問」的語氣？","choices":["溫故而知新，可以為師矣","學而時習之，不亦說乎","三人行，必有我師焉","環滁皆山也"],"answer":1,"explain":"「學而時習之，不亦說乎」白話：學了並且按時複習它，不也是很愉快嗎？「乎」表反問。其餘：「可以為師矣」的「矣」表肯定（「了」）；「必有我師焉」的「焉」相當於「於此、在其中」；「環滁皆山也」的「也」表判斷。"},{"level":"adv","topic":"焉-疑問「怎麼」","q":"「不入虎穴，焉得虎子」的「焉」意思是？","choices":["怎麼、哪裡","於此、在其中","句末語氣詞，「了」","他"],"answer":0,"explain":"白話：不進入老虎的巢穴，怎麼能捉到小老虎呢？「焉」在此是疑問詞，表反問，作「怎麼、哪裡」解。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], seen=[], recent=[], sinceReview=0, problem=null, answered=false, streak=0, lastIdx=-1;
const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
