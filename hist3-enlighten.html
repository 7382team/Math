<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"哥白尼日心說","q":"哥白尼在《天體運行論》中提出的看法，與當時歐洲流行的宇宙觀最大的不同在於下列何者？","choices":["主張宇宙是無限大的，沒有任何天體位居中心","主張所有行星以橢圓形軌道繞著地球運行","主張太陽位於中心，地球只是繞太陽運行的行星之一","主張月亮繞著太陽運行，地球則靜止不動"],"answer":2,"explain":"哥白尼把宇宙的中心由地球改為太陽，地球降格為一顆行星，這是與傳統地心說最根本的差異。(0)無限宇宙並非哥白尼的主張；(1)橢圓軌道是克卜勒的貢獻，且行星繞的是太陽而非地球；(3)月亮是繞地球運行，而地球靜止正是舊有地心說的說法。"},{"level":"basic","topic":"中古宇宙觀與權威","q":"中古歐洲長期認為地球靜止於宇宙中心，這種宇宙觀之所以不容易被質疑，最主要的原因是什麼？","choices":["它與教會教義及古代學術權威結合，被視為不容挑戰的真理","當時已有精密望遠鏡，觀測結果完全支持這種說法","各國政府都立法強制規定人民必須相信這個學說","商人與航海家在遠洋航行中不斷驗證此說完全正確"],"answer":0,"explain":"地心說結合了古代學者的權威與基督教的世界觀，質疑它等於挑戰信仰與傳統。(1)望遠鏡要到伽利略的時代才用於天文觀測；(2)並非靠各國立法強制；(3)航海活動並未驗證地心說，反而累積了新的天文與地理知識。"},{"level":"basic","topic":"伽利略的天文觀測","q":"伽利略把新製作的望遠鏡指向天空進行觀測，他的觀測結果對傳統宇宙觀造成什麼衝擊？","choices":["證明地球是宇宙中唯一有生命存在的星球","發現月球表面凹凸不平、木星有衛星繞行，動搖了天體完美無瑕且都繞地球運行的看法","測量出行星繞太陽運行的橢圓軌道，因而提出行星運動定律","提出萬有引力，說明天體之間會互相吸引"],"answer":1,"explain":"伽利略的觀測顯示天體並非完美無瑕，也不是所有天體都繞地球轉，對傳統宇宙觀是直接的打擊。(0)與其觀測內容無關；(2)橢圓軌道與行星運動定律是克卜勒的成就；(3)萬有引力是牛頓提出的。"},{"level":"basic","topic":"克卜勒行星運動","q":"克卜勒根據長期累積的天文觀測資料反覆計算，修正了前人對行星軌道的想法。他最重要的貢獻是下列何者？","choices":["主張行星繞著地球做等速圓周運動","首度用望遠鏡看見太陽表面的黑子","說明物體落下的速度與物體的重量成正比","指出行星繞太陽運行的軌道是橢圓形，而不是正圓"],"answer":3,"explain":"克卜勒以觀測數據修正圓形軌道的舊觀念，提出行星運動定律，指出軌道為橢圓形。(0)是傳統地心說的說法；(1)是伽利略的觀測成果；(2)是被伽利略以實驗推翻的古代看法。"},{"level":"basic","topic":"牛頓的定律與世界觀","q":"牛頓提出運動定律與萬有引力之後，人們對自然界的理解出現什麼重要轉變？","choices":["相信天體的運行完全隨機，人類根本無法預測","相信天上與地上的物體遵循同一套自然法則，宇宙的運行可以用數學來解釋","相信地球是宇宙中心的說法重新獲得科學證實","相信研究自然必須先取得教會的解釋才算正確"],"answer":1,"explain":"牛頓用同一套力學原理解釋地面物體落下與天體運行，使宇宙被視為依循可計算之法則運作的體系。(0)牛頓的成就正是說明天體運行可以預測；(2)其學說支持的是日心體系；(3)科學革命的走向是擺脫權威解釋，而非依賴它。"},{"level":"basic","topic":"科學方法的建立","q":"科學革命時期逐漸確立的研究方法，在判斷一種說法是否成立時，最重視下列哪一種做法？","choices":["引用古代學者的著作作為結論的最終依據","依照宗教經典的記載推斷自然現象的成因","透過觀察與實驗蒐集證據，再進行歸納、推理並反覆檢驗","由學術權威集會投票，表決哪一種說法比較正確"],"answer":2,"explain":"近代科學方法的核心是實證：先觀察、提出假設，再以實驗檢驗並歸納出通則。(0)(1)都是訴諸權威或經典，正是科學革命所要突破的做法；(3)科學結論依證據而非投票決定。"},{"level":"basic","topic":"科學革命與啟蒙的銜接","q":"科學革命除了帶來新的自然知識，也改變了歐洲人的思想態度，並成為日後啟蒙運動的基礎。這種改變最主要是指什麼？","choices":["相信人的理性與科學方法能揭開自然的奧祕，因而敢於重新檢驗傳統權威","使人們更加確信傳統權威的說法不需要任何檢驗","使人們放棄數學與邏輯推論，改以個人直覺判斷事物","使歐洲各國停止海外探險與貿易活動"],"answer":0,"explain":"科學上的成功讓人相信理性與方法可以解開自然的奧祕，這種自信進一步被用來檢視傳統與制度，成為啟蒙運動的基礎。(1)方向相反；(2)科學革命更強調數學與推理；(3)與海外活動之間沒有因果關係。"},{"level":"basic","topic":"洛克的天賦人權","q":"洛克主張人生而具有生命、自由與財產等權利，政府成立的目的就是保障這些權利。依他的看法，政府的正當權力來自何處？","choices":["來自君主的家族血統與世襲傳統","來自教會為統治者加冕與祝福","來自軍隊對統治者的效忠","來自人民的同意；政府若侵害人民權利，人民有權加以更換"],"answer":3,"explain":"洛克認為統治權由人民託付而來，政府違背託付時人民可以收回，這正是天賦人權與人民同意的主張。(0)(1)(2)分別是世襲、君權神授與武力，都是洛克要反駁的權力來源。"},{"level":"basic","topic":"孟德斯鳩三權分立","q":"孟德斯鳩認為要防止統治者濫用權力，最有效的制度設計是下列何者？","choices":["由國王同時掌握立法與司法大權，以求行政效率","把國家權力分為行政、立法、司法三部分，使其互相制衡","廢除一切法律，讓人民完全依自己意願行動","由貴族與教士共同壟斷所有重要官職"],"answer":1,"explain":"孟德斯鳩主張分權制衡，避免權力集中於一人或一機關。(0)權力集中正是他反對的；(2)無法律的狀態並非其主張，他重視依法治理；(3)壟斷官職屬於特權制度，是啟蒙思想批判的對象。"},{"level":"basic","topic":"盧梭社會契約與主權在民","q":"盧梭主張國家是人民彼此訂立契約而形成的共同體。下列何者最符合他的核心看法？","choices":["國家的主權屬於全體人民，統治者必須依人民的公共意志行事","君主的權力直接由上帝授予，人民只能絕對服從","國家的最高權力屬於由貴族組成的議會","人民應把全部權利永久交給一位終身統治者，不得收回"],"answer":0,"explain":"盧梭的社會契約論強調主權在民，統治者只是執行公共意志的人。(1)是君權神授說；(2)把主權限於貴族，違背其平等精神；(3)權利永久讓渡且不可收回，與人民保有主權的主張相反。"},{"level":"basic","topic":"伏爾泰與思想自由","q":"伏爾泰一生不斷批評迷信與思想箝制，他最著力提倡的主張是什麼？","choices":["恢復中古的宗教審判，以維持信仰的統一","主張立即以暴力推翻各國王室，建立共和政體","主張宗教寬容，並保障人們發表不同意見的自由","主張禁止書籍出版，以避免社會動盪不安"],"answer":2,"explain":"伏爾泰以宗教寬容與言論自由的主張聞名，反對因信仰或言論不同而遭受迫害。(0)(3)都是他抨擊的壓迫手段；(1)提倡暴力革命並非其主張，他期待的是理性與開明的改革。"},{"level":"basic","topic":"百科全書與知識整理","q":"啟蒙時代法國學者投入編纂《百科全書》，這項工作最重要的意義是什麼？","choices":["記錄各國王室族譜，用以鞏固貴族的地位","蒐集宗教聖徒的事蹟，藉以強化教會權威","專門收錄古典拉丁文詩歌，供貴族閒暇娛樂","有系統地整理當時的科學與思想知識並廣為流通，散播理性與批判的觀念"],"answer":3,"explain":"《百科全書》把新知識整理成冊並大量流通，使理性與批判精神走出少數人的圈子。(0)(1)都是維護既有權威，與其批判立場相反；(2)其內容涵蓋工藝、科學與社會思想，不限於文學娛樂。"},{"level":"basic","topic":"沙龍文化","q":"啟蒙時代巴黎等城市流行「沙龍」，就其性質而言，它在當時扮演什麼角色？","choices":["是專門訓練軍官的學校，教授戰術與武器操作","提供貴族、學者與作家聚會討論的場合，使新思想得以交流與擴散","是教會設立的機構，負責審查並禁止新書出版","是政府設置的法庭，專門審理平民與貴族的訴訟"],"answer":1,"explain":"沙龍多由貴族或富有的婦女主持，賓客在此討論文學、科學與時政，是新思想交流的重要場所。(0)(2)(3)分別把沙龍誤認為軍校、審查機構與法庭，皆與其性質不符。"},{"level":"basic","topic":"啟蒙運動的核心精神","q":"啟蒙思想家在政治、宗教等方面的具體主張不盡相同，但他們共同抱持的基本態度是什麼？","choices":["相信人可以運用理性檢視社會與制度，批判專制統治與不合理的特權","主張回到中古，恢復封建領主對土地與人民的統治","認為社會制度不容討論，一切應交由君主獨自決定","認為只有教會的神職人員才有資格談論政治問題"],"answer":0,"explain":"啟蒙運動的共同精神是以理性為尺度重新檢驗既有制度，批判專制與特權。(1)(2)(3)都主張維護或恢復傳統權威，正是啟蒙思想家攻擊的對象。"},{"level":"adv","topic":"新科學與宗教權威的衝突","q":"某位學者因公開支持並宣傳「地球繞太陽運行」的說法，被教會傳喚審問，最後被迫改口並遭到軟禁。這位學者最可能是誰？他的遭遇反映了什麼？","choices":["牛頓；反映當時各國政府全面禁止數學研究","洛克；反映教會強烈反對天賦人權的說法","伽利略；反映新科學觀點與傳統宗教權威之間的緊張關係","狄德羅；反映《百科全書》因記載天文知識而遭到查禁"],"answer":2,"explain":"伽利略因支持日心說而受審並被軟禁，是新科學與宗教權威衝突的著名例子。(0)牛頓的研究並未遭此對待；(1)洛克是政治思想家，與天文爭議無關；(3)《百科全書》確曾遭壓制，但狄德羅並非因主張地動說受審，屬於張冠李戴的誘答。"},{"level":"adv","topic":"日心說的思想衝擊","q":"日心說在當時引起的爭論，遠超過單純的天文學問題。就思想層面而言，它最主要的衝擊是什麼？","choices":["使人們再也無法進行任何天文觀測活動","證明地球上的資源即將耗盡，因而引發社會恐慌","使航海技術停滯，各國因此放棄海外殖民擴張","動搖了「地球與人類位居宇宙中心」的既有信念，也挑戰以權威解釋世界的方式"],"answer":3,"explain":"日心說改變的不只是天體的排列，更改變人對自身位置的認知，並使人開始以觀測與推理取代權威解釋。(0)天文觀測反而更為興盛；(1)(2)把天文學說與資源、航海硬作連結，缺乏因果關係。"},{"level":"adv","topic":"啟蒙思想家主張判讀","q":"下表為三位啟蒙思想家主張的摘要：\n甲：同一個人若同時掌握制定法律與執行法律的權力，人民的自由便不復存在。\n乙：人們相約組成國家，最高權力屬於全體人民，政府應依公共意志行事。\n丙：人生而具有不可讓渡的權利，政府若違背人民的託付，人民可以將它更換。\n甲、乙、丙依序最可能是哪三位思想家？","choices":["孟德斯鳩、盧梭、洛克","洛克、孟德斯鳩、盧梭","盧梭、洛克、孟德斯鳩","伏爾泰、孟德斯鳩、盧梭"],"answer":0,"explain":"甲談權力集中的危險，屬孟德斯鳩的分權制衡；乙強調主權在民與公共意志，屬盧梭；丙強調天賦權利與更換政府的權利，屬洛克。(1)(2)人物順序錯置；(3)伏爾泰主張的是宗教寬容與言論自由，並非分權。"},{"level":"adv","topic":"權力集中與制衡失效","q":"某國憲法原本規定：國會制定法律、內閣負責執行政務、法院獨立審判。後來國王解散國會、改由自己頒布法律，並兼任最高法院院長且可隨時撤換法官。依孟德斯鳩的看法，這樣的改變最可能造成什麼結果？","choices":["行政效率因權責統一而提高，人民的自由也更有保障","司法權因此獨立於行政權之外，制衡功能更為完整","立法、行政、司法之權集中於國王一人，制衡機制失效，人民自由容易受到侵害","國家因此實現主權在民，完全符合社會契約的精神"],"answer":2,"explain":"孟德斯鳩認為權力一旦集中於同一人或同一機關，制衡便無從發揮，自由也隨之喪失。(0)效率提高不等於自由受保障，權力集中正是危險所在；(1)國王兼任院長並可撤換法官，司法反而失去獨立；(3)主權在民是盧梭的主張，且此處權力集中於君主，與之相反。"},{"level":"adv","topic":"啟蒙思想與美國獨立","q":"美國《獨立宣言》指出：人們擁有不可剝奪的權利，政府的正當權力來自被統治者的同意，政府若破壞這些目的，人民有權加以改變。這段內容最能看出哪一位思想家的影響？","choices":["克卜勒的行星運動定律","洛克的天賦人權與政府源於人民同意的主張","伏爾泰對宗教寬容的呼籲","牛頓的萬有引力學說"],"answer":1,"explain":"「不可剝奪的權利」「權力來自被統治者的同意」「人民有權改變政府」三點正對應洛克的主張，可見啟蒙思想成為近代民主革命的依據。(0)(3)屬自然科學成就；(2)宗教寬容雖同屬啟蒙主張，但與此段文字的內容不符。"},{"level":"adv","topic":"啟蒙思想與特權批判","q":"法國大革命前，人數居少數的教士與貴族享有免除大部分賦稅等特權，稅負主要落在人數最多的平民身上。啟蒙思想的傳播對這種情況造成什麼影響？","choices":["使民眾更相信特權是上帝的安排，因而更加順從","使貴族取得更多土地，反而加深了封建制度","使教會取得新的課稅權，大幅擴充財政收入","提供人們以理性與平等觀念批判特權制度的思想依據，助長改革與革命的要求"],"answer":3,"explain":"啟蒙思想把「合不合理」而非「傳統如此」當成判準，使不平等的特權失去正當性，成為革命的思想動力。(0)方向完全相反；(1)(2)把思想傳播誤解為土地與稅收制度的擴張，與史實及因果都不符。"},{"level":"adv","topic":"啟蒙思想與近代民主","q":"有學者指出：「啟蒙運動是近代民主政治的思想基礎。」下列敘述何者最能說明這句話的意思？","choices":["啟蒙思想家親手設計了現代的投票機器與選舉場所","啟蒙思想家親自率領軍隊推翻歐洲各國的王室","啟蒙思想提出天賦人權、主權在民與權力分立等觀念，成為日後民主憲政與人權保障的依據","啟蒙思想家主張君主應擁有絕對權力，才有能力推動各項改革"],"answer":2,"explain":"啟蒙運動的貢獻在觀念層面：它提供了民主憲政與人權保障的原則。(0)偏重技術細節，並非「思想基礎」之意；(1)思想家多以著作影響社會，並非領軍作戰；(3)絕對王權正是啟蒙思想批判的對象。"},{"level":"adv","topic":"科學研究流程判讀","q":"某位科學家的研究過程如下：①注意到重物與輕物落下的情形→②推測落下的快慢與重量無關→③設計實驗加以測量並記錄結果→④結果與古代學說不符，於是修正原有的說法。這個過程最能說明下列何者？","choices":["科學知識只要靠邏輯推論即可完成，不必動手實作","科學方法重視由觀察提出假設，再以實驗檢驗，並依證據修正甚至推翻舊說","科學研究應以維護傳統學說的權威為最高原則","唯有實驗結果與古人的記載相符，研究才算成功"],"answer":1,"explain":"①②③④正好對應觀察、假設、實驗、修正的科學流程，重點在以證據檢驗說法。(0)忽略了③的實驗步驟；(2)(3)把古代學說當成標準，與④「與古代學說不符仍加以修正」的敘述直接矛盾。"},{"level":"adv","topic":"知識傳播與公共輿論","q":"啟蒙時代《百科全書》大量印行，報刊與小冊四處流通，咖啡館、沙龍中人們熱烈討論新書與時事。就知識傳播的整體影響而言，這些現象共同造成什麼結果？","choices":["新思想突破宮廷與教會的限制而向外擴散，形成關心公共事務、勇於批評的社會輿論","知識重新被少數神職人員所壟斷","各國政府因此下令廢除所有印刷事業","民眾普遍失去閱讀興趣，識字率反而下降"],"answer":0,"explain":"印刷品與聚會場所使思想流通的管道倍增，讀者不再限於少數上層人士，逐漸形成公共輿論。(1)方向相反，知識反而擴散；(2)政府雖曾查禁書刊，但並未廢除印刷業；(3)閱讀風氣是增強而非衰退。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], seen=[], recent=[], sinceReview=0, problem=null, answered=false, streak=0, lastIdx=-1;
const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
