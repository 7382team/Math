<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"字詞解釋","q":"〈與宋元思書〉「急湍甚箭，猛浪若奔」的「奔」，意思最接近下列何者？","choices":["快速地逃走","湍急的水流","奔騰的聲響","奔馳的馬"],"answer":3,"explain":"「奔」在此由動詞轉為名詞，指飛奔的馬。白話翻譯：湍急的水流比箭還要快，洶湧的浪濤像飛奔的馬一樣。與上句「甚箭」的「箭」相對成文，可知「若」後所接的「奔」同為名詞性成分。"},{"level":"basic","topic":"字詞解釋","q":"「自富陽至桐廬，一百許里」的「許」，應作何解？","choices":["答應、允許","讚許、稱讚","表示約略的數量，相當於「左右」「上下」","處所、地方"],"answer":2,"explain":"「許」表概數。白話翻譯：從富陽到桐廬，大約一百多里。國中常見同類用法如〈小石潭記〉「潭中魚可百許頭」的「許」，皆表約數。"},{"level":"basic","topic":"字詞解釋","q":"「水皆縹碧，千丈見底」中的「縹碧」是形容水的哪一方面？","choices":["淡青綠的顏色","波浪翻騰的樣子","水流沖擊的聲音","水面反射的光影"],"answer":0,"explain":"縹，淡青色；縹碧即青綠色。白話翻譯：江水都是青綠色的，即使深達千丈也看得見水底。此句以顏色與深度並寫，突出江水的澄澈。"},{"level":"basic","topic":"字詞解釋","q":"「急湍甚箭」一句中「湍」與「甚」的解釋，何者正確？","choices":["湍：急流／甚：超過","湍：水中沙洲／甚：非常","湍：漩渦／甚：好像","湍：淺灘／甚：甚至"],"answer":0,"explain":"「湍」指急流，「甚」為「勝過、超過」。白話翻譯：湍急的水流比箭還快。「甚」若解為「非常」，全句便不成比較，語意不通。"},{"level":"basic","topic":"字詞解釋","q":"「夾岸高山，皆生寒樹」的「寒樹」，最恰當的解釋是？","choices":["只在冬天生長的樹","因天寒而枯萎凋零的樹","使人望之頓生寒意（清涼感）的濃密樹木","高大而稀疏的枯木"],"answer":2,"explain":"「寒樹」指樹木蔥鬱濃密，使人望之頓生清涼寒意，是從觀者感受落筆。白話翻譯：兩岸的高山上，都生長著使人感到清涼的樹木。並非指樹木枯死或季節限定。"},{"level":"basic","topic":"字詞解釋","q":"「負勢競上，互相軒邈」的「軒邈」是什麼意思？","choices":["高大寬廣的宮室","樹木枝葉交錯遮蔽","山勢平緩向遠方延伸","爭著往高處、往遠處伸展"],"answer":3,"explain":"軒，高；邈，遠；此處皆由形容詞轉作動詞。白話翻譯：山巒憑藉著地勢爭相向上，彼此比高比遠。以擬人筆法寫出群山競秀的氣勢。"},{"level":"basic","topic":"通同字","q":"「蟬則千轉不窮」的「轉」，其用法與意義為何？","choices":["通「囀」，指鳴叫聲宛轉不停","通「傳」，指聲音遠遠傳開","本義轉動，指蟬盤旋飛舞","通「輾」，指反覆不定"],"answer":0,"explain":"「轉」通「囀」，指鳥蟲宛轉鳴叫。白話翻譯：蟬不停地叫個沒完。下句「猿則百叫無絕」的「叫」正可互相參照，可知「轉」指的是叫聲。"},{"level":"basic","topic":"字詞解釋","q":"「鳶飛戾天者」的「戾」，在此應解釋為？","choices":["到達（直上高空）","違背、乖張","猛烈、暴戾","停留、棲息"],"answer":0,"explain":"「戾」為到達之意，「戾天」即直上高空。白話翻譯：那些像老鷹一樣極力想飛上高空的人（比喻熱切追求功名高位的人）。此處以鳥喻人，並非形容性情暴戾。"},{"level":"basic","topic":"通同字","q":"「經綸世務者，窺谷忘反」的「反」字，應如何理解？","choices":["反對、違逆","通「返」，返回","反覆、再三","反而、卻"],"answer":1,"explain":"「反」通「返」。白話翻譯：忙於籌劃政務的人，看到這樣幽美的山谷，便流連忘返（忘了回去）。「忘反」即「忘返」。"},{"level":"basic","topic":"字詞解釋","q":"「泉水激石，泠泠作響；好鳥相鳴，嚶嚶成韻」中，「泠泠」與「嚶嚶」所摹寫的聲音分別是？","choices":["泠泠是鳥聲，嚶嚶是水聲","泠泠是水聲，嚶嚶是鳥聲","兩者都是形容山谷的回音","兩者都是形容風吹樹葉的聲音"],"answer":1,"explain":"兩者皆為摹聲（狀聲）詞。白話翻譯：泉水沖激著石頭，發出泠泠的清響；美好的鳥兒互相和鳴，嚶嚶的叫聲形成和諧的音韻。依句子主語可知「泠泠」寫泉水，「嚶嚶」寫鳥鳴。"},{"level":"basic","topic":"文意理解","q":"全文開篇「風煙俱淨，天山共色」所描寫的景象是？","choices":["煙霧瀰漫，天與山難以分辨","風停霧散，天空和山峰呈現同樣的顏色","風雨交加，天色昏暗","炊煙裊裊，山色蒼茫"],"answer":1,"explain":"白話翻譯：風停了，煙霧也都消散乾淨，天空和遠山是同樣的顏色。「俱淨」寫空氣澄澈，「共色」寫天光山色渾然一體，為全文奠定明淨開闊的基調。"},{"level":"basic","topic":"文意理解","q":"「從流飄蕩，任意東西」一句，就字面所寫的行船情形而言，描述的是什麼？","choices":["逆流而上，奮力前行","沿著江岸步行遊覽","小船隨著江流漂行，任憑它向東或向西","東奔西走，居無定所"],"answer":2,"explain":"白話翻譯：（乘船）順著水流漂盪，任憑小船時而向東、時而向西。「從流」即順著水流，可見作者是乘船順流而下，並非逆流或步行。"},{"level":"basic","topic":"文學常識","q":"關於〈與宋元思書〉的作者、時代與文體，下列敘述何者正確？","choices":["東晉‧陶淵明所作，屬田園詩","北魏‧酈道元所作，屬地理專著","唐‧柳宗元所作，屬山水遊記","南朝梁‧吳均所作，屬駢體書信"],"answer":3,"explain":"本文作者吳均為南朝梁人，文章原是寫給友人（宋元思，一作朱元思）的書信，以駢文寫成，是六朝山水小品的名篇。題目冠以「與……書」，正是古代書信體的標示。"},{"level":"basic","topic":"文學常識","q":"本文屬駢文，下列何者最能說明駢文的形式特色？","choices":["全篇必須押韻，且句句用典","講求對偶，多用四字句與六字句，注重聲律與辭藻","句式長短不拘，主張不假雕飾","以主客問答的方式鋪陳事理"],"answer":1,"explain":"駢文又稱四六文，以對偶為基本要求，句式多為四言、六言，並講究聲律和諧、辭藻華美，如本文「泉水激石，泠泠作響；好鳥相鳴，嚶嚶成韻」即為工整的對偶句。"},{"level":"basic","topic":"字詞解釋","q":"「奇山異水，天下獨絕」的「絕」，意思最接近下列何者？","choices":["斷絕、中止","拒絕、排除","獨一無二、到了極點","極遠而隔絕不通"],"answer":2,"explain":"「獨絕」即獨一無二、無與倫比，「絕」有「到達極點」之意。白話翻譯：（這一帶）奇特的山、奇異的水，是天下獨一無二的。此處並非「斷絕」或「隔絕」之意。"},{"level":"basic","topic":"文意理解","q":"「橫柯上蔽，在晝猶昏」一句的意思是？","choices":["樹枝低垂擋住去路，行人必須彎腰而過","橫斜的樹枝在上方遮蔽著，即使白天也像黃昏一樣昏暗","山峰高聳擋住陽光，山谷終年不見天日","濃霧籠罩江面，白天看起來像夜晚"],"answer":1,"explain":"柯，樹枝；上蔽，在上方遮蔽。白話翻譯：橫斜的樹枝在上頭遮蔽著，即使是白天也像黃昏般昏暗。造成昏暗的是茂密的枝葉，並非山峰或濃霧。"},{"level":"adv","topic":"篇章結構","q":"「奇山異水，天下獨絕」一句在全文中的作用，下列說明何者最恰當？","choices":["屬於全文結尾的總結，用以呼應開頭","承上啟下，由寫景轉入議論說理","總冒（總起）全文，以下再分別就「異水」與「奇山」加以鋪寫","補敘行程細節，說明路程的遠近"],"answer":2,"explain":"白話翻譯：（這一帶）奇特的山、奇異的水，是天下獨一無二的。此句位於首段之末，先總括富春江山水之美，後文再依序分寫水與山，形成典型的「總—分」結構。"},{"level":"adv","topic":"修辭手法","q":"「急湍甚箭，猛浪若奔」主要運用了哪些修辭手法？","choices":["頂真兼層遞","設問兼呼告","排比兼倒裝","誇飾兼譬喻"],"answer":3,"explain":"白話翻譯：湍急的水流比箭還快，洶湧的浪濤像飛奔的馬。「甚箭」以勝過箭速形容水流，屬誇飾；「若奔」以奔馬比喻猛浪，屬譬喻（明喻）。兩句並為對偶，合寫水勢之猛。"},{"level":"adv","topic":"修辭手法","q":"「水皆縹碧，千丈見底」中的「千丈」，就修辭而言其作用為何？","choices":["誇飾，極言江水之深仍清澈見底","借代，以「千丈」代稱整條富春江","摹寫，狀寫水聲的高低起伏","設問，引導讀者思考江水有多深"],"answer":0,"explain":"「千丈」非實測數字，而是誇大其深以突顯水質之清。白話翻譯：江水都是青綠色的，即使深達千丈也看得見水底。深而能見底，正是「異水」澄澈的極致表現。"},{"level":"adv","topic":"寫作手法","q":"「負勢競上，互相軒邈，爭高直指，千百成峰」最主要的表現手法是？","choices":["以排比鋪陳群山的高度數據","以借代點出各山峰的名稱","以設問引起讀者的好奇","以擬人手法賦予山峰爭高競遠的動態"],"answer":3,"explain":"白話翻譯：山巒憑藉地勢爭相往上，彼此比高比遠，爭著向高處筆直聳立，形成千百座山峰。「負」「競」「爭」等字把靜止的山寫得像人一樣好勝，化靜為動，是擬人法的典型運用。"},{"level":"adv","topic":"寫作手法","q":"作者寫水，先以「水皆縹碧，千丈見底。游魚細石，直視無礙」描寫，再以「急湍甚箭，猛浪若奔」承接，這樣安排最能表現何種寫作技巧？","choices":["由遠及近的空間推移","由實入虛的想像","今昔對比的時間感","動靜相襯，兼寫水的澄澈與湍急"],"answer":3,"explain":"前者寫水面平緩清澈，游魚細石一望可見，屬靜態描寫；後者寫水流湍急奔騰，屬動態描寫。白話翻譯：水都是青綠色的，千丈深也看得見底，游魚和細小的石子可以一直看清楚，毫無阻礙。一靜一動相互映襯，使「異水」的形象更完整。"},{"level":"adv","topic":"意象分析","q":"文中連寫泉水泠泠、好鳥嚶嚶、蟬千轉不窮、猿百叫無絕，其作用最恰當的說明是？","choices":["說明山中物產豐富，適合居住","表現旅途的疲累與孤寂","從聽覺落筆，以繁密的聲響襯托山林的幽靜與蓬勃生機","暗示天色將晚，催促行人歸去"],"answer":2,"explain":"白話翻譯：泉水沖擊石頭發出泠泠聲響，美好的鳥兒相和而鳴，蟬叫個不停，猿聲也接連不斷。此段由前文的視覺描寫轉為聽覺描寫，聲音愈是不絕，愈顯出山谷的幽深寧靜，同時展現大自然的生命力，是「以聲襯靜」的手法。"},{"level":"adv","topic":"寫作手法","q":"「橫柯上蔽，在晝猶昏；疏條交映，有時見日」兩句對舉，最主要的用意是？","choices":["記錄山中日照時數，提醒遊人及早返家","描寫四季更迭中樹葉的枯榮變化","說明天氣陰晴不定，行船極為困難","以枝條疏密造成的明暗變化，寫出林木蔥蘢茂密、幽深宜人"],"answer":3,"explain":"白話翻譯：橫斜的枝條在上頭遮蔽著，白天也像黃昏一樣昏暗；稀疏的枝條彼此交錯掩映，有時可以看見陽光。一昏一明相互對照，正藉光線的變化側寫林木之密與山谷之幽。"},{"level":"adv","topic":"文意理解","q":"「鳶飛戾天者，望峰息心；經綸世務者，窺谷忘反」全句的意思，下列何者最恰當？","choices":["極力追求功名高位、忙於籌劃政務的人，看到這樣的山峰幽谷，也會平息追逐名利之心而流連忘返","飛鳥飛得再高也需要休息，人再忙碌也應該停下腳步","想要建功立業的人，應該登高望遠以立定志向","山高谷深，使得飛鳥與旅人都難以通行"],"answer":0,"explain":"「鳶飛戾天者」比喻熱衷功名的人，「經綸世務者」指忙於處理政務的人；「息心」是平息名利之心，「忘反」是忘記返回。白話翻譯：那些像鷹一樣一心想飛上高空的人，看到這些山峰就會平息名利之心；那些操持政務的人，看到這樣的山谷就會流連忘返。"},{"level":"adv","topic":"寫作手法","q":"作者不直接讚美山水如何動人，卻寫追名逐利者「望峰息心」、政務繁忙者「窺谷忘反」，這種寫法屬於？","choices":["開門見山，直接點題","側面烘托，藉人的感受反襯山水令人忘俗的魅力","首尾呼應，強化篇章結構","欲揚先抑，先貶後褒"],"answer":1,"explain":"作者從觀者的心理反應著筆，讓讀者由「連熱衷名利的人都被感動」推想山水之美，這是側面烘托（間接描寫）。同時藉此寄寓自己鄙棄名利、嚮往自然的情懷，達到借景抒情的效果。"},{"level":"adv","topic":"篇章結構","q":"就分寫景物的先後次序而言，本文的安排為何？","choices":["先寫水之異，再寫山之奇","先寫山之奇，再寫水之異","先寫聲音之美，再寫色彩之美","先寫人物活動，再寫自然景物"],"answer":0,"explain":"總冒句雖作「奇山異水」，但下文先以「水皆縹碧……猛浪若奔」寫富春江水，再以「夾岸高山……猿則百叫無絕」寫兩岸群山，是先水後山、由下而上的順序，層次分明。"},{"level":"adv","topic":"主旨探究","q":"下列何者最能概括〈與宋元思書〉一文的主旨？","choices":["記述行旅的艱辛，感嘆人生漂泊無定","藉描寫富春江的奇山異水，抒發鄙棄名利、嚮往自然的情懷","勸勉友人勤於經綸世務，及早建功立業","考證富陽至桐廬一帶的地理沿革"],"answer":1,"explain":"全文以「奇山異水，天下獨絕」總領，鋪寫富春江山水之美，再以「望峰息心」「窺谷忘反」收束，把寫景導向抒情，表達作者厭棄官場名利、寄情山水的心志，屬借景抒情之作。"},{"level":"adv","topic":"推論","q":"「從流飄蕩，任意東西」除了寫出行船的情形外，最能透露作者怎樣的心境？","choices":["前途茫茫、無所適從的焦慮","歸心似箭、急於返家的心情","隨遇而安、悠然自適，與自然相融的閒適","與友人分別後的依依不捨"],"answer":2,"explain":"白話翻譯：（小船）順著水流漂盪，任憑它向東或向西。「任意」二字表示不刻意安排航向，把自己交給山水，流露出無拘無束、悠然自得的情懷，也為後文「望峰息心」「窺谷忘反」的超脫之意先作鋪墊。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], queue=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); queue=[]; }
/* 洗牌後依序發牌：整池抽完才重洗，一輪內不重複；重洗時避免與上一題相接 */
function refillQueue(){ queue = poolIdx.slice();
  for(let k=queue.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=queue[k]; queue[k]=queue[r]; queue[r]=t; }
  if(queue.length>1 && queue[queue.length-1]===lastIdx){ const t=queue[queue.length-1]; queue[queue.length-1]=queue[0]; queue[0]=t; }
}
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ if(!queue.length) refillQueue(); const i=queue.pop(); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
