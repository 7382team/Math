<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"交通工具名詞 (bike)","q":"Kevin often rides his ___ along the river on weekends. It has two wheels and doesn't need gas.","choices":["ship","plane","bike","train"],"answer":2,"explain":"由 \"two wheels\"（兩個輪子）和 \"doesn't need gas\"（不需汽油）可知答案是 bike（腳踏車），而且 ride 常用於腳踏車、機車。(A) ship 是船、(B) plane 是飛機、(D) train 是火車，都不符合「兩個輪子、不用汽油」的敘述，也不會說 rides his ship/plane 沿著河邊。"},{"level":"basic","topic":"by + 交通工具（不加冠詞）","q":"It takes me about thirty minutes to get to school ___ every morning.","choices":["by a bus","by bus","by the buses","on bus"],"answer":1,"explain":"表示交通方式時用「by + 交通工具」，中間不加冠詞 a/the，名詞用單數：by bus, by train, by car, by bike, by plane。(A) 多了 a；(C) 加了 the 又用複數 buses，兩個錯誤；(D) 只有走路才用 on（on foot），交通工具要用 by。"},{"level":"basic","topic":"on foot（走路去）","q":"The post office is just two minutes away, so we always go there ___.","choices":["by foot","by a foot","on feet","on foot"],"answer":3,"explain":"「走路去」的固定用法是 on foot，介系詞用 on，foot 用單數。(A) by foot 是台灣學生最常見的錯誤，交通工具才用 by；(B) 不可加冠詞 a；(C) foot 不能改成複數 feet。本句也可以改寫成 we always walk there。"},{"level":"basic","topic":"take + a + 交通工具","q":"It's raining hard and there is no bus now. Let's ___ to the train station.","choices":["take a taxi","take taxi","by a taxi","taking taxi"],"answer":0,"explain":"「搭乘某交通工具」用 take 時，後面一定要加冠詞：take a taxi / take a bus / take the MRT。(B) 少了冠詞 a；(C) by taxi 前面不能加 a，而且 Let's 後面需要動詞；(D) Let's 後面必須接原形動詞，不能用 taking。"},{"level":"basic","topic":"ride a bike","q":"My little sister can ___ a bike now, but she is still too young to drive a car.","choices":["drive","ride","take off","fly"],"answer":1,"explain":"跨坐式的交通工具（腳踏車、機車、速可達）用 ride：ride a bike / ride a motorcycle / ride a scooter。(A) drive 用於汽車，句尾已經出現 drive a car；(C) take off 是「起飛、脫下」；(D) fly 用於飛機。"},{"level":"basic","topic":"drive a car","q":"Mr. Lin ___ his car to the factory every morning because there is no bus there.","choices":["rides","takes on","drives","walks"],"answer":2,"explain":"「開車」用 drive a car，主詞 Mr. Lin 是第三人稱單數，動詞加 s 成為 drives。(A) ride 用於腳踏車、機車，不用於自己開的汽車；(B) 沒有 take on a car 這種搭乘用法，搭公車是 take a bus；(D) walk 是走路，後面不能接 his car。"},{"level":"basic","topic":"How do you go to school? 的回答","q":"A: How do you go to school every day?  B: ___","choices":["I go to school by bus.","I go to school by a bus.","I go school by bus.","I go to school with bus."],"answer":0,"explain":"回答交通方式可用「by + 交通工具」，且 by 後不加冠詞：I go to school by bus.。(B) 多了 a；(C) go 後面接地點要有介系詞 to（go to school）；(D) 交通方式不用 with。也可以回答 I take the bus to school.。"},{"level":"basic","topic":"walk to school 與第三人稱單數","q":"Amy's house is right next to the school, so she ___ to school every day.","choices":["walk","walking","is walk","walks"],"answer":3,"explain":"walk to school（走路上學）＝ go to school on foot。主詞 she 是第三人稱單數，且時間是 every day（現在簡單式），動詞要加 s 成為 walks。(A) 缺 s；(B) walking 前面必須有 be 動詞；(C) is 後面不能直接接原形動詞 walk。"},{"level":"basic","topic":"get off（下公車）","q":"Please ___ the bus at the next stop. The night market is just across the street.","choices":["get out of","get down","get off","get in"],"answer":2,"explain":"公車、火車、捷運、飛機這類可以站起來走動的大型交通工具，上車用 get on，下車用 get off。(A) get out of 用於小汽車、計程車；(B) get down 是「蹲下、下來」，不是下車；(D) get in 是進入小汽車。"},{"level":"basic","topic":"get out of（下小汽車）","q":"Grandma opened the door and ___ the car slowly with her bag in her hand.","choices":["got out of","got off","got down from","got out from"],"answer":0,"explain":"小汽車、計程車空間小，上車用 get in，下車用 get out of。(B) got off 用於公車、捷運、火車；(C) got down from 與 (D) got out from 都不是英文中「下車」的正確搭配。"},{"level":"basic","topic":"get to + 地點","q":"What time do you usually ___ school in the morning?","choices":["arrive to","get on","arrive","get to"],"answer":3,"explain":"「到達某地」可用 get to + 地點：get to school / get to work / get to the station。(A) 英文沒有 arrive to 的用法；(B) get on 是上車；(C) arrive 後面接地點一定要加介系詞（arrive at school），不能直接接名詞。"},{"level":"basic","topic":"arrive in + 城市","q":"We ___ Tokyo last Friday and stayed there for a week.","choices":["arrived to","arrived in","arrived on","arrive in"],"answer":1,"explain":"arrive 接大地方（城市、國家）用 in，接小地方（車站、機場、學校）用 at；句中有 last Friday，動詞必須用過去式，所以是 arrived in。(A) 沒有 arrive to；(C) arrived on 不能接城市；(D) 時態錯誤，應為過去式。"},{"level":"basic","topic":"by plane","q":"My uncle works in New York, so he goes there ___ twice a year.","choices":["by plane","by a plane","on plane","with a plane"],"answer":0,"explain":"搭飛機的交通方式是 by plane，by 後面不加冠詞、名詞用單數。(B) 多了 a；(C) on plane 不成立，要說 on the plane 時是指「在飛機上」，不是交通方式；(D) with 不能用來表示交通方式。"},{"level":"basic","topic":"take the MRT 與第三人稱單數","q":"A: How does your father get to work?  B: He ___ to work every day.","choices":["take MRT","takes MRT","take the MRT","takes the MRT"],"answer":3,"explain":"主詞 He 是第三人稱單數，動詞要加 s；而且 take 後面接捷運要加冠詞 the：takes the MRT。(A) 動詞沒加 s 又缺冠詞；(B) 缺冠詞 the；(C) 動詞沒加 s。補充：捷運在英國稱 the underground，在美國多稱 the subway。"},{"level":"adv","topic":"get on（上公車）與 get in 辨析","q":"The bus is here. Please ___ the bus and find a seat quickly.","choices":["get in","get on","get to","get off"],"answer":1,"explain":"公車、火車、捷運、飛機用 get on 表示「上車」。(A) get in 用於小汽車、計程車（get in the car）；(C) get to 是「到達某地」，get to the bus 不合理；(D) get off 是「下車」，與句中「找位子坐」的情境矛盾。整組用法：大車 get on / get off，小車 get in / get out of。"},{"level":"adv","topic":"take a bus 與 by bus 同義句","q":"Amy takes a bus to the train station every morning. Which sentence has the same meaning?","choices":["Amy goes to the train station by a bus.","Amy goes to the train station on bus.","Amy goes to the train station by bus.","Amy drives a bus to the train station."],"answer":2,"explain":"take a bus 可改寫成 go ... by bus，但 by 後面不加冠詞。(A) 多了 a；(B) 交通方式不用 on（on the bus 是指「在公車上」）；(D) drive a bus 是「開公車」，Amy 變成司機，意思完全不同。"},{"level":"adv","topic":"方位介系詞：turn left at","q":"Go straight for two blocks and turn left ___ the second traffic light. The MRT station is on your right.","choices":["in","on","to","at"],"answer":3,"explain":"指路時，在某個「點」轉彎用 at：turn left at the corner / at the second traffic light / at the bank。(A) in 用於較大的空間範圍（in Taipei, in the park）；(B) on 用於街道或某個面（on Park Road, on your right）；(C) to 表示方向或目的地（go to the station），不能接紅綠燈當轉彎的地點。"},{"level":"adv","topic":"天氣形容詞 windy 的拼字","q":"A typhoon is coming. It's too ___ to ride a scooter, so Dad drove us home.","choices":["windy","wind","windly","winding"],"answer":0,"explain":"「風大的」是形容詞 windy（wind + y），too + 形容詞 + to V 表示「太…而不能…」。(B) wind 是名詞「風」，不能放在 too 後面；(C) windly 不是英文單字；(D) winding 是「蜿蜒的」，用來形容道路，不能形容天氣。同類拼法：sunny 晴朗的、rainy 下雨的、cloudy 多雲的、snowy 下雪的、foggy 有霧的。"},{"level":"adv","topic":"How did ... get to ...? 問句時態","q":"A: ___ your sister get to the airport yesterday?  B: She took a taxi.","choices":["How does","How is","How did","How do"],"answer":2,"explain":"句中有 yesterday，回答也用過去式 took，所以問句要用助動詞 did：How did she get to...?，後面動詞用原形 get。(A)(D) 是現在式，與 yesterday 不合；(B) How is 後面不能接原形動詞 get。"},{"level":"adv","topic":"arrive at + 小地點","q":"We ___ the bus station at 7:30 and waited for the driver for twenty minutes.","choices":["arrived to","arrived at","arrived","arrived in"],"answer":1,"explain":"bus station 是「小地點」，arrive 後面要用 at；本句也可以改成 got to the bus station。(A) 英文沒有 arrive to；(C) arrive 後接地點一定要有介系詞；(D) arrive in 用於城市、國家等大地方，例如 arrive in Taipei。"},{"level":"adv","topic":"How long does it take 問句判斷","q":"A: ___  B: It takes about twenty minutes by train.","choices":["How do you go to Yilan?","How long does it take to get to Yilan by train?","How far is Yilan from here?","When does the train to Yilan leave?"],"answer":1,"explain":"回答 It takes about twenty minutes 是在說「花多少時間」，所以問句要用 How long does it take...?。(A) How 問交通方式，應回答 By train.；(C) How far 問距離，應回答 About thirty kilometers.；(D) When 問出發的時間點，應回答 At 9:00.。"},{"level":"adv","topic":"How do you get to school? 問句判斷","q":"A: ___  B: I usually ride my bike, but I take the bus when it rains.","choices":["How far is your school?","Where do you park your bike?","How do you get to school?","When do you leave home?"],"answer":2,"explain":"回答說明的是「騎腳踏車、下雨改搭公車」，屬於交通方式，所以問句用 How do you get to school?（＝How do you go to school?）。(A) How far 問距離；(B) 問停車的地點；(D) When 問出門的時間。"},{"level":"adv","topic":"by + 交通工具不可加冠詞","q":"Which sentence about going to work is NOT correct in English?","choices":["Sandy goes to work by a scooter.","Sandy rides a scooter to work.","Sandy goes to work by scooter.","Sandy takes the bus to work."],"answer":0,"explain":"by + 交通工具中間不可以加冠詞，所以 by a scooter 是錯的，應改成 by scooter。(B) 機車、速可達、腳踏車用 ride a...，正確；(C) by scooter 沒有冠詞，正確；(D) take 後面加冠詞 the bus，正確。"},{"level":"adv","topic":"rainy（形容詞）與 rain（名詞）辨析","q":"Because of the ___ weather, my mom drove me to school this morning.","choices":["rain","rains","raining","rainy"],"answer":3,"explain":"weather 是名詞，前面要用形容詞修飾，「下雨的天氣」是 rainy weather。(A) rain 是名詞或動詞，不能直接修飾 weather；(B) rains 是動詞第三人稱單數；(C) raining 只用在 It is raining. 這類進行式，不能用來修飾 weather。若要用名詞可改成 Because of the rain, ...。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ let i; do{ i=poolIdx[Math.floor(Math.random()*poolIdx.length)]; }while(poolIdx.length>1 && i===lastIdx); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
