<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"地理大發現的背景－傳統商路受阻","q":"十五世紀時，歐洲人對東方的香料、絲綢需求殷切，但商品必須經過層層轉運才能送到西歐，價格因而昂貴。下列哪一項是促使歐洲人急於尋找通往東方新航路的重要原因？","choices":["鄂圖曼土耳其帝國興起，掌控東西交通要道，傳統商路受到阻礙","美洲原住民封鎖太平洋航線，禁止歐洲船隻通行","歐洲各國立法禁止人民使用香料，商人只好向外另尋市場","中國明朝出兵佔領地中海，斷絕歐洲與亞洲的往來"],"answer":0,"explain":"鄂圖曼土耳其帝國興起後控制東地中海與西亞的交通要道，東方商品輾轉運到西歐價格高昂，促使歐洲人另闢新航路。「美洲原住民封鎖太平洋」「明朝出兵地中海」都不是史實；當時歐洲對香料的需求正熱絡，也沒有立法禁用香料。"},{"level":"basic","topic":"海外探險的動機－宗教熱忱","q":"有學者以「黃金、香料與上帝」概括推動歐洲人展開海外探險的動力。其中「上帝」所指的是下列何者？","choices":["希望在海外開採更多金礦以充實國庫","想要直接向東方購得較便宜的香料與絲綢","抱著向海外異教徒傳播基督教的宗教熱忱","打算在新土地上興建學校，推廣科學研究"],"answer":2,"explain":"「上帝」代表向海外傳播基督教的宗教熱忱，是航海探險重要的精神動力。開採金礦對應的是「黃金」，購買香料絲綢對應的是「香料」，兩者雖也是探險動機，卻不是「上帝」所指；推廣科學研究則非當時航海的主要目的。"},{"level":"basic","topic":"航海技術的進步－羅盤","q":"大航海時代來臨前，歐洲人吸收並改良了許多航海技術。其中「羅盤（指南針）」對遠洋航行最主要的貢獻是什麼？","choices":["可以精確測量船隻所在的經度與緯度","在看不見陸地或星象時，仍能判別航行的方向","能夠事先預測颱風與海嘯發生的時間","使船隻不必依靠風力也能持續前進"],"answer":1,"explain":"羅盤能在陰天、夜間或遠離陸地時指示方向，是遠洋航行的關鍵工具。測定位置並非羅盤的功能，當時緯度多靠星盤、象限儀觀測天體，經度的精確測定要到更晚才解決；預測颱風海嘯與羅盤無關，帆船也仍須依靠風力前進。"},{"level":"basic","topic":"葡萄牙的探險－迪亞士與好望角","q":"葡萄牙人在王室支持下，長期沿著非洲西岸南下探險，後來由迪亞士率領船隊抵達非洲最南端的海角，這裡也成為日後歐洲通往印度航路的關鍵地點。這個海角是指下列何者？","choices":["南美洲南端的合恩角","南美洲南端的麥哲倫海峽","非洲南端的好望角","歐洲與非洲之間的直布羅陀海峽"],"answer":2,"explain":"迪亞士率船隊抵達非洲最南端的海角，後來被葡萄牙國王命名為「好望角」，象徵繞過非洲通往印度的希望，達伽馬即由此繼續東行抵達印度。合恩角與麥哲倫海峽都位於南美洲南端，直布羅陀海峽則是地中海與大西洋之間的通道，都不在非洲南端。"},{"level":"basic","topic":"西班牙的探險－哥倫布抵達美洲","q":"哥倫布在西班牙王室支持下向西航行，抵達陸地後始終認為自己到達的是亞洲的印度。此一誤解造成下列哪一個結果？","choices":["歐洲人將美洲原住民稱為「印第安人」","歐洲人從此把美洲稱為「香料群島」","西班牙因此放棄在美洲的一切經營","葡萄牙隨即宣布放棄非洲航路的探索"],"answer":0,"explain":"哥倫布至死認為自己抵達亞洲的印度，因而稱當地居民為「印第安人」，此一稱呼沿用至今。「香料群島」指的是東南亞一帶，並非美洲；此後西班牙大力經營美洲，葡萄牙也持續經營非洲—印度航路，與放棄經營的說法相反。"},{"level":"basic","topic":"三角貿易與奴隸貿易","q":"新航路開闢後，歐洲、非洲與美洲之間形成「三角貿易」。關於這種貿易形式的敘述，下列何者正確？","choices":["美洲商人先把黑奴運到歐洲工廠工作，再將歐洲的香料運到非洲販賣","非洲商人先到美洲購買白銀，再運往歐洲換取茶葉與瓷器","歐洲、非洲與美洲三地互相贈送特產，並未涉及買賣與獲利","歐洲人把紡織品、槍枝運到非洲換取黑奴，再把黑奴運到美洲出售，最後將美洲的蔗糖、菸草運回歐洲"],"answer":3,"explain":"三角貿易的三邊是：歐洲的紡織品、槍枝等運往非洲換取黑奴，黑奴運往美洲的種植園與礦場，美洲的蔗糖、菸草、棉花等再運回歐洲。把黑奴運到歐洲工廠、由非洲商人赴美洲買白銀等說法都把貨物與人口的流向顛倒；而三角貿易正是以牟取暴利為目的的商業活動，並非互贈特產。"},{"level":"basic","topic":"物種交流－美洲作物傳入舊大陸","q":"新航路開闢後，世界各地作物出現大規模交流。下列哪一組作物原產於美洲，後來傳入亞、歐、非洲，成為許多地區重要的糧食？","choices":["小麥、稻米、大麥","茶葉、甘蔗、胡椒","葡萄、橄欖、蘋果","玉米、馬鈴薯、番薯"],"answer":3,"explain":"玉米、馬鈴薯、番薯（甘藷）原產美洲，新航路開闢後傳入舊大陸，成為重要的糧食來源。小麥、稻米、大麥與葡萄、橄欖、蘋果均原產舊大陸；茶葉、甘蔗、胡椒同樣來自舊大陸，傳播方向與題意相反。"},{"level":"basic","topic":"物種交流－舊大陸傳入美洲","q":"歐洲人來到美洲後，也把舊大陸的作物與動物帶進美洲，改變當地的農牧生活。下列何者屬於由舊大陸傳入美洲的項目？","choices":["小麥與牛、馬、豬、羊等牲畜","番茄與可可","玉米與辣椒","馬鈴薯與番薯"],"answer":0,"explain":"小麥與牛、馬、豬、羊等大型牲畜原本美洲沒有，是歐洲人帶入後才改變當地的農牧型態，馬更改變了原住民的移動與作戰方式。番茄、可可、玉米、辣椒、馬鈴薯、番薯都原產美洲，是由美洲外傳，傳播方向相反。"},{"level":"basic","topic":"美洲古文明的分布","q":"歐洲人抵達美洲時，當地已存在發展成熟的古文明。下列有關美洲古文明的敘述，何者正確？","choices":["馬雅、阿茲提克與印加都集中在北美洲的五大湖一帶","阿茲提克文明位於今日墨西哥一帶，印加文明位於南美洲安地斯山區","這些文明都是歐洲移民抵達美洲後才建立的","這些文明都沒有城市與神廟，只有零星的游牧部落"],"answer":1,"explain":"阿茲提克位於今墨西哥高原一帶，印加位於南美洲安地斯山區，馬雅則分布於中美洲猶加敦半島一帶，並非集中於北美五大湖。這些文明在歐洲人到來之前即已存在，時序不能顛倒；三者也都建有城市、神廟與複雜的統治組織，並非游牧部落。"},{"level":"basic","topic":"美洲原住民人口銳減的原因","q":"歐洲人殖民美洲後，當地原住民人口急遽減少。造成人口銳減最主要的原因是下列何者？","choices":["原住民大量遷徙到歐洲定居","美洲長期發生火山爆發與地震","原住民對天花等外來傳染病缺乏抵抗力，又被迫從事礦場與莊園的繁重勞役","美洲糧食作物大量外傳，本地無糧可食而普遍餓死"],"answer":2,"explain":"天花、麻疹等舊大陸傳染病是原住民人口銳減最主要的原因，殖民者強制的礦場與莊園勞役更加重死亡。原住民大量遷居歐洲、長期火山地震等說法都不是史實；美洲作物外傳是往外擴散，並未使當地無糧可食。"},{"level":"basic","topic":"白銀流通與商業革命","q":"美洲的金銀被大量開採並運往歐洲後，對歐洲社會經濟造成明顯衝擊。下列敘述何者最符合當時情況？","choices":["貴金屬大增使歐洲物價普遍上漲，貿易規模擴大，商人與銀行家地位提高","歐洲物價因金銀過多而長期下跌，商業活動陷入停頓","歐洲各國因此廢除貨幣，恢復以物易物的交易方式","金銀全部集中於教會手中，商人被禁止從事海外貿易"],"answer":0,"explain":"大量金銀流入使歐洲貨幣供給增加、物價長期上漲，同時貿易規模擴大、公司與銀行興起，史稱商業革命。物價是上漲而非下跌，商業也未停頓；歐洲此後更依賴貨幣經濟與海外貿易，並未恢復以物易物，商人也未被禁止經商。"},{"level":"basic","topic":"重商主義的主張","q":"新航路開闢後，歐洲各國政府普遍採行重商主義。下列哪一項政策最符合重商主義的主張？","choices":["開放外國商品自由進口，並取消一切關稅","獎勵本國商品輸出、限制外國商品輸入，並積極取得海外殖民地與市場","由政府平均分配土地給農民，並禁止商人經商","鼓勵人民把金銀運往國外，以換取他國的友誼"],"answer":1,"explain":"重商主義以金銀多寡衡量國家財富，因而獎勵出口、限制進口以求貿易順差，並奪取殖民地作為原料產地與市場。自由進口、取消關稅是後來自由貿易的主張；禁止經商與把金銀送往國外，則與重商主義累積財富的目標背道而馳。"},{"level":"basic","topic":"東印度公司的性質","q":"十七世紀前後，荷蘭、英國等國陸續成立東印度公司，前往亞洲從事貿易。關於東印度公司的敘述，下列何者正確？","choices":["由亞洲各國共同出資成立，用來聯合抵抗歐洲商船的貿易同盟","是純粹的宗教團體，只在亞洲傳教，不從事任何商業活動","由羅馬教宗直接管理，各國政府都不得介入其貿易事務","是獲得政府特許的貿易公司，壟斷特定地區貿易，並可擁有武力、建立據點"],"answer":3,"explain":"東印度公司是由政府特許成立的股份貿易公司，壟斷特定地區貿易，並可擁有武力、築城、締約，兼具商業與統治性質，荷蘭東印度公司即以此在臺灣建立據點。它並非亞洲各國的同盟，也不是宗教團體，更不受教宗管轄。"},{"level":"basic","topic":"海權擴張與臺灣－荷蘭據點","q":"十七世紀時，荷蘭人在臺灣南部建立統治中心並從事轉口貿易，西班牙人則一度佔領臺灣北部。荷蘭人在臺灣南部所興建的主要城堡是下列何者？","choices":["淡水紅毛城","熱蘭遮城","億載金城","十三行遺址"],"answer":1,"explain":"荷蘭人以大員（今臺南安平一帶）為統治中心，興建熱蘭遮城，另於赤崁興建普羅民遮城。淡水紅毛城位於臺灣北部，是西班牙人、荷蘭人先後在北部經營的據點；億載金城為清代所建的砲臺；十三行遺址則屬史前文化遺址，都與荷蘭在南部的統治中心無關。"},{"level":"adv","topic":"商路轉手與新航路動機（史料判讀）","q":"十五世紀末，一位西歐商人在信中抱怨：「來自東方的胡椒，經過許多商人層層轉賣才送到我們的市集，價錢比在產地時高出許多。」這段話最能說明下列哪一項情勢？","choices":["當時歐洲人並不喜歡使用香料，需求量很低","東方各國全面禁止香料出口，歐洲完全買不到香料","傳統東西商路中間轉手多、費用高，促使歐洲人想尋找直通東方的新航路","歐洲各國對香料課徵重稅，人民因而改用美洲傳來的辣椒替代"],"answer":2,"explain":"東方商品經阿拉伯、義大利等中間商層層轉手，加上鄂圖曼帝國控制商路，售價遠高於產地，這正是歐洲人想開闢直通東方新航路的動機。信中反映的是需求旺盛而非低落；信中也未提到全面禁運或課徵重稅，且辣椒是新航路開闢後才由美洲傳入，時序錯置。"},{"level":"adv","topic":"印度新航路（航海紀錄判讀）","q":"某位船長的航海紀錄寫著：「我們沿著非洲西岸一路南下，繞過大陸最南端的海角後轉向東北，橫越大洋，最後在印度西岸的港口下錨，當地早已有阿拉伯商人往來貿易。」這段紀錄最可能是下列哪一件事？","choices":["哥倫布橫渡大西洋抵達美洲的航行","麥哲倫船隊首次完成環球航行的過程","荷蘭人前往臺灣建立轉口據點的經過","葡萄牙人開闢繞行非洲直達印度新航路的航行"],"answer":3,"explain":"沿非洲西岸南下、繞過好望角後轉向東北抵達印度西岸，正是葡萄牙人（達伽馬）開闢的印度航路；紀錄中提到阿拉伯商人，也符合印度洋原有的貿易網絡。哥倫布是向西橫渡大西洋，麥哲倫船隊須穿越南美洲南端進入太平洋，荷蘭人前往臺灣的航線則與繞行非洲抵印度無關。"},{"level":"adv","topic":"環球航行的意義（航海紀錄判讀）","q":"一份航海報告記載：「船隊自西班牙出發向西橫渡大西洋，穿越南美洲南端的海峽進入一片浩瀚大洋，繼續西行抵達亞洲的島嶼，最後經非洲南端返回出發的港口。」這趟航行最重要的歷史意義是什麼？","choices":["首次完成環繞地球一周，證實地球是球體，各大洋彼此相通","首次發現非洲南端的好望角，開啟葡萄牙的印度航路","首次證明美洲與亞洲之間並沒有海洋相隔","首次把美洲的馬鈴薯與玉米引進非洲種植"],"answer":0,"explain":"由西班牙向西出發、穿越南美洲南端海峽進入太平洋、抵達亞洲後再經非洲南端回航，即麥哲倫船隊的環球航行，證實地球為球體且各大洋彼此相通。發現好望角是迪亞士的事蹟；美洲與亞洲之間隔著遼闊的太平洋，並非毫無海洋相隔；引進作物也不是此次航行的主要意義。"},{"level":"adv","topic":"黑奴貿易興起的因果","q":"十六世紀以後，歐洲人在美洲大量經營甘蔗、菸草等種植園，並從非洲運入大批黑奴。促成非洲奴隸貿易迅速擴大的主要原因是什麼？","choices":["非洲人自願前往美洲，希望取得土地成為地主","美洲原住民因傳染病與繁重勞役大量死亡，種植園與礦場嚴重缺乏勞動力","歐洲人認為非洲人擅長航海，需要他們駕駛遠洋船隻","美洲禁止歐洲人從事農業，只好由非洲人代為耕作"],"answer":1,"explain":"原住民人口銳減使美洲勞動力嚴重不足，歐洲人遂大規模自非洲強擄、販運奴隸，形成三角貿易的一環。黑奴是被強迫販運而非自願移民；至於因擅長航海而被徵用、或美洲禁止歐洲人務農等說法，都與史實不符。"},{"level":"adv","topic":"美洲作物傳播的影響","q":"明清時期的中國與歐洲部分地區，先後引進來自美洲的番薯與玉米，這些作物耐旱、能在較貧瘠的山地生長。這對當地社會最可能造成下列哪一種影響？","choices":["使當地完全放棄稻米與小麥，改以單一作物維生","因作物來自海外而被政府全面禁種，引發大規模饑荒","增加糧食來源、擴大可耕地範圍，有助於人口成長","農民不必再耕作，紛紛轉往城市成為工廠工人"],"answer":2,"explain":"番薯、玉米可種於原本不適合稻麥的山坡與貧瘠土地，增加糧食供給，是明清人口成長的重要因素之一。稻、麥仍是主要糧食，並未被完全取代；這些作物也未被禁種；至於農民大量進入工廠，是工業革命之後的現象，時代錯置。"},{"level":"adv","topic":"白銀流通與全球貿易網絡","q":"有學者描述：「美洲礦場開採的白銀，一部分運回歐洲，一部分則由船隊橫越太平洋運到亞洲，用以購買中國的絲綢與瓷器；這些商品再被運往世界各地販售。」這段敘述最能說明下列哪一種現象？","choices":["美洲已成為當時世界上工業最發達的地區","中國因此開始大量向美洲輸出白銀","歐洲各國決定放棄海外貿易，改採自給自足","新航路開闢後，美洲、歐洲與亞洲被連結成一個全球性的貿易網絡"],"answer":3,"explain":"白銀由美洲流向歐洲，並經太平洋航線流入亞洲換取中國商品，商品再轉銷各地，顯示三大洲已被連成全球貿易網，是「全球連結」的具體表現。當時美洲以礦產與種植園經濟為主，並非工業最發達；白銀是流入中國而非由中國輸出；歐洲此後更積極經營海外貿易，並未改採自給自足。"},{"level":"adv","topic":"美洲古文明衰亡的原因","q":"人數不多的西班牙人，卻能在短時間內擊敗美洲的阿茲提克與印加等古文明。下列哪一項組合最能解釋這個結果？","choices":["西班牙人擁有火器與馬匹，又帶來原住民缺乏抵抗力的傳染病，並拉攏當地不滿的部族結盟","西班牙人以蒸汽軍艦與機關槍等新式武器，輕易擊潰美洲各地的大軍","美洲古文明人口極為稀少，既沒有城市，也沒有任何統治組織與軍隊","美洲原住民主動邀請西班牙人前來統治，並在短期內集體改信基督教"],"answer":0,"explain":"武器與馬匹的優勢、天花等傳染病重創原住民，加上聯合受阿茲提克壓迫的部族，是西班牙人以少勝多的關鍵。蒸汽軍艦與機關槍是十九世紀的產物，時代錯置；這些文明擁有龐大人口、城市與軍隊，並曾激烈抵抗，並非主動邀請外人統治。"},{"level":"adv","topic":"海權擴張對臺灣的影響","q":"十七世紀，荷蘭人以臺灣南部為據點，收購鹿皮、蔗糖轉運日本，也把中國的生絲、瓷器轉賣各地，並招募漢人來臺開墾。這段歷史最能說明什麼？","choices":["臺灣位置偏僻，長期與外界的貿易網絡相互隔絕","臺灣位居東亞海上交通要衝，被捲入歐洲人主導的國際貿易網絡","荷蘭人以臺灣作為對抗鄂圖曼帝國的軍事基地","荷蘭人在臺灣推動工業革命，設立大型機器工廠"],"answer":1,"explain":"荷蘭以大員為轉口據點，串連中國、日本與東南亞的商品流通，臺灣自此被納入國際貿易體系，也開啟漢人大量移墾。題幹所述正好與「與外界隔絕」相反；鄂圖曼帝國位於西亞，與荷蘭經營臺灣無關；工業革命發生於十八世紀後的歐洲，時代錯置。"},{"level":"adv","topic":"全球連結的形成與代價","q":"老師在課堂上總結：「大航海時代使世界各地首次緊密連結，但這樣的連結也付出了代價。」下列哪一項最適合作為這句話中「代價」的例證？","choices":["歐洲人使用羅盤與新式帆船，航海技術大幅提升","美洲的玉米、番薯傳入亞洲與非洲，成為重要糧食","大量非洲人被販賣為奴，美洲原住民人口銳減、古文明走向衰亡","歐洲商人與銀行家地位提高，商業活動更加發達"],"answer":2,"explain":"奴隸貿易、原住民人口銳減與古文明衰亡，是全球連結背後的沉重代價。航海技術提升屬於技術進步，美洲作物外傳是物種交流帶來的正面影響，商人與銀行家地位提高則是商業革命的結果，三者都不屬於「代價」。"},{"level":"adv","topic":"重商主義下的殖民地經濟（情境判斷）","q":"某國政府規定：殖民地生產的原料只能運回母國，殖民地不得自行與其他國家貿易，也不准發展會與母國競爭的手工業。這種規定對殖民地最直接的影響是什麼？","choices":["殖民地可以自由選擇貿易對象，經濟迅速走向獨立","殖民地的工商業獲得母國全力扶植，發展程度超越母國","殖民地與母國之間從此完全停止一切商品往來","殖民地淪為母國的原料產地與商品市場，經濟發展受到限制"],"answer":3,"explain":"母國壟斷殖民地貿易、限制其發展工商業，是重商主義為累積金銀、追求貿易順差而採行的措施，結果使殖民地只能供應原料、購買母國商品，日後也成為殖民地不滿母國的原因之一。「自由選擇貿易對象」「工商業超越母國」都與規定內容相反；規定並非停止往來，而是要求貿易只能對母國進行。"}];

/* 洗牌後依序發牌：整池抽完才重洗，一輪內不重複；重洗時避免與上一題相接 */
function refillQueue(){ queue = poolIdx.slice();
  for(let k=queue.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=queue[k]; queue[k]=queue[r]; queue[r]=t; }
  if(queue.length>1 && queue[queue.length-1]===lastIdx){ const t=queue[queue.length-1]; queue[queue.length-1]=queue[0]; queue[0]=t; }
}
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ if(!queue.length) refillQueue(); const i=queue.pop(); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
