  .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 8px 24px -18px rgba(20,25,50,.35);}
  .q{font-size:18px;font-weight:500;line-height:1.65;min-height:52px;}

  .opt .mk{width:26px;height:26px;flex:none;border-radius:8px;background:var(--key);color:var(--ink-soft);

  .opt.pick{border-color:var(--ink);}
  .opt.ok{border-color:var(--right);background:#f0fdf4;color:var(--right);} .opt.ok .mk{background:var(--right);color:#fff;}
  .opt.no{border-color:var(--wrong);background:#fff1f4;color:var(--wrong);} .opt.no .mk{background:var(--wrong);color:#fff;}
  .opt.lock{cursor:default;}
  @keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}

  .explain{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:14px;display:none;}
  .explain.show{display:block;}
  .explain .lead{font-size:12px;color:var(--subj);letter-spacing:1px;margin-bottom:4px;}
  .explain .body{font-size:15px;line-height:1.8;color:var(--ink);}
  .explain .kp{font-size:12px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px;}
  .go{border:none;border-radius:16px;height:56px;width:100%;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:1px;

  .go:active{transform:scale(.98);} .go:disabled{opacity:.35;}

<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"命題的敘述—前提與結論","q":"命題「若兩直線平行，則同位角相等」中，「兩直線平行」這一部分在命題中稱為什麼？","choices":["結論","前提（假設）","反例","公理"],"answer":1,"explain":"「若P則Q」的形式中，P 是前提（假設），Q 是結論。此題 P 為「兩直線平行」，Q 為「同位角相等」。選「結論」是把前提與結論的位置弄反；「反例」是用來推翻命題的例子；「公理」是不必證明就接受的基本性質，都與此處的角色不同。"},{"level":"basic","topic":"逆敘述的寫法","q":"命題「若一個三角形是等邊三角形，則它是等腰三角形」的逆敘述是下列何者？","choices":["若一個三角形是等腰三角形，則它是等邊三角形","若一個三角形不是等邊三角形，則它不是等腰三角形","若一個三角形不是等腰三角形，則它不是等邊三角形","若一個三角形是等邊三角形，則它不是等腰三角形"],"answer":0,"explain":"逆敘述是把前提與結論「互換」：若P則Q 的逆敘述是 若Q則P。「若非P則非Q」是否敘述；「若非Q則非P」是逆否敘述（與原命題同真假）；只把結論否定的那一項則兩者皆非。順帶一提，本題原命題為真，但逆敘述為假（等腰三角形不一定是等邊三角形）。"},{"level":"basic","topic":"反例的作用—推翻命題","q":"要推翻「所有的質數都是奇數」這個命題，最少需要舉出幾個反例？","choices":["必須把所有質數的情況都列出來檢查","至少三個","至少兩個","只要一個（例如 2 是質數但為偶數）"],"answer":3,"explain":"命題若宣稱「所有…都…」，只要找到一個滿足前提卻不滿足結論的例子，該命題即被推翻，所以一個反例就夠了，2 是質數卻是偶數即可。要特別注意：舉例子只能「推翻」命題，不能「證明」命題成立；要證明成立必須用推理證明，不能靠列舉，這是最常見的迷思。"},{"level":"basic","topic":"定義、公理與定理的差別","q":"下列關於「定義、公理（基本性質）與定理」的敘述，何者正確？","choices":["公理必須先經過嚴密證明才可以使用","定理是大家共同約定、不必證明就接受的敘述","定義是對名詞意義所作的規定，本身不需要證明","定義必須先由某個定理證明之後才能使用"],"answer":2,"explain":"定義是替名詞下規定（例如「兩邊相等的三角形叫等腰三角形」），是約定，不需要證明；公理（基本性質）是不加證明就接受、作為推理起點的敘述；定理則是由定義與公理推理證明出來的結果。說「公理要先證明」「定理不必證明」正好把兩者的性質對調；說「定義要被證明」則誤解了定義的地位。"},{"level":"basic","topic":"命題真假判斷—對頂角","q":"判斷命題「若兩個角互為對頂角，則這兩個角相等」的真假，下列何者正確？","choices":["假，因為對頂角應該互補","假，只有兩直線互相垂直時才成立","無法判斷，因為題目沒有給出角度","真，這是對頂角相等的基本性質"],"answer":3,"explain":"兩直線相交所成的對頂角必相等，這是可由「平角180°」推得的性質，因此命題為真。說「對頂角互補」是與「鄰補角互補」混淆；說「只有垂直才成立」是誤把特例（垂直時四個角都是90°）當成條件；命題的真假由推理決定，不需要具體角度，故「無法判斷」也錯。"},{"level":"basic","topic":"平行線性質—同旁內角","q":"兩條平行線被第三條直線所截，關於所形成的同旁內角，下列敘述何者正確？","choices":["兩同旁內角必相等","兩同旁內角互餘，和為 90°","兩同旁內角互補，和為 180°","兩同旁內角一定都是直角"],"answer":2,"explain":"平行線被截時：同位角相等、內錯角相等、同旁內角互補（和為180°）。說「必相等」是把同旁內角誤記成同位角或內錯角的性質；說「互餘」是把「補」錯記成「餘」；只有截線垂直於兩平行線時同旁內角才都是90°，那只是特例並非通例。"},{"level":"basic","topic":"三角形內角和的證明依據","q":"證明「三角形三內角和為 180°」時，常過一個頂點作一條與對邊平行的直線。這條輔助線主要是為了使用下列哪一個推理依據？","choices":["平行線被截時內錯角相等","三角形任兩邊之和大於第三邊","全等三角形的 SSS 判別","等腰三角形的等邊對等角"],"answer":0,"explain":"作平行線後，可用「內錯角相等（也可用同位角相等）」把另外兩個內角搬到同一頂點，與原有的角合成一個平角180°，故得內角和為180°。「兩邊和大於第三邊」是邊長的不等關係，「SSS」是全等判別，「等邊對等角」需要等腰的條件，三者都與這條輔助線的用途無關。"},{"level":"basic","topic":"三角形外角定理","q":"三角形外角定理的正確敘述是下列何者？","choices":["三角形的一個外角等於三個內角的和","三角形的一個外角等於與它不相鄰的兩個內角之和","三角形的一個外角等於與它相鄰的那個內角","三角形的一個外角等於與它不相鄰的兩個內角之差"],"answer":1,"explain":"外角定理：一個外角等於與它不相鄰（即另外兩個）的內角和，可由「內角和180°」與「外角和相鄰內角互補」推得。外角與相鄰內角是互補而非相等，故「等於相鄰內角」錯；「等於三內角和」與「等於兩內對角之差」則是把「兩內對角之和」記錯。"},{"level":"basic","topic":"等腰三角形性質","q":"在 △ABC 中已知 AB = AC，僅憑這個條件可以直接推得下列何者？","choices":["∠A = ∠B","△ABC 一定是正三角形","∠A 一定是直角","∠B = ∠C"],"answer":3,"explain":"等腰三角形「等邊對等角」：兩腰 AB、AC 相等，則它們所對的底角 ∠C、∠B 相等。說「∠A = ∠B」是把角與邊的對應關係弄錯（∠A 所對的是 BC）；必須再知道第三邊也相等才會是正三角形；頂角 ∠A 可以是銳角、直角或鈍角，並無限制，故不能斷定為直角。"},{"level":"basic","topic":"全等三角形判別","q":"下列哪一組條件「不能」保證兩個三角形全等？","choices":["三邊對應相等（SSS）","兩角及其夾邊對應相等（ASA）","三角對應相等（AAA）","兩邊及其夾角對應相等（SAS）"],"answer":2,"explain":"國中的全等判別為 SSS、SAS、ASA、AAS、RHS。三角對應相等（AAA）只能保證兩三角形「相似（∽）」，形狀相同但大小可以不同（例如邊長 3 與邊長 5 的兩個正三角形），因此不能判別全等。把相似的 AA 判別誤寫成 AAA 全等，是最常見的錯誤。"},{"level":"basic","topic":"RHS 全等判別的條件","q":"要使用 RHS 判別兩個三角形全等，必須具備下列哪一組條件？","choices":["兩個直角三角形的兩個銳角對應相等","兩個直角三角形的斜邊對應相等","兩個等腰三角形的底邊與腰對應相等","兩個直角三角形的斜邊與一股對應相等"],"answer":3,"explain":"RHS 中 R 指直角（Right angle）、H 指斜邊（Hypotenuse）、S 指一股（Side）：兩個直角三角形只要斜邊與一股對應相等即全等。只有兩銳角相等僅能得相似；只有斜邊相等時兩股的分配仍可不同；而「兩個等腰三角形」的前提不是直角三角形，根本用不到 RHS。"},{"level":"basic","topic":"直接證明的基本格式","q":"依照課本直接證明的寫法，一份完整證明的正確順序是下列何者？","choices":["求證 → 已知 → 證明過程","已知 → 求證 → 證明過程（每一步都附上理由）","證明過程 → 已知 → 求證","已知 → 證明過程 → 求證"],"answer":1,"explain":"直接證明的格式是先寫「已知」（題目給的條件），再寫「求證」（要推出的結論），最後寫「證明」過程，且每一步都要註明依據的定義、公理或定理。把求證寫在最前或最後、或省略理由，都不符合證明的規範；證明的價值就在於每一步都有可檢驗的理由。"},{"level":"basic","topic":"尺規作圖的基本概念","q":"關於尺規作圖，下列敘述何者正確？","choices":["可以直接使用直尺上的刻度量取所需長度","可以用量角器量出並作出指定的角度","必須借助三角板推移來畫出平行線","只能使用沒有刻度的直尺和圓規來作圖"],"answer":3,"explain":"尺規作圖規定只用「無刻度直尺」（畫直線）與「圓規」（畫圓弧、移動長度）兩種工具。直尺的刻度、量角器、三角板都不可用來直接量取長度或角度；長度與角度必須靠圓規畫弧、再以全等的原理作出，這正是尺規作圖與一般畫圖不同之處。"},{"level":"basic","topic":"全等與相似的符號","q":"下列關於全等與相似符號的使用，何者正確？","choices":["兩個三角形相似記為 △ABC ≅ △DEF","兩個三角形全等記為 △ABC ∽ △DEF","兩個三角形相似記為 △ABC ∽ △DEF","兩個三角形相似時，對應邊必定相等"],"answer":2,"explain":"相似用「∽」，全等用「≅」，兩者不可混用；把符號對調的兩個選項都是常見筆誤。相似只保證對應角相等、對應邊「成比例」，不是相等；對應邊也相等（比例為1）時才升級為全等，故最後一項錯。書寫時頂點順序也要依對應關係排列。"},{"level":"adv","topic":"反例的判斷—面積與全等","q":"小明主張：「若兩個三角形的面積相等，則這兩個三角形全等。」下列哪一個例子可以作為反例推翻他的說法？","choices":["底 6 高 4 的三角形與底 3 高 8 的三角形，面積都是 12，但形狀完全不同","兩個全等的三角形，它們的面積也相等","兩個相似三角形的面積比等於對應邊長比的平方","兩個邊長相同的正三角形，面積也相等"],"answer":0,"explain":"反例必須「滿足前提但不滿足結論」：面積相等（滿足前提）卻不全等（不滿足結論），底6高4 與底3高8 的兩三角形面積都是 12 卻形狀不同，正是如此。另兩個選項中的三角形本來就全等，滿足結論，不能推翻命題；而「相似形面積比等於邊長比平方」只是敘述一個性質，沒有舉出具體例子，也不是反例。"},{"level":"adv","topic":"SSA 的易錯辨析","q":"阿華想用「兩邊及其中一邊的對角對應相等（SSA）」來判別兩三角形全等。下列判斷何者正確？","choices":["SSA 是正確的全等判別，效果與 SAS 相同","SSA 一般不能保證全等，但當該角為直角時就成為 RHS，此時可以","SSA 在任何情況下都不能判別全等，即使該角是直角也一樣","SSA 一定能保證兩三角形相似，只是不能保證全等"],"answer":1,"explain":"SSA 中的角不是兩條已知邊的夾角，同樣的條件可能作出兩個形狀不同的三角形，所以一般不能判別全等；但若該角是直角，兩邊就成為斜邊與一股，正是 RHS，此時成立。說「效果與 SAS 相同」是混淆了「夾角」與「對角」；說「任何情況都不行」則忽略了直角時的 RHS；SSA 連相似也保證不了，相似要靠 AA 或三邊對應成比例。"},{"level":"adv","topic":"原命題與逆敘述的真假","q":"命題「若一個四邊形是正方形，則它的四個角都是直角」為真。關於它的逆敘述，下列判斷何者正確？","choices":["逆敘述為「若一個四邊形的四個角都是直角，則它是正方形」，此逆敘述為假，長方形即為反例","原命題為真，所以逆敘述一定也為真","逆敘述為「若一個四邊形不是正方形，則它的四個角不都是直角」，且為真","原命題為真時，逆敘述必定為假"],"answer":0,"explain":"逆敘述是把前提與結論互換；四個角都是直角的四邊形可能是鄰邊不等的長方形，因此逆敘述為假，長方形就是反例。認為原命題與逆敘述真假有固定關係（必真或必假）都錯，事實上原命題為真時逆敘述可真可假；而「若非P則非Q」寫的是否敘述，不是逆敘述。"},{"level":"adv","topic":"引用平行線性質的前提","q":"某證明中出現一步：「因為 ∠1 = ∠2（內錯角相等）」。要讓這個理由能成立，前面必須先確認下列哪一件事？","choices":["∠1 與 ∠2 互為對頂角","三角形的內角和為 180°","被截的那兩條直線互相平行","已經證得兩個三角形全等"],"answer":2,"explain":"「內錯角相等」是平行線的性質，必須先有「兩直線平行」這個前提才能引用；若兩直線不平行，內錯角並不相等。若兩角真是對頂角，理由應寫「對頂角相等」而非內錯角；內角和與全等則與這兩個角的位置關係無關。寫證明時每個理由都要檢查其成立前提是否已具備，這是最容易失分之處。"},{"level":"adv","topic":"相似形的邊長比與面積比","q":"已知 △ABC ∽ △DEF，且 AB : DE = 2 : 3。下列推理何者正確？","choices":["兩三角形的面積比為 2 : 3","兩三角形的面積比為 4 : 9","兩三角形對應角的度數比為 2 : 3","兩三角形的周長比為 4 : 9"],"answer":1,"explain":"相似形中，對應邊長比（相似比）為 2 : 3 時，周長比與邊長比相同為 2 : 3，而面積比為邊長比的平方，即 2² : 3² = 4 : 9。把面積比誤當成邊長比是最常見的迷思；反過來把平方比套到周長也錯；至於角，相似時對應角是「相等」，不成比例。"},{"level":"adv","topic":"全等的對應邊相等（證明理由）","q":"證明「等腰三角形頂角的平分線會平分底邊」時，已先證得 △ABD ≅ △ACD，接著要寫出 BD = CD，這一步的理由應該是什麼？","choices":["全等三角形的對應邊相等","相似三角形的對應邊成比例","等腰三角形的兩底角相等","平行線被截時同位角相等"],"answer":0,"explain":"兩三角形全等後，其對應邊、對應角都相等，因此由 △ABD ≅ △ACD 可得對應邊 BD = CD。相似只能得到成比例（比例未必為1），推不出相等；「兩底角相等」講的是角不是邊；而本題中並沒有平行的條件可用。證明中「先證全等，再引用對應邊（角）相等」是最常用的推理路線。"},{"level":"adv","topic":"生活情境—三角形的穩定性","q":"木工師傅在長方形木框的一組對角之間釘上一根斜撐後，木框就不容易被推歪變形。用推理與證明的觀點來看，最能解釋這個現象的是下列何者？","choices":["三角形的內角和固定為 180°，所以形狀不會改變","三邊長確定後三角形的形狀就唯一確定（SSS），因此三角形具有穩定性","三角形的一個外角等於兩內對角之和，所以能撐住木框","三角形三個角對應相等（AAA）就會全等，所以形狀被固定"],"answer":1,"explain":"斜撐把長方形分成兩個三角形；由 SSS 可知三邊長一旦確定，三角形就唯一確定，無法再改變形狀，這就是三角形的穩定性。以內角和解釋是錯的：任何三角形內角和都是180°，但四邊形內角和固定為360°卻仍會被推歪，可見角度和無法保證形狀；外角定理與穩定性無關；AAA 只能得相似，不是全等判別。"},{"level":"adv","topic":"推理的合理性—循環論證","q":"某生想證明「等腰三角形兩底角相等」，寫下：「因為 ∠B = ∠C，所以 AB = AC，所以 △ABC 是等腰三角形，故 ∠B = ∠C。」這段推理最主要的錯誤是什麼？","choices":["使用了錯誤的全等判別法","只是格式上少寫了「已知」與「求證」","把要證明的結論當成推理的理由來使用（循環論證）","沒有畫出必要的輔助線"],"answer":2,"explain":"這段推理一開頭就假設 ∠B = ∠C，而這正是要證明的結論，繞一圈後又推回同一句話，屬於循環論證，等於什麼都沒證明。正確作法是由已知 AB = AC 出發，作頂角平分線（或中線）造出兩個三角形，用 SAS 證全等後得對應角相等。格式不全或未作輔助線只是形式問題，不是推理失效的根本原因。"},{"level":"adv","topic":"命題真假判斷與反例—四邊形","q":"判斷命題「若一個四邊形的一組對邊平行，且另一組對邊相等，則它一定是平行四邊形」的真假，下列何者正確？","choices":["假，等腰梯形就是反例：它有一組對邊平行、另一組對邊（兩腰）相等，卻不是平行四邊形","真，這是平行四邊形的判別法之一","真，因為只要有一組對邊平行就一定是平行四邊形","無法判斷，必須先知道四邊的長度才能決定"],"answer":0,"explain":"等腰梯形恰好滿足「一組對邊平行、另一組對邊相等」卻不是平行四邊形，因此一個反例即可推翻此命題。正確的判別是「同一組對邊既平行且相等」才能保證是平行四邊形，兩者不可混為一談；只有一組對邊平行的是梯形；命題真假靠推理判定，不必知道實際邊長。"},{"level":"adv","topic":"尺規作圖的理論依據—角平分線","q":"以尺規作 ∠POQ 的角平分線：先以頂點 O 為圓心畫弧交兩邊於 P、Q，再分別以 P、Q 為圓心、相同半徑畫弧交於 R，最後連 OR。這個作法能成立的主要理由是下列何者？","choices":["△OPR ≅ △OQR（AAA），所以 ∠POR = ∠QOR","△OPR ∽ △OQR，相似即可得對應角相等","因為 OP = OQ，由等腰三角形性質即可直接得 ∠POR = ∠QOR","△OPR ≅ △OQR（SSS），所以對應角 ∠POR = ∠QOR"],"answer":3,"explain":"作圖使 OP = OQ（同一弧的半徑）、PR = QR（相同半徑的弧）、OR = OR（公共邊），由 SSS 得 △OPR ≅ △OQR，故對應角 ∠POR = ∠QOR，OR 即為角平分線。AAA 不是全等判別；相似只保證形狀相同，且此處可用的條件本來就是三邊；而僅有 OP = OQ 並不能決定 R 的位置，理由並不完整。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], queue=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); queue=[]; }
/* 洗牌後依序發牌：整池抽完才重洗，一輪內不重複；重洗時避免與上一題相接 */
function refillQueue(){ queue = poolIdx.slice();
  for(let k=queue.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=queue[k]; queue[k]=queue[r]; queue[r]=t; }
  if(queue.length>1 && queue[queue.length-1]===lastIdx){ const t=queue[queue.length-1]; queue[queue.length-1]=queue[0]; queue[0]=t; }
}
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ if(!queue.length) refillQueue(); const i=queue.pop(); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
