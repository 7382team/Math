<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"勞動的意義","q":"公民課本中所談的「勞動」，最適當的意義是下列何者？","choices":["只有在工廠中操作機器、付出體力的工作才算勞動","泛指一切不求回報的志願服務與休閒娛樂活動","人們運用體力或腦力從事生產、提供商品或服務，並藉此獲得報酬的活動","政府為照顧弱勢人民而提供的各項社會福利措施"],"answer":2,"explain":"勞動是人們付出體力或腦力參與生產、提供商品或服務，並取得報酬的活動，兼含勞力與勞心工作。選項0把勞動窄化為體力勞動，忽略設計、教學、行政等腦力勞動；選項1的志願服務與休閒不以獲取報酬為目的，不是課本所指的勞動；選項3屬社會福利政策，是政府的施政作為，與個人從事生產活動無關。"},{"level":"basic","topic":"勞動力的概念","q":"關於「勞動力」的概念，下列敘述何者正確？","choices":["指達到一定年齡、具有工作能力與工作意願的人口，包括就業者與失業者","指一個國家全部人口的總和","指企業所擁有的機器、廠房、原料等生產設備","只計算目前有工作的人，不包括正在找工作的失業者"],"answer":0,"explain":"勞動力是指年滿一定年齡、有工作能力且有工作意願的人口，內含「就業者」與「失業者」兩部分。選項1把勞動力與總人口混淆，總人口還包含幼童、退休者等非勞動力；選項2講的是資本（生產設備），不是勞動力；選項3漏掉失業者，失業者仍有能力與意願，仍算在勞動力之內。"},{"level":"basic","topic":"失業者的認定","q":"依政府統計對「失業者」的認定標準，下列四人中誰屬於失業者？","choices":["甲：正在就讀國中，並未尋找工作","乙：被公司資遣後持續投遞履歷、參加面試，目前仍未找到工作","丙：已辦理退休並領取退休金，不打算再就業","丁：目前受僱於便利商店，每週固定上班三十小時以上"],"answer":1,"explain":"失業者必須同時具備「有工作能力」「有求職意願且正在找工作」「目前沒有工作」三個條件，乙完全符合。甲是在學學生、丙已退出職場，兩人都沒有求職意願，屬於非勞動力而非失業者；丁已有工作，是就業者。"},{"level":"basic","topic":"失業率的意義","q":"「失業率」是用來衡量勞動市場狀況的指標，其計算概念是指下列哪一種比率？","choices":["失業人數占全國總人口的比率","失業人數占就業人數的比率","失業人數占十五歲以上全部人口（含非勞動力）的比率","失業人數占勞動力（就業者與失業者之和）的比率"],"answer":3,"explain":"失業率＝失業人數÷勞動力，而勞動力＝就業者＋失業者，用來表示想工作卻找不到工作的人在勞動力中所占的比例。選項0的分母包含幼童、學生、退休者等非勞動力，會低估失業狀況；選項1的分母漏掉失業者本身，不是失業率的定義；選項2把非勞動力也算進分母，同樣不符定義。"},{"level":"basic","topic":"摩擦性失業","q":"小柔原本在餐飲店工作，因為想轉換到行銷相關領域而主動離職，目前正在投遞履歷、參加面試，尚未上班。她的情況最接近哪一種失業？","choices":["結構性失業","循環性失業","摩擦性失業","她已離職，應歸類為非勞動力"],"answer":2,"explain":"勞工轉換工作或初次尋職期間，因資訊媒合需要時間而出現的短暫失業，屬於摩擦性失業。選項0的結構性失業肇因於技能或產業結構與職缺需求不符，小柔並非技能被淘汰；選項1的循環性失業隨整體景氣衰退而發生，題幹未提到不景氣；選項3有誤，小柔有工作能力且正積極求職，仍屬勞動力中的失業者。"},{"level":"basic","topic":"結構性失業的因應","q":"部分勞工因為產業轉型、原有技能不再被市場需要而長期找不到工作。政府針對這類失業，最直接有效的因應措施是？","choices":["提供職業訓練並結合就業服務，協助勞工取得新技能並媒合適合的工作","大幅提高企業的營利事業所得稅","立法限制勞工自由轉換工作，以穩定就業","全面禁止企業引進新的生產技術與自動化設備"],"answer":0,"explain":"結構性失業的癥結在於勞工技能與產業需求脫節，因此以職業訓練提升或轉換技能、再透過就業服務進行媒合，最能對症下藥。選項1加稅可能反而不利企業僱用；選項2限制轉職侵害工作權，也無助於技能落差；選項3禁止技術進步不但難以執行，也會削弱產業競爭力。"},{"level":"basic","topic":"勞動三權：團結權","q":"勞工依法可以自由籌組工會、加入工會，這項權利屬於勞動三權中的哪一項？","choices":["協商權（團體協商權）","團結權","爭議權","財產權"],"answer":1,"explain":"團結權指勞工有組織及加入工會的權利，是勞動三權的基礎，先能團結才有集體協商與爭議的力量。選項0的協商權是指工會與雇主談判、簽訂團體協約；選項2的爭議權是協商破裂後採取罷工等爭議行為的權利；選項3的財產權屬一般人民權利，不是勞動三權之一。"},{"level":"basic","topic":"工會的功能","q":"下列何者最能說明工會存在的主要功能？","choices":["代替政府核發並發放勞工每月的薪資","單獨決定全國基本工資的調整幅度","集合勞工的力量與雇主協商勞動條件，維護並爭取勞工權益","負責審核企業的財務報表與納稅資料"],"answer":2,"explain":"個別勞工面對雇主時談判力量薄弱，工會的功能就是集結勞工力量，代表會員與雇主協商工資、工時等勞動條件並保障權益。選項0的薪資由雇主依契約給付，不是工會的職權；選項1的基本工資由政府召開審議會、邀集勞資與專家共同審議後決定，工會只是參與者之一；選項3屬會計師與稅捐機關的工作。"},{"level":"basic","topic":"勞動基準法的精神","q":"關於勞動基準法的基本精神，下列敘述何者正確？","choices":["它規定勞動條件的最高標準，雇主不得給勞工更好的待遇","它只適用於公務人員，一般企業的勞工不適用","勞資雙方只要彼此同意，就可以約定低於法律規定的勞動條件","它就工資、工時、休假、資遣與退休等事項規定最低標準，雇主給予的條件不得低於此標準"],"answer":3,"explain":"勞動基準法是勞動條件的「最低標準」法，雇主必須達到或優於法定標準，目的在保障勞工基本生存與尊嚴。選項0方向相反，法律並不禁止雇主提供優於法定的待遇；選項1敘述錯誤，該法適用對象是一般受僱勞工；選項2誤解最低標準的強制性，低於法定標準的約定即使勞工同意也不生效力。"},{"level":"basic","topic":"基本工資的意義與決定","q":"關於我國「基本工資」的敘述，下列何者正確？","choices":["是法律規定雇主給付工資不得低於的下限，由政府召集勞方、資方與專家學者組成審議機制討論後決定","完全由各企業依自身經營狀況自行決定，政府不介入","是政府規定勞工每月最多只能領取的工資上限","由工會單方面決定金額並公告，雇主必須照辦"],"answer":0,"explain":"基本工資是工資的法定下限，用來保障勞工的基本生活，並由政府召集勞方、資方代表與學者專家共同審議後公告，兼顧勞工生活需要與企業負擔能力。選項1忽略了法律的強制保障；選項2把「下限」誤為「上限」，基本工資不限制勞工領更高薪資；選項3錯在工會無單方決定權，審議是多方參與的程序。"},{"level":"basic","topic":"職業災害與社會保險","q":"阿源在工地施工時不慎自鷹架跌落受傷，需要治療且暫時無法工作。依我國社會保險制度，他主要可依靠下列何者取得醫療與傷病等相關給付？","choices":["全民健康保險的生育給付","職業災害保險提供的醫療、傷病等給付","就業保險的失業給付","國民年金的老年年金給付"],"answer":1,"explain":"因執行職務而受傷屬於職業災害，我國以職業災害保險提供醫療、傷病、失能等給付，分擔勞工的職業風險。選項0的生育給付是針對生育事故，與職災無關；選項2的失業給付以「非自願離職且有工作能力與求職意願」為要件，阿源並未失業；選項3的老年年金是年老退休後的保障，與職災無關。"},{"level":"basic","topic":"就業歧視與性別工作平等","q":"某公司徵求行政助理，在徵才廣告上註明「限女性、未婚、三十歲以下」。依性別工作平等與禁止就業歧視的精神，這樣的做法應如何評價？","choices":["合法，因為企業擁有完全不受限制的用人自由","合法，因為行政工作本來就比較適合女性擔任","不合法，因為以性別、婚姻狀況與年齡設限，構成就業歧視","不合法，但只要應徵者事先同意這些條件就沒有問題"],"answer":2,"explain":"就業機會應以工作能力為判準，雇主不得因性別、年齡、婚姻、族群等與工作能力無關的因素給予差別待遇。選項0錯在企業用人自由仍受法律限制；選項1以刻板印象合理化限制，正是歧視的典型；選項3錯在禁止歧視屬強制規定，不因應徵者同意而變得合法。"},{"level":"basic","topic":"童工與少年勞工的保護","q":"我國法律對未滿十八歲的少年勞工設有特別保護規定，其主要理由與內容為何？","choices":["因為少年工作效率較低，所以雇主可以給予低於一般標準的工資","少年勞工不受勞動基準法保障，工作條件完全由雇主決定","少年勞工只能從事無給職的實習，不得領取任何工資","為顧及其身心發展與就學權益，限制其從事危險性、有害性工作，並對其工作時間加以規範"],"answer":3,"explain":"少年勞工身心尚在發展且多半仍需就學，法律因而限制其從事危險性或有害身心健康的工作，並對工作時間、夜間工作等加以規範。選項0違反同工同酬與基本工資的保障；選項1錯誤，少年勞工同樣受勞動基準法保障，且保護更周密；選項2錯誤，少年受僱工作本就應依法領取工資。"},{"level":"basic","topic":"勞資爭議的處理途徑","q":"某工廠勞資雙方因工資計算方式發生爭議，自行協商後仍無共識。依我國制度，接下來還可以循下列哪一種途徑處理？","choices":["向勞工行政主管機關申請調解，若雙方同意亦可交付仲裁","請求立法機關為該公司量身制定一部專用的法律","由雇主片面宣布爭議結果，勞工不得再表示意見","交由該公司人事主管自行裁定，且結果一律不得爭執"],"answer":0,"explain":"勞資爭議可先由雙方協商，不成時得向勞工行政主管機關申請調解，必要時再進入仲裁，藉由公正第三方協助解決。選項1錯在法律具普遍性，不會為個別公司制定；選項2、3都讓資方或其內部人員單方決定，違反勞資爭議應由中立機制處理的原則，也剝奪勞工的救濟機會。"},{"level":"adv","topic":"循環性失業的判讀","q":"某年整體景氣明顯衰退，國內消費與外銷訂單同時減少，各行各業的企業紛紛縮減產能並裁減人力，失業人數普遍上升。這種現象最可能屬於下列何者？","choices":["摩擦性失業，因為勞工只是在尋找更適合自己的工作","循環性失業，因為失業人數隨整體經濟景氣波動而增加","結構性失業，因為勞工的技能與新興產業需求不符","這些人不算失業者，因為他們是被公司資遣而非自願離職"],"answer":1,"explain":"景氣衰退導致需求萎縮、企業普遍減僱，是典型的循環性失業，其特徵是跨產業同時發生且隨景氣回升而緩解。選項0的摩擦性失業源於轉職尋職的時間差，與景氣無關；選項2的結構性失業集中在特定衰退產業或技能落差者，題幹描述的是全面性衝擊；選項3誤解定義，非自願離職而仍有工作能力與求職意願者正是失業者。"},{"level":"adv","topic":"失業類型的比較","q":"甲原本在傳統紡織廠工作，工廠外移後因不熟悉新式自動化設備，已一年多找不到合適工作；乙則因想換到離家較近的公司而離職，兩個月來持續面試中。關於兩人的失業類型，下列判斷何者正確？","choices":["甲、乙都屬於摩擦性失業","甲、乙都屬於循環性失業","甲屬摩擦性失業，乙屬結構性失業","甲屬結構性失業，乙屬摩擦性失業"],"answer":3,"explain":"甲的困境來自產業結構改變與技能落差，屬結構性失業，通常持續較久，需靠職業訓練協助轉換技能；乙只是在轉職過程中的短暫尋職，屬摩擦性失業。選項0忽略甲的技能落差；選項1誤判，題幹並未描述整體景氣衰退；選項2把兩人的類型完全對調。"},{"level":"adv","topic":"失業統計的推論","q":"某國統計顯示，某一年勞動力人數幾乎沒有變動，但就業人數減少、失業人數增加。依此敘述可以合理推論下列何者？","choices":["該國的失業率必然下降","該國的總人口一定同步減少","該國的非勞動力人數必定大幅增加","該國的失業率上升，因為失業人數占勞動力的比重提高"],"answer":3,"explain":"失業率＝失業人數÷勞動力，而勞動力＝就業者＋失業者。勞動力總數不變、失業人數卻增加，代表分子變大而分母不變，失業率必然上升。選項0與計算結果相反；選項1混淆勞動力與總人口，總人口還包含幼童等非勞動力，兩者變化未必一致；選項2錯誤，勞動力人數沒有變動時，無從推論非勞動力大幅增加。"},{"level":"adv","topic":"勞動力與失業率的計算判讀","q":"某鎮調查十五歲以上人口共10000人，其中就業者5700人、失業者300人，其餘為在學學生、退休者與專事家務者。依此資料判斷，下列敘述何者正確？","choices":["該鎮勞動力為6000人，失業率為5%","該鎮勞動力為10000人，失業率為3%","該鎮非勞動力為5700人，勞動力為4300人","該鎮失業率應以300除以5700計算"],"answer":0,"explain":"勞動力＝就業者5700＋失業者300＝6000人，失業率＝300÷6000＝5%，非勞動力＝10000－6000＝4000人。選項1誤把十五歲以上人口全部當成勞動力，分母放大會低估失業率；選項2把就業人數誤當成非勞動力，數字完全顛倒；選項3的分母只算就業者，漏掉失業者本身，不符失業率的定義。"},{"level":"adv","topic":"勞動三權：爭議權的行使","q":"某公司工會與資方就加班費計算方式多次協商未果，工會依法定程序、經會員投票同意後決定罷工。工會此舉主要行使哪一項權利？該權利的行使有何限制？","choices":["團結權；只要有勞工感到不滿就可以隨時罷工","爭議權；須依法定程序（例如先經調解不成立並經工會會員投票同意）才能行使","協商權；行使時完全不受任何程序或方式的限制","爭議權；勞工得以毀損公司設備的方式表達訴求"],"answer":1,"explain":"罷工是爭議權的行使，屬於協商破裂後的最後手段，法律要求先經調解程序、並由工會會員投票通過等要件，以兼顧勞工權益與社會秩序。選項0誤植為團結權（指組織與加入工會），且忽略程序限制；選項2的協商權是談判與簽訂團體協約，且協商同樣有規範；選項3錯在爭議行為須合法和平，毀損財物已屬違法。"},{"level":"adv","topic":"勞動三權：協商權與團體協約","q":"某工會代表全體會員與雇主就工資調整與休假安排進行談判，最後簽訂書面的團體協約。這最能展現勞動三權中的哪一項？其意義為何？","choices":["團結權；代表勞工有加入或不加入工會的自由","爭議權；代表勞工可以用罷工手段迫使雇主讓步","協商權；使勞工得以集體的力量與雇主對等談判勞動條件，改善個別勞工談判力量不足的問題","協商權；代表雇主必須全盤接受工會提出的所有要求"],"answer":2,"explain":"工會代表會員與雇主談判並簽訂團體協約，正是協商權（團體協商權）的具體展現，其意義在於以集體力量彌補個別勞工談判力的弱勢，達成對等協商。選項0的團結權指組織與加入工會，是協商的前提而非本題重點；選項1的爭議權是協商不成後的手段，題幹已成功簽約；選項3誤解協商，協商是雙方合意的過程，並非雇主單方屈從。"},{"level":"adv","topic":"勞動條件的最低標準原理","q":"小美到職前，雇主要求她簽下切結書，內容為「本人自願放棄應有的休假，並同意工資低於基本工資」。依勞動法令的基本原理，這份約定的效力為何？","choices":["有效，因為勞資雙方是你情我願所簽訂的契約","有效，但雇主必須另外發放獎金作為補償","無效，而且小美因此也不能到該公司任職","無效，因為勞動條件低於法律規定的最低標準，縱使勞工同意也不生效力"],"answer":3,"explain":"勞動基準法所定工資、工時、休假等屬強制性的最低標準，勞工往往處於弱勢而難以真正自由同意，故低於標準的約定無效，仍應依法律標準計算。選項0忽略勞資地位不對等與法律的強制性；選項1錯在不得以獎金換取放棄法定權益；選項2的推論不當，約定無效並不影響僱傭關係本身的成立。"},{"level":"adv","topic":"基本工資審議制度的用意","q":"政府在調整基本工資時，會召集勞方代表、資方代表與專家學者共同審議，並參考物價變動、經濟情勢等資料。這樣的制度設計，最主要的用意是？","choices":["兼顧勞工的基本生活需求與企業的負擔能力，透過多方參與凝聚共識","讓政府得以完全依照企業界的意見決定工資水準","保證全國所有勞工都領到完全相同的薪資","使工資完全交由市場供需決定，政府不再進行任何管理"],"answer":0,"explain":"基本工資牽涉勞工生存保障與企業經營成本，採多方參與審議是為了讓不同立場的意見被聽見，在保障勞工與維持產業競爭力之間取得平衡。選項1只偏向資方，違背審議制度的初衷；選項2錯在基本工資只是下限，各職務薪資仍有差異；選項3與題幹敘述矛盾，政府審議本身即是一種必要的管理。"},{"level":"adv","topic":"就業保險與就業服務","q":"阿豪在同一家公司工作多年後，因公司歇業而非自願離職。他持續尋找工作，並到公立就業服務機構辦理求職登記。依我國制度，他最可能獲得下列哪一種協助？","choices":["由勞工保險發給老年年金給付，以維持生活","由就業保險提供失業給付，並可參加職業訓練及接受就業媒合服務","由全民健康保險發給資遣費，補償他失去工作的損失","由原雇主繼續按月給付原有薪資，直到他找到新工作為止"],"answer":1,"explain":"就業保險針對非自願離職且具工作能力與意願、並辦理求職登記者，提供失業給付與職業訓練生活津貼等，同時搭配就業服務進行職訓與媒合，屬「消極保障＋積極重返職場」的設計。選項0的老年年金以年老退休為要件；選項2錯誤，資遣費由雇主依法給付，與健保無關；選項3不符實際，歇業後雇主並無繼續給薪的義務，勞工是靠社會保險與資遣制度獲得保障。"},{"level":"adv","topic":"青少年打工的權益","q":"十六歲的小翔利用假日到飲料店打工，店長表示：「工讀生只是臨時人力，不必簽勞動契約，也不用加保，工資可以低於基本工資。」依我國勞動法令，下列判斷何者正確？","choices":["店長說法正確，因為工讀生並不算是勞工","店長說法正確，因為未成年人不受勞動法令的保障","店長說法錯誤，工讀生同樣是受僱勞工，受勞動基準法保障，工資不得低於基本工資，雇主亦應依規定為其辦理勞工保險","店長說法錯誤，但小翔只要能準時領到工資，其他權益不必在意"],"answer":2,"explain":"只要受僱從事工作並領取報酬，不論是否為兼職、工讀或試用期間，都是勞工，受勞動基準法與相關法令保障，工資不得低於基本工資，雇主也應依規定辦理勞工保險；未滿十八歲者更受工作性質與工時的額外保護。選項0、1都誤以為工讀生或未成年人被排除在保障之外；選項3輕忽保險、工時、職災補償等權益，一旦發生職業災害將失去重要保障。"}];

let level='basic', poolIdx=[], seen=[], recent=[], sinceReview=0, problem=null, answered=false, streak=0, lastIdx=-1;
const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
