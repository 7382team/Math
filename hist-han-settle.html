<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"原住民族與南島語系（語系分類）","q":"就語言分類而言，臺灣原住民族的各族語言主要屬於下列哪一個語系？","choices":["南島語系","漢藏語系","印歐語系","阿爾泰語系"],"answer":0,"explain":"臺灣原住民族的語言屬於南島語系，臺灣是南島語族分布範圍的最北端。漢藏、印歐、阿爾泰等語系與臺灣原住民族語言的分類不同。各族語言與文化各具特色，理解時著重在語系歸屬與文化多樣性，不需背誦精確族數，也不應對任何族群作價值判斷。"},{"level":"basic","topic":"移墾背景—原鄉推力","q":"明清時期，閩粵沿海地區有許多居民選擇冒險渡海來到臺灣。造成這種現象最主要的原因是什麼？","choices":["清廷公開招募並補助沿海百姓移居臺灣，還免費提供船隻與農具","當時臺灣已設有大量工廠，可提供閩粵居民穩定的工資收入","原鄉人口壓力大、可耕地不足，謀生不易，因此希望渡海尋求可耕作的土地","閩粵沿海被官府劃為軍事禁區，居民被強制遷往臺灣居住"],"answer":2,"explain":"移墾的主因是原鄉的「推力」：人口偏多、耕地不足、謀生不易，加上臺灣西部平原尚有可開墾的土地形成拉力。清初對渡臺採取限制而非招募補助；當時臺灣以農業為主，並沒有工廠；官府也未強制沿海居民遷臺。"},{"level":"basic","topic":"渡海艱險—俗諺判讀（心肝結歸丸）","q":"早期移民留下「唐山過臺灣，心肝結歸丸」的說法。這句俗諺最能反映下列哪一種情況？","choices":["橫渡臺灣海峽（俗稱黑水溝）風浪險惡，移民心中充滿緊張與恐懼","移民抵達臺灣後，非常思念原鄉的飲食與家人","清廷官員奉派來臺任職時，對新職務感到興奮期待","移民在臺灣開墾有成後，準備返回原鄉的心情"],"answer":0,"explain":"「心肝結歸丸」形容心揪成一團，指的是渡海過程中對風浪與生死未卜的恐懼。其餘選項描述的都是抵臺之後的心情，或與航行風險無關，未扣住「過臺灣」這段航程。"},{"level":"basic","topic":"渡海艱險—俗諺判讀（六死三留一回頭）","q":"民間流傳「六死三留一回頭」的說法，用來形容早期渡海來臺的情形。這句話的意思最接近下列何者？","choices":["十個移民中有六人能順利在臺灣定居並取得田產","移民依規定必須在臺灣居住滿六年才能申請返鄉","清廷規定沿海每十戶人家只准許一戶渡海來臺","渡海來臺的風險相當高，能平安留下來的人偏少，也有人中途放棄折返"],"answer":3,"explain":"這是民間用來誇張形容渡海危險的俗諺，重點在於「風險高、能平安留下的比例偏低」，並不是精確的統計數字，不可據以推算實際死亡人數。其餘選項或把比例弄反，或把俗諺誤當成官府法令。"},{"level":"basic","topic":"清初渡臺限制政策","q":"關於清朝初期對漢人渡海來臺所採取的政策，下列敘述何者正確？","choices":["完全開放自由來臺，只要繳交高額稅金即可攜家帶眷同行","渡臺須事先申請許可，且一度不准攜帶家眷，因此偷渡的情形時有所聞","規定所有移民必須先在澎湖居留滿一年，接受官府訓練","只准許粵籍移民渡臺開墾，完全禁止閩籍居民前往"],"answer":1,"explain":"清初對渡臺採取限制立場，須經申請核准領照，並曾限制攜帶家眷，這也是偷渡盛行與早期移民男多女少的重要背景。「完全開放」與政策方向相反；澎湖居留受訓的規定並不存在；「只准粵籍、禁止閩籍」的說法也與史實不符。"},{"level":"basic","topic":"移墾社會人口結構—羅漢腳","q":"清代臺灣文獻中常提到的「羅漢腳」，指的是下列何者？","choices":["專門在港口替商船搬運貨物的工人","清廷派駐臺灣、負責巡查地方治安的低階武官","因信奉佛教而在各地寺廟出家修行的移民","早期移民男多女少，許多男子未能成家，也缺乏固定產業與居所，四處流動謀生"],"answer":3,"explain":"渡臺限制與航行風險使早期移民以青壯男性居多，性別比例失衡，因而出現許多未成家、沒有固定產業與居所的流動人口，時人稱為「羅漢腳」。其餘選項把這個名詞誤解為職業、官職或宗教身分。理解時應著眼於制度與環境造成的人口結構，不宜對其生活方式或家庭狀況作價值判斷。"},{"level":"basic","topic":"土地制度—墾照","q":"清代漢人若想在臺灣某片土地上進行開墾，通常必須先取得「墾照」。墾照指的是什麼？","choices":["移民渡海來臺時必須隨身攜帶的船票與行李證明","官府核發、准許在特定範圍土地上進行開墾的憑證","漢人與原住民通婚時，由地方官發給雙方的婚姻證明","商人往來臺灣與大陸之間從事貿易所需的通行文件"],"answer":1,"explain":"墾照是官府對開墾權的正式認可，用來確認開墾的範圍與責任，也便於日後課徵田賦。其餘選項分別混淆了渡海憑證、婚姻文書與貿易許可，都不是土地開墾的證明。"},{"level":"basic","topic":"拓墾組織—墾號（組織性質）","q":"清代臺灣平原地區的開墾契約文書中，常見「墾號」的名稱。墾號指的是下列何者？","choices":["由出資者合股組成，向官府請領墾照並招募佃農開墾土地的組織","由官府直接派遣軍隊駐守並耕作的屯田組織","原住民各社為管理獵場而共同組成的自治團體","專門經營兩岸海上運輸、載運米糖的船運行號"],"answer":0,"explain":"開墾需要大筆資金與眾多人力，常由數人合股組成墾號，以墾號的名義請領墾照、招佃耕作。其餘選項分別是軍屯組織、原住民社群組織與商業船行，性質與土地拓墾的合股組織不同。"},{"level":"basic","topic":"水利設施—八堡圳（灌溉區域）","q":"清代臺灣重要水圳之一的「八堡圳」，主要灌溉的地區是下列何者？","choices":["臺北盆地一帶的水田","今高雄鳳山附近的農田","彰化平原，使當地稻作與聚落明顯發展","嘉南平原，且遲至日治時期才興建完成"],"answer":2,"explain":"八堡圳位於彰化平原，是清代規模較大的水利工程，帶動當地水稻栽培與市街發展。臺北盆地的代表水圳是瑠公圳，鳳山一帶則是曹公圳；嘉南平原的大型水利工程嘉南大圳屬於日治時期，時代不符。"},{"level":"basic","topic":"水利設施—瑠公圳（所在地區）","q":"由郭錫瑠父子投入興築，引新店溪水源灌溉農田、帶動周邊開發的清代水圳，位於下列哪一地區？","choices":["彰化平原","今高雄鳳山地區","花東縱谷","臺北盆地"],"answer":3,"explain":"瑠公圳位於臺北盆地，引新店溪水灌溉農田，是清代北部拓墾的重要水利建設。彰化平原的代表水圳為八堡圳，鳳山一帶為曹公圳；花東地區在清代開發時間較晚，並非瑠公圳所在。"},{"level":"basic","topic":"水利設施—曹公圳（名稱辨識）","q":"清代由地方官倡導興建，位於今日高雄鳳山一帶，引水灌溉附近農田的水利設施是下列何者？","choices":["八堡圳","曹公圳","瑠公圳","嘉南大圳"],"answer":1,"explain":"曹公圳因鳳山知縣曹謹倡議興築而得名，改善了當地灌溉用水不足的問題。八堡圳在彰化、瑠公圳在臺北；嘉南大圳則是日治時期的工程，時代與地點都不相符。"},{"level":"basic","topic":"土地拓墾的空間推進方向","q":"清代臺灣漢人的土地拓墾，在空間上大致呈現什麼樣的推進方向？","choices":["由北部開始向南部推進，最後才開發臺南一帶","先從東部海岸登陸，再翻越中央山脈向西部發展","大致由南部往北部，並由西部平原逐漸往內陸與東部推進","先開發中央山脈的高山地區，再向四周平原擴散"],"answer":2,"explain":"早期政治與經濟中心位於南部，西部平原地勢平坦、河川便於引水灌溉，因此拓墾由南而北、由西向東逐步推展，山區與東部的開發時間相對較晚。其餘選項的方向與地形條件、開發先後順序都不相符。"},{"level":"basic","topic":"土地制度—番大租","q":"清代臺灣土地契約中常出現的「番大租」，指的是下列何者？","choices":["漢人承租平埔族群擁有權利的土地開墾後，須定期繳給原住民社的租穀","原住民各社每年必須向漢人墾戶繳交的稅","漢人墾戶向官府繳納的田賦與各項雜稅","官府定期發放給平埔族群作為生活補助的津貼"],"answer":0,"explain":"番大租的繳納方向是「漢人繳給原住民」，是漢人承墾平埔族群擁有權利的土地後應付的租。其餘選項把繳納方向弄反、混淆為繳給官府的田賦，或屬於虛構的補助制度。"},{"level":"basic","topic":"族群政策—土牛界線（措施內容）","q":"清廷在臺灣曾推行「土牛界線」的措施。這項措施的內容最接近下列何者？","choices":["由官府劃設專供農民放牧牛隻的公有草地，禁止耕作","各墾號之間為了分配灌溉水源而共同商訂的用水界線","漳州與泉州移民為避免衝突而自行約定的居住分界","在漢人與原住民生活區域之間劃定界線、立石挖溝，限制漢人越界開墾"],"answer":3,"explain":"土牛界線是官方劃界的措施，以界碑與溝渠標示界線，希望減少漢人越界墾殖與雙方的衝突。其餘選項或望文生義誤解為牧地，或把官方政策誤認為民間自訂的約定。"},{"level":"basic","topic":"原鄉信仰與族群分布","q":"清代臺灣不同祖籍的移民，往往帶來原鄉的信仰。下列敘述何者正確？","choices":["開漳聖王主要是粵籍客家移民所奉祀的神明","清水祖師是漳州移民專屬、其他移民都不會祭祀的守護神","三山國王的廟宇常出現在粵籍客家移民聚集的地方","媽祖只有泉州籍移民才祭拜，其他族群並不信奉"],"answer":2,"explain":"三山國王廟的分布常與粵籍客家移民有關，可作為理解族群分布的線索之一，但仍須配合其他資料判斷。開漳聖王多為漳州移民的信仰，清水祖師則多見於泉州（安溪）移民；媽祖是航海守護神，各祖籍移民普遍祭祀。各族群的信仰只是文化差異，並無高下之別。"},{"level":"adv","topic":"分類械鬥的成因","q":"清代臺灣中部某地，漳州籍與泉州籍移民曾因灌溉用水的分配長期爭執，最後演變為大規模武裝衝突。對於這類「分類械鬥」，下列說明何者最為恰當？","choices":["主要是清廷刻意挑撥不同祖籍的移民互相對立才造成的","移墾社會的祖籍分類意識強烈，加上水源、土地與商業利益的競爭，容易使個別糾紛擴大為群體衝突","衝突起因完全來自宗教信仰不同，與土地、水源等經濟因素無關","械鬥只發生在漢人與原住民之間，同為漢人者不會彼此衝突"],"answer":1,"explain":"分類械鬥反映移墾社會的結構性因素：認同以祖籍為界、官府公權力不易即時介入、資源競爭又相當激烈，因此個別糾紛容易群體化。把責任單一歸給官府、忽略經濟因素，或認為漢人之間不會衝突，都與史實不符。討論時宜客觀看待各方處境，不偏袒或責備任一族群。"},{"level":"adv","topic":"偷渡現象—史料判讀","q":"某份清代文獻描述：有人趁夜色搭乘小船離開閩粵沿海，航行途中卻被船主丟棄在臺灣西岸的沙洲上。這則記載最能反映下列哪一種情形？","choices":["在渡臺限制之下，部分人選擇偷渡，過程缺乏保障且風險極高","清廷積極鼓勵移民來臺，並派遣官船沿途護送","移民多由官府統一安排船班，航程安全而有保障","臺灣海峽風平浪靜，只要有小船就能輕鬆往返"],"answer":0,"explain":"夜間出航、被中途拋棄，正說明偷渡者無法取得合法保障，只能仰賴不受管束的船主。鼓勵移民、官府統一安排船班的說法與清初的限制政策相反；海峽風平浪靜則與黑水溝風浪險惡的事實不符。"},{"level":"adv","topic":"水利設施與聚落發展","q":"清代某地在水圳完工之後，原本只能看天吃飯的旱田逐漸改種水稻，人口隨之增加，附近也形成熱鬧的市街。這個例子最適合用來說明什麼？","choices":["水圳的主要功能是防止外敵入侵，屬於軍事防禦工程","水稻栽培的成敗與水源是否充足並沒有直接關係","水利設施能提高土地的生產力，進而帶動人口聚集與聚落、市街的發展","聚落是否形成完全取決於官府的行政命令，與經濟條件無關"],"answer":2,"explain":"穩定的灌溉使旱田變為水田、單位面積產量提高，能養活更多人口，進而促成聚落與市街興起。其餘選項誤解水圳的性質、否認水稻需水的特性，或過度誇大行政力量而忽略經濟條件。"},{"level":"adv","topic":"原住民土地權利的轉移","q":"清代平埔族群原本擁有大片土地，後來許多土地的使用與收益逐漸轉到漢人手中。關於這個過程，下列敘述何者較為客觀而正確？","choices":["完全是原住民主動放棄土地所致，與制度或外在因素毫無關係","清廷立法明文規定原住民不得擁有任何土地","原住民的土地全部先被官府沒收，再統一標售給漢人墾戶","土地多透過租佃、買賣與契約等方式移轉，加上雙方對土地權利觀念與制度認知的差異，權利逐漸集中到漢人手中"],"answer":3,"explain":"土地轉移是長期而複雜的過程，涉及租佃與買賣契約、賦稅負擔以及對土地權利認知的落差，不宜簡化為單一原因。其餘選項使用「完全」「全部」等絕對說法，與史實不符，也容易造成偏頗的印象。"},{"level":"adv","topic":"文化互動—涵化","q":"清代中期以後，部分平埔族群陸續採用漢式姓名、學習漢語，並在耕作與祭祀方式上吸收漢人文化的要素。這種現象在歷史學上通常稱為什麼？","choices":["皇民化","涵化","羅漢腳現象","分類械鬥"],"answer":1,"explain":"涵化指不同文化長期接觸後，其中一方大量吸收另一方文化要素的過程，屬於文化變遷的描述，並不表示文化有優劣高下。皇民化是日治時期推行的政策，時代不符；羅漢腳指的是人口結構現象；分類械鬥指群體武裝衝突，皆非文化變遷的概念。"},{"level":"adv","topic":"土牛界線的執行效果","q":"清廷雖在漢人與原住民之間劃定界線並禁止越界，但這條界線在清代仍多次向山區方向調整。這個現象最能說明什麼？","choices":["劃界原意在減少雙方衝突，但漢人對耕地的需求持續，界線難以完全落實而一再變動","界線一旦劃定就完全有效，漢人此後不再越界開墾","清廷劃界的用意，本來就是要鼓勵漢人進入山區大規模開墾","因為劃界的關係，原住民反而取得了更多西部平原的土地"],"answer":0,"explain":"界線多次調整，正好顯示政策執行的困難：官府希望以劃界減少衝突，但拓墾壓力使越界難以禁絕。其餘選項與界線變動的事實、劃界的原意，以及原住民土地逐漸減少的趨勢都不相符。"},{"level":"adv","topic":"移墾社會轉向定居社會","q":"清代中期以後，臺灣各地陸續出現宗祠與書院，也有士子考取科舉功名，地方公共事務常由家族與士紳參與。這種變化最能說明下列何者？","choices":["臺灣已由農業社會直接轉型為以工商業為主的社會","清廷決定放棄治理臺灣，改由地方自行管理","早期移民幾乎全數返回原鄉，社會結構因此重新組成","臺灣逐漸由以開墾為主的移墾社會，轉變為重視家族、教育與文教活動的定居社會"],"answer":3,"explain":"宗祠象徵家族在地生根，書院與科舉則代表文教發展，都是移墾社會走向定居社會的指標。當時臺灣仍以農業為主，並未轉為工商業社會；清廷也持續設官治理；移民多落地生根，而非大量返鄉。"},{"level":"adv","topic":"寺廟與同鄉組織的社會功能","q":"清代臺灣某市街的移民共同集資興建廟宇，廟埕平時成為同鄉聚會、調解糾紛與商議公共事務的場所。這個情形說明了什麼？","choices":["寺廟唯一的功能就是舉行祭祀與宗教儀式","清廷明文規定所有地方糾紛都必須在廟宇內處理","寺廟與同鄉組織具有凝聚人群、處理地方公共事務的社會功能","共同的宗教信仰使移民之間的祖籍差異完全消失"],"answer":2,"explain":"在官方力量有限的移墾社會，寺廟往往兼具信仰中心與地方公共空間的角色，是人群凝聚與自我管理的重要場域。其餘選項低估寺廟的社會功能、把民間慣例誤為法令，或過度樂觀地認為祖籍意識已完全消失。"},{"level":"adv","topic":"合股開墾的經濟意義","q":"清代開墾臺灣西部平原時，常見數人共同出資組成墾號，向官府請領墾照後再招募佃農耕作。這種做法主要的用意是什麼？","choices":["分擔開墾所需的龐大資金與風險，並確保有足夠的人力投入","讓參與者可以免除向官府繳納任何賦稅的義務","方便官府直接派員管理每一塊田地的耕作情形","阻止原住民參與土地的租佃關係，從此取消番大租"],"answer":0,"explain":"開闢水源、整地招佃都需要大量資金與時間，成果又不確定，因此以合股方式集資、共同承擔風險最為合理。墾成之後仍須依規定納賦；墾號屬民間組織，並非官府的管理單位；番大租在清代也長期存在。"},{"level":"adv","topic":"史料判讀—俗諺與人口結構（有唐山公，無唐山媽）","q":"民間流傳「有唐山公，無唐山媽」的說法。若把它當作理解早期移墾社會的線索，下列推論何者最為合理？","choices":["早期渡海來臺的移民幾乎都是女性，男性極少","早期渡臺移民男多女少，部分男性與在地女性（包含平埔族群）通婚，反映當時的人口結構與族群互動","清廷嚴格禁止漢人與原住民有任何往來或接觸","移民抵臺後大多立刻返回原鄉成家，很少長期居留"],"answer":1,"explain":"這句俗諺呼應渡臺限制造成的性別比例失衡，也反映漢人與在地族群通婚的情形，是理解族群互動的線索；但它屬於民間概括說法，不宜當成精確統計，也不應據此對任何族群或家庭型態作價值判斷。其餘選項把性別關係說反、否認實際存在的往來與通婚，或與移民逐漸定居的趨勢相反。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], queue=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); queue=[]; }
/* 洗牌後依序發牌：整池抽完才重洗，一輪內不重複；重洗時避免與上一題相接 */
function refillQueue(){ queue = poolIdx.slice();
  for(let k=queue.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=queue[k]; queue[k]=queue[r]; queue[r]=t; }
  if(queue.length>1 && queue[queue.length-1]===lastIdx){ const t=queue[queue.length-1]; queue[queue.length-1]=queue[0]; queue[0]=t; }
}
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ if(!queue.length) refillQueue(); const i=queue.pop(); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
