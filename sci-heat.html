<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"溫度與熱的區別","q":"下列關於「溫度」與「熱」的敘述，何者正確？","choices":["溫度是物體內所含熱量的總和","熱是能量的一種形式，會自動由高溫物體傳向低溫物體","物體的溫度愈高，所含的熱能一定愈多","熱的單位是℃，溫度的單位是卡"],"answer":1,"explain":"溫度是表示物體冷熱程度的物理量；熱則是因溫度差而傳遞的「能量」，方向必定由高溫傳向低溫。(A)(C) 混淆了溫度與熱量：物體含有的熱能還與質量、比熱有關，一小杯100℃的熱水所含的熱能不一定比一大桶40℃的溫水多。(D) 把單位對調了，溫度的單位是℃，熱量的單位是卡。"},{"level":"basic","topic":"液體溫度計的測溫原理","q":"實驗室常用的酒精溫度計與水銀溫度計，主要是利用管中液體的哪一種性質來指示溫度的高低？","choices":["液體的熱脹冷縮","液體的沸點很高","液體的導電性良好","液體的比熱很大"],"answer":0,"explain":"液體溫度計的原理是液體受熱體積膨脹、遇冷體積收縮，藉細管中液柱長度的變化對應到刻度。酒精凝固點低（約-117℃），適合量測低溫；水銀沸點高（約357℃），適合量測高溫。(B)(C)(D) 所述性質與溫度計「指示溫度」的原理無關。"},{"level":"basic","topic":"攝氏溫標的兩個固定點","q":"攝氏溫標的兩個固定點是如何規定的？","choices":["冰水混合物訂為100度、沸水訂為0度","冰水混合物訂為32度、沸水訂為212度","冰水混合物訂為0度、1大氣壓下純水的沸水訂為100度","冰水混合物訂為0度、任何液體的沸點都訂為100度"],"answer":2,"explain":"攝氏溫標以1大氣壓下冰水混合物為0℃、純水的沸水為100℃，兩定點間等分為100格。(A) 把上下兩個定點顛倒；(B) 是華氏溫標的定點；(D) 錯在不同液體沸點不同，定點必須指定為「純水」且在「1大氣壓」下才有唯一標準。"},{"level":"basic","topic":"熱量單位卡與大卡","q":"關於熱量單位「卡」與「大卡」，下列敘述何者正確？","choices":["1大卡等於100卡","1卡可使1公克純水的溫度上升10℃","卡是溫度的單位，大卡是熱量的單位","1大卡等於1000卡，也就是可使1公斤純水的溫度上升1℃所需的熱量"],"answer":3,"explain":"1卡定義為使1公克純水溫度上升1℃所需的熱量；1大卡＝1000卡（1仟卡），恰可使1公斤（1000公克）純水上升1℃。(A) 進位錯誤，是1000倍而非100倍；(B) 把1℃寫成10℃；(C) 誤把卡當成溫度單位，溫度的單位是℃，卡與大卡都是熱量單位。"},{"level":"basic","topic":"比熱的定義","q":"物質的「比熱」是指下列哪一項？","choices":["使1公克的該物質溫度上升1℃所需吸收的熱量","該物質所能儲存的最大熱量","使1公克的該物質完全熔化所需的熱量","該物質每單位體積所含的質量"],"answer":0,"explain":"比熱是物質的特性，定義為使1公克物質溫度升高1℃所需的熱量，單位為卡/(公克·℃)。(B) 沒有科學定義，物質能吸收的熱量並沒有一個固定上限；(C) 敘述的是熔化熱；(D) 敘述的是密度。"},{"level":"basic","topic":"水的比熱特性","q":"下列關於水的比熱的敘述，何者正確？","choices":["水的比熱為0，所以水不會吸熱","水的比熱為1卡/(公克·℃)，比一般常見物質大，因此溫度不容易改變","水的比熱比鐵小，所以同樣加熱時水升溫比鐵快","水的比熱會隨盛裝容器的形狀而改變"],"answer":1,"explain":"水的比熱為1卡/(公克·℃)，是常見物質中數一數二大的，吸收或放出相同熱量時溫度變化較小，因此常作為冷卻劑或蓄熱材料。(A) 比熱為0代表不需熱量就能升溫，並不存在；(C) 大小關係顛倒，鐵的比熱（約0.107）遠小於水，同樣加熱時鐵升溫才快；(D) 比熱是物質本身的特性，與容器形狀、質量多寡都無關。"},{"level":"basic","topic":"熱平衡與熱傳遞方向","q":"把一杯熱水與一杯冷水互相接觸放置一段時間，熱的傳遞情形為何？","choices":["由冷水把「冷」傳給熱水，直到兩者溫度相同","兩者互不傳遞，各自維持原來的溫度","熱由高溫的水傳向低溫的水，直到兩者溫度相同而達熱平衡","熱由熱水傳向冷水，直到熱水降到0℃為止"],"answer":2,"explain":"熱一定由溫度高的物體傳向溫度低的物體，直到兩者溫度相同（達熱平衡）為止。(A) 是常見迷思：「冷」不是能量、不會被傳遞，實際上是熱由高溫流向低溫；(B) 錯在只要有溫度差就會有熱傳遞；(D) 錯在熱平衡的終點是「兩者同溫」，而不是降到0℃。"},{"level":"basic","topic":"熱傳導（固體）","q":"用鐵湯匙攪拌熱湯，過一會兒手握的湯匙柄也變得燙手，這是屬於哪一種熱的傳播方式？","choices":["對流","輻射","蒸發","傳導"],"answer":3,"explain":"固體中粒子的位置固定，靠相鄰粒子的振動依序把能量傳遞出去，稱為傳導；金屬是熱的良導體，所以傳得特別快。(A) 對流必須靠液體或氣體本身的流動；(B) 輻射不需介質、以電磁波形式傳播；(C) 蒸發是狀態變化，並不屬於熱傳播的三種方式。"},{"level":"basic","topic":"熱對流（流體）","q":"關於熱的「對流」，下列敘述何者正確？","choices":["對流只發生在固體中，靠粒子逐一碰撞傳遞能量","對流主要發生在液體和氣體中，受熱的部分密度變小而上升，形成循環","對流不需要介質，在真空中也能進行","對流時受熱的部分因密度變大而上升"],"answer":1,"explain":"液體或氣體受熱後體積膨脹、密度變小而上升，周圍較冷（密度較大）的部分下降補充，形成循環流動，即為對流。(A) 敘述的其實是「傳導」；(C) 敘述的是「輻射」的特性，對流必須有可流動的介質；(D) 把密度關係寫反了，受熱後密度變小才會上升。"},{"level":"basic","topic":"熱輻射（不需介質）","q":"關於熱輻射的敘述，下列何者正確？","choices":["必須依靠固體介質才能傳播","不需要任何介質，即使在真空中也能傳播","只能在液體中進行","顏色愈淺、愈光亮的物體，吸收輻射熱的能力愈好"],"answer":1,"explain":"輻射是熱以電磁波形式直接向外發射，不需要介質，所以太陽的熱能可以穿越接近真空的太空到達地球。(A)(C) 把輻射與傳導、對流的條件搞混了；(D) 方向相反，深色且粗糙的表面吸收（同時也放出）輻射熱的能力較好，淺色光亮的表面則善於反射。"},{"level":"basic","topic":"熱的良導體與不良導體","q":"下列哪一組物質「都是」熱的良導體？","choices":["木頭、塑膠","棉被、空氣","保麗龍、羊毛","鐵、銅、鋁"],"answer":3,"explain":"金屬普遍是熱的良導體，鐵、銅、鋁都能快速傳導熱量，常用來製作鍋具。(A)(B)(C) 中的木頭、塑膠、棉被、空氣、保麗龍、羊毛都是熱的不良導體（絕熱材料），常用來保溫或防燙；其中空氣是很好的絕熱材料，所以雙層衣物、羽絨衣特別保暖。"},{"level":"basic","topic":"溫度計的正確使用方法","q":"用酒精溫度計測量燒杯內液體的溫度時，下列做法何者正確？","choices":["讀數時視線應與凹液面的最低處保持水平","應先把溫度計從液體中取出再讀數，比較看得清楚","溫度計的球部應緊靠著燒杯底部量測","可以直接拿溫度計當攪拌棒攪動液體"],"answer":0,"explain":"讀數時視線必須與凹液面的最低處齊平（水平），俯視會讀得偏高、仰視會讀得偏低。(B) 溫度計必須留在液體中、待液柱穩定後才讀數，取出後會受室溫影響而改變；(C) 球部要浸在液體中，但不可碰到杯底或杯壁，否則量到的是容器的溫度；(D) 溫度計是玻璃製品，不可當攪拌棒以免破裂。"},{"level":"basic","topic":"熱脹冷縮的生活應用","q":"下列生活中的現象或設計，何者「不是」與物體的熱脹冷縮有關？","choices":["鐵軌與鐵軌之間預留縫隙","橋梁兩端設置伸縮縫","液體溫度計中的液柱隨溫度升降","保溫瓶的內壁鍍上銀色反光層"],"answer":3,"explain":"(A) 鐵軌縫隙與 (B) 橋梁伸縮縫都是為了容納材料受熱膨脹的量，(C) 溫度計則直接利用液體的熱脹冷縮來指示溫度。(D) 保溫瓶內壁鍍銀是為了反射輻射熱、減少以輻射方式散失的熱量，屬於阻隔熱輻射的設計，與熱膨脹無關。"},{"level":"basic","topic":"攝氏溫標與華氏溫標的比較","q":"關於攝氏溫標(℃)與華氏溫標(℉)，下列敘述何者正確？","choices":["兩種溫標對冰點與沸點所訂的刻度完全相同","華氏溫標中，1大氣壓下冰水混合物為32℉、沸水為212℉","華氏溫標是臺灣中小學科學實驗最常使用的溫標","攝氏0℃就等於華氏0℉"],"answer":1,"explain":"華氏溫標把冰點訂為32℉、沸點訂為212℉，兩定點間分成180格；攝氏則訂為0℃與100℃、分成100格。(A) 兩者刻度並不相同；(D) 0℃相當於32℉而非0℉；(C) 臺灣通用的是攝氏溫標，華氏溫標主要在美國日常生活中使用。"},{"level":"adv","topic":"保溫瓶的雙層真空設計","q":"保溫瓶的瓶膽做成雙層玻璃，並把兩層之間抽成接近真空。此設計主要能阻隔哪些熱傳播方式？","choices":["只能阻隔輻射","只能阻隔傳導","可以同時阻隔傳導與對流","可以阻隔輻射，但完全無法阻隔傳導"],"answer":2,"explain":"傳導與對流都必須有介質（粒子）才能進行，夾層抽成接近真空後幾乎沒有粒子，因此可同時大幅減少傳導與對流。至於輻射不需介質，必須另外靠內壁鍍銀把輻射熱反射回去；瓶口再以軟木塞或塑膠蓋阻隔傳導與對流，三種傳播方式才被完整防堵。"},{"level":"adv","topic":"對流原理與冷暖氣安裝位置","q":"想讓房間內的空氣溫度較快變得均勻，依照對流原理，冷氣機與電暖器的位置應如何安排最恰當？","choices":["冷氣機裝在牆的高處，電暖器放在地板附近的低處","冷氣機裝在低處，電暖器掛在天花板附近","兩者都裝在天花板附近","兩者都放在地板附近"],"answer":0,"explain":"冷氣吹出的冷空氣密度大會下沉，裝在高處才能一路往下帶動全室循環；電暖器加熱的空氣密度變小會上升，放在低處熱空氣才會往上、冷空氣下降補充而形成對流。若依 (B) 把位置對調，冷空氣堆積在下層、熱空氣停在上層，房間上下溫差大而不易均勻；(C)(D) 同樣無法形成完整的循環。"},{"level":"adv","topic":"比熱與海陸溫度差異","q":"夏天中午到海邊，走在沙灘上覺得燙腳，但海水摸起來仍然涼涼的。造成這種差異的主要原因是？","choices":["沙的比熱比水大，所以升溫較快","海水中會不斷產生冷空氣使自己降溫","陽光只照射到沙灘，照不到海水","水的比熱比沙大，吸收相同熱量後溫度上升較少"],"answer":3,"explain":"沙的比熱遠小於水，接受相同日照（吸收相近熱量）時，沙的溫度上升多、水的溫度上升少，所以白天沙燙而水涼；夜間放熱時同理，沙降溫快、海水降溫慢，這也是海風與陸風方向日夜相反的原因。(A) 把比熱的大小關係說反了，比熱「大」者溫度才不易改變；(B)「產生冷空氣」並非科學說法；(C) 陽光同樣照射在海面上。"},{"level":"adv","topic":"熱膨脹與鐵軌縫隙","q":"鐵軌鋪設時每段之間會預留縫隙。到了夏天正午氣溫很高時，這些縫隙會有什麼變化？原因為何？","choices":["縫隙變小，因為鐵軌受熱膨脹而伸長","縫隙變大，因為鐵軌受熱而收縮","縫隙不變，因為金屬不會熱脹冷縮","縫隙變小，因為鐵軌遇冷收縮"],"answer":0,"explain":"溫度升高時鐵軌受熱膨脹、長度變長，兩段鐵軌互相靠近，因此縫隙變小；預留縫隙正是為了避免高溫時鐵軌互相擠壓而彎曲變形。(B) 把受熱膨脹說成收縮；(C) 誤以為金屬不會熱脹冷縮；(D) 把夏天高溫誤說成遇冷。"},{"level":"adv","topic":"雙金屬片的彎曲方向","q":"雙金屬片是把兩種受熱膨脹程度不同的金屬緊密黏合而成，常用於電熨斗、火災警報器的自動開關。當雙金屬片受熱時，它會朝哪一側彎曲？","choices":["一定向上彎曲，與所用金屬種類無關","向膨脹程度較大的金屬那一側彎曲","向膨脹程度較小的金屬那一側彎曲","受熱時不會彎曲，只有遇冷才會彎曲"],"answer":2,"explain":"受熱時膨脹較多的一側伸長較多，因為兩片黏合無法分離，較長的一側只能弓在外側，於是整片彎向膨脹較小（較短）的那一側；遇冷時收縮較多的一側變短，彎曲方向相反。(B) 恰好把方向弄反，是最常見的誘答；(A) 彎曲方向取決於兩種金屬的膨脹程度；(D) 受熱、遇冷都會彎曲。"},{"level":"adv","topic":"對流實驗的觀察與判讀","q":"在燒杯底部的一角加熱清水，並在該處滴入少量墨水，可觀察到墨水由加熱處向上升起、再由另一側下沉，形成循環。此實驗最主要說明的是？","choices":["水受熱後密度變小而上升，冷水下降補充，形成對流","水受熱後密度變大而上升，這是傳導的現象","墨水本身會自行游動，與水溫高低無關","熱在水中以輻射方式沿直線前進"],"answer":0,"explain":"墨水只是用來「顯示水的流動路徑」的指示劑，觀察到的循環代表受熱的水因體積膨脹、密度變小而上升，周圍較冷的水下沉補充，這正是對流。(B) 密度敘述錯誤，且流體整體流動不是傳導；(C) 若與水溫無關就不會出現固定方向的循環；(D) 把液體的整體流動誤判為輻射。"},{"level":"adv","topic":"鍋具材質與導熱性設計","q":"炒菜鍋的鍋身多用金屬製造，握把卻常用木頭或塑膠包覆。這樣設計的主要理由是？","choices":["金屬是熱的不良導體，而木頭是熱的良導體","金屬的比熱大，木頭的比熱小","金屬是熱的良導體，能使食物快速受熱；木頭與塑膠是熱的不良導體，可避免手被燙傷","木頭握把可以加速鍋內熱的對流"],"answer":2,"explain":"鍋身選用導熱快的金屬，可讓爐火的熱迅速傳到食物；握把選用導熱差的木頭或塑膠，熱不易傳到手上而不燙手。(A) 把良導體與不良導體完全對調，是典型誘答；(B) 混入比熱概念，此設計的主因是導熱性而非比熱；(D) 握把材質不會影響鍋內的對流。"},{"level":"adv","topic":"實驗變因判斷（輻射吸熱）","q":"小明想探討「物體表面顏色是否會影響吸收輻射熱的能力」。他取兩個大小相同的鐵罐，一個外表塗黑、一個塗白，各裝入等量且同溫的水，同時放在陽光下相同的位置照射。此實驗中的「應變變因」是下列何者？","choices":["鐵罐外表所塗的顏色","兩罐中水溫上升的多寡","兩罐中所裝水的體積","陽光照射的時間長短"],"answer":1,"explain":"操縱變因是實驗者刻意改變的條件，即 (A) 鐵罐外表的顏色；應變變因則是隨之被測量、觀察到的結果，即 (B) 水溫上升的多寡。(C) 水的體積與 (D) 照射時間（以及水的初溫、擺放位置）都必須保持相同，屬於控制變因。實驗結果會顯示黑罐水溫上升較多，代表深色表面吸收輻射熱的能力較佳。"},{"level":"adv","topic":"導熱快慢與冷熱感覺","q":"在同一間室溫20℃的教室裡放置很久的桌子，用手觸摸鐵製的桌腳會覺得比木製的桌面更冰涼。最合理的解釋是？","choices":["鐵的溫度本來就比木頭低很多","木頭會不斷放出熱量給手，所以摸起來較溫暖","兩者溫度其實相同，但鐵是熱的良導體，能較快把手上的熱帶走","鐵的比熱比木頭大，所以摸起來比較冷"],"answer":2,"explain":"兩者在同一室內放置夠久，早已與室溫達成熱平衡而溫度相同；人手感覺到的「冷」其實是手散失熱量的快慢。鐵是熱的良導體，接觸時迅速把手上的熱帶走，所以覺得冰涼；木頭是不良導體，帶走的熱少，感覺較溫。(A) 錯在兩者已達熱平衡；(B) 熱不會由較低溫的木頭自動流向較高溫的手；(D) 比熱不是感覺冷熱的主因，且鐵的比熱其實比木頭小。"},{"level":"adv","topic":"太陽熱能傳到地球的方式","q":"太陽與地球之間幾乎是真空，太陽的熱卻仍然能傳到地球。這主要是靠哪一種熱傳播方式？理由為何？","choices":["傳導，因為太空中充滿看不見的固體微粒可以傳熱","對流，因為太空中的氣體受熱後上升到地球","傳導與對流同時進行","輻射，因為輻射不需要介質就能傳遞熱"],"answer":3,"explain":"真空中幾乎沒有介質，傳導與對流都無法進行，只有以電磁波形式傳播的輻射不需介質，因此太陽的熱能能穿越太空抵達地球。(A)(B)(C) 都誤以為太空中存在足以傳熱的介質。這也說明為何在陽光下撐深色傘會較熱，而太空衣要採用銀色反光材質來反射輻射熱。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], seen=[], recent=[], sinceReview=0, problem=null, answered=false, streak=0, lastIdx=-1;
const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
