<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"比較級 -er + than","q":"My brother is ______ than my father now. He grew ten centimeters last year.","choices":["tall","more tall","taller","tallest"],"answer":2,"explain":"句中有 than，必須用比較級。tall 是單音節形容詞，直接加 -er 變成 taller。(A) tall 是原級，不能與 than 連用；(B) more tall 錯誤，單音節形容詞不用 more；(D) tallest 是最高級，前面要加 the，且用於三者以上的範圍比較，不可接 than。"},{"level":"basic","topic":"拼字規則：重複字尾","q":"An elephant is ______ than a horse.","choices":["bigger","biger","more big","the biggest"],"answer":0,"explain":"big 是「短母音＋單子音」結尾的單音節形容詞，比較級須重複字尾子音再加 -er，寫成 bigger；句中的 than 也顯示要用比較級。(B) biger 少寫一個 g，拼字錯誤；(C) more big 錯，單音節形容詞不用 more；(D) the biggest 是最高級，不能與 than 一起用。"},{"level":"basic","topic":"拼字規則：子音+y 改 i","q":"Amy is ______ today than she was yesterday because she got a birthday gift.","choices":["happyer","happily","happiest","happier"],"answer":3,"explain":"happy 是「子音＋y」結尾，比較級要去 y 改 i 再加 -er，成為 happier；句中有 than，也證明須用比較級。(A) happyer 拼字錯誤，y 沒有改成 i；(B) happily 是副詞，不能放在 be 動詞後面當主詞補語；(C) happiest 是最高級，前面要加 the，且不能與 than 連用。"},{"level":"basic","topic":"長音節形容詞用 more","q":"Math is ______ than English for me. I often get low scores on math tests.","choices":["difficulter","more difficult","most difficult","difficultest"],"answer":1,"explain":"difficult 有三個音節，屬於長形容詞，比較級要用 more + 原級，即 more difficult；句中的 than 也證明要用比較級。(A) difficulter 與 (D) difficultest 都不存在，長形容詞不加 -er／-est；(C) most difficult 是最高級（且須加 the），不能與 than 連用。"},{"level":"basic","topic":"最高級 the -est + in","q":"Jason is ______ student in his class. Everyone else is shorter than he is.","choices":["the taller","tallest","taller","the tallest"],"answer":3,"explain":"in his class 表示「在班上」這個範圍，屬於「the + 最高級 + in + 場所／團體」的最高級句型，故用 the tallest。(A) the taller 只用於「兩者之中較…的那一個」；(B) tallest 少了定冠詞 the，最高級前一定要加 the；(C) taller 是比較級，必須搭配 than。"},{"level":"basic","topic":"最高級 the most + 長形容詞","q":"This is ______ movie of the year. Everyone wants to see it.","choices":["most exciting","the most exciting","more exciting","the excitingest"],"answer":1,"explain":"exciting 是長形容詞，最高級用 the most + 原級；of the year 表示比較範圍，符合「the + 最高級 + of + 範圍」的句型。(A) most exciting 少了定冠詞 the；(C) more exciting 是比較級，必須搭配 than；(D) the excitingest 拼法錯誤，長形容詞不加 -est。"},{"level":"basic","topic":"不規則變化 good-better","q":"Your English is ______ than mine. You always get high scores on English tests.","choices":["better","gooder","more good","the best"],"answer":0,"explain":"good 屬不規則變化：good–better–best，句中有 than，故用比較級 better。(B) gooder 與 (C) more good 都不存在，good 不能加 -er，也不能用 more；(D) the best 是最高級，不能與 than 連用。"},{"level":"basic","topic":"不規則變化 bad-worst","q":"Yesterday was ______ day of my life. I lost my wallet and missed the bus.","choices":["the baddest","the worse","the worst","the most bad"],"answer":2,"explain":"bad 的不規則變化為 bad–worse–worst；of my life 表示比較範圍，句意為「我人生中最糟的一天」，故用最高級 the worst。(A) the baddest 與 (D) the most bad 都不是正確的變化形式；(B) the worse 是比較級，必須與 than 連用，不能用 of my life 表最高級範圍。"},{"level":"basic","topic":"原級比較 as...as","q":"Mary is ______ as her sister. They are both 160 centimeters tall.","choices":["so tall","as tall","as taller","as tallest"],"answer":1,"explain":"兩者程度相同時用「as + 原級 + as」，故用 as tall as。(A) so...as 只能用在否定句（not so tall as），肯定句不可使用；(C) as taller 與 (D) as tallest 都錯，as...as 中間一定要放原級，不可放比較級或最高級。"},{"level":"basic","topic":"否定原級比較 not as...as","q":"My bike is not as ______ as yours. I bought it three years ago.","choices":["newer","more new","newest","new"],"answer":3,"explain":"「not as + 原級 + as」表示「不如…」，中間必須放原級 new。(A) newer 是比較級，只能搭配 than；(B) more new 不合規則，new 是單音節字，比較級應為 newer；(C) newest 是最高級，前面須加 the 並表示範圍中最…。"},{"level":"basic","topic":"不規則變化 many-more","q":"There are ______ students in Class A than in Class B.","choices":["much","many","more","the most"],"answer":2,"explain":"many 的不規則變化為 many–more–most，句中有 than，故用比較級 more。(A) much 用來修飾不可數名詞，且是原級，students 是複數可數名詞；(B) many 是原級，不能與 than 連用；(D) the most 是最高級，也不能與 than 連用。"},{"level":"basic","topic":"不規則變化 little-less","q":"Tim watches TV ______ than his sister. He only watches it on Sundays.","choices":["less","little","fewer","the least"],"answer":0,"explain":"little 的不規則變化為 little–less–least，句中有 than 故用比較級 less（此處為副詞用法，表示「較少地」）。(B) little 是原級，不能與 than 連用；(C) fewer 是 few 的比較級，用來修飾複數可數名詞，這裡後面沒有名詞可修飾；(D) the least 是最高級，不能與 than 連用。"},{"level":"basic","topic":"副詞比較級","q":"David runs ______ than the other boys on the school team.","choices":["fast","more fast","fastest","faster"],"answer":3,"explain":"fast 的副詞形式與形容詞同形，屬單音節，比較級直接加 -er 成 faster；句中的 than 表示要用比較級。(A) fast 是原級，不能與 than 連用；(B) more fast 錯，單音節字不用 more；(C) fastest 是最高級，不與 than 連用。"},{"level":"basic","topic":"最高級 of the three","q":"Of the three sisters, Nina is ______. She is only six years old.","choices":["the youngest","the younger","younger","youngest"],"answer":0,"explain":"三者以上比較要用最高級，Of the three sisters 是「the + 最高級 + of + 範圍」的句型，故用 the youngest。(B) the younger 只用於兩者之間；(C) younger 是比較級，須搭配 than；(D) youngest 少了定冠詞 the。"},{"level":"adv","topic":"-ly 副詞比較級","q":"The road is wet today. Please drive ______ than usual.","choices":["carefuller","more carefully","most carefully","carefully"],"answer":1,"explain":"carefully 是 -ly 結尾的副詞，比較級一律用 more + 原級，即 more carefully；句中有 than 也證明要用比較級。(A) carefuller 這個字不存在；(C) most carefully 是最高級，不能與 than 連用；(D) carefully 是原級，同樣不能與 than 連用。"},{"level":"adv","topic":"much 修飾比較級","q":"This test is ______ easier than the last one. Almost everyone in my class got a high score.","choices":["very","so","much","too"],"answer":2,"explain":"要加強比較級的語氣，須用 much / a lot / far / even 等副詞，故選 much easier。(A) very、(B) so、(D) too 都只能修飾原級（very easy、so easy、too easy），不能直接修飾比較級 easier。"},{"level":"adv","topic":"the + 比較級 + of the two","q":"I have two dogs, Lucky and Coco. Lucky is ______ of the two.","choices":["the smaller","smaller","the smallest","smallest"],"answer":0,"explain":"兩者之中特別指出「較…的那一個」時，須用「the + 比較級 + of the two」，故用 the smaller。(B) smaller 少了 the，且比較級單獨使用時要搭配 than；(C) the smallest 與 (D) smallest 是最高級，只用於三者以上的比較，兩者比較不可使用。"},{"level":"adv","topic":"比較對象須對等","q":"Judy's hair is much longer than ______. She never cuts it.","choices":["my","me","mine","myself"],"answer":2,"explain":"than 後面的比較對象必須與前面對等：Judy's hair 要跟「我的頭髮」比，my hair 可用所有格代名詞 mine 代替。(A) my 是所有格形容詞，後面一定要接名詞；(B) me 是受格，會變成「頭髮跟我比」，語意不通；(D) myself 是反身代名詞，不能用來當比較對象。"},{"level":"adv","topic":"兩者比較用比較級","q":"A: This bag is NT$500, and that one is NT$1,200. B: I don't have much money, so I'll take the ______ one.","choices":["more expensive","most expensive","cheapest","cheaper"],"answer":3,"explain":"只有兩個包包在比較，須用比較級；由「沒有很多錢」可知要買較便宜的，故用 the cheaper one。(A) more expensive 語意相反；(B) most expensive 與 (C) cheapest 都是最高級，用於三者以上的比較，兩者比較不可使用。"},{"level":"adv","topic":"one of the + 最高級 + 複數名詞","q":"Taipei 101 is one of the tallest ______ in the world.","choices":["building","buildings","a building","the building"],"answer":1,"explain":"「one of the + 最高級 + 複數名詞」表示「最…的其中之一」，因為是從一群高樓中挑出一棟，名詞必須用複數 buildings。(A) building 是單數；(C) a building 與 (D) the building 都多了冠詞且為單數，one of 後面不能接單數名詞。"},{"level":"adv","topic":"改錯：雙重比較級","q":"Which sentence is correct?","choices":["Nancy is more prettier than her sister.","Nancy is the more pretty than her sister.","Nancy is prettier than her sister.","Nancy is the prettiest than her sister."],"answer":2,"explain":"pretty 是「子音＋y」結尾，比較級去 y 改 i 加 -er，寫成 prettier，句型為「A is + 比較級 + than + B」，故 (C) 正確。(A) more 與 -er 不可同時出現，是常見的「雙重比較級」錯誤；(B) 比較級前不加 the，且 pretty 的比較級應為 prettier；(D) 最高級 the prettiest 不能與 than 連用。"},{"level":"adv","topic":"副詞最高級 of all","q":"Everyone in my family can sing, but my mom sings ______ of all.","choices":["good","better","the better","best"],"answer":3,"explain":"sing 是動詞，須用副詞修飾；well 的不規則變化為 well–better–best，of all 表示「所有人之中」的範圍，故用副詞最高級 best（副詞最高級前的 the 可省略）。(A) good 是形容詞，不能修飾動詞；(B) better 是比較級，須搭配 than；(C) the better 用於兩者之間的比較。"},{"level":"adv","topic":"不規則變化 far-farther","q":"My house is ______ from school than Tom's, so I take a bus every day.","choices":["farther","far","farer","the farthest"],"answer":0,"explain":"far 屬不規則變化：far–farther/further–farthest/furthest，表示「距離較遠」用 farther（further 亦可）；句中有 than，故用比較級。(B) far 是原級，不能與 than 連用；(C) farer 是拼字錯誤，far 不加 -er；(D) the farthest 是最高級，不能與 than 連用。"},{"level":"adv","topic":"句意轉換 not as...as","q":"\"Nick is not as old as Sam.\" What does the sentence mean?","choices":["Nick is older than Sam.","Sam is older than Nick.","Nick and Sam are the same age.","Sam is younger than Nick."],"answer":1,"explain":"「A is not as + 原級 + as B」表示「A 不如 B…」，所以 Nick 的年紀不如 Sam 大，也就是 Sam 比 Nick 年長 (Sam is older than Nick)。(A) 與 (D) 都把大小關係說反了；(C) 若兩人同年應說 Nick is as old as Sam，與原句的否定語意不符。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], seen=[], recent=[], sinceReview=0, problem=null, answered=false, streak=0, lastIdx=-1;
const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
