/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"謙敬詞－稱自己的父親","q":"小華在班上向同學介紹自己的父親，下列說法最正確的是哪一項？","choices":["這位是家父。","這位是我的令尊。","這位是舍父。","這位是敝父。"],"answer":0,"explain":"稱自己的父親要用謙詞「家父」（或「家嚴」）。「令尊」是敬稱對方的父親，用來稱自己的爸爸是最常見的誤用；「舍」只用於稱自己的平輩或晚輩（舍弟、舍妹），並無「舍父」的說法；「敝」用於自謙自己所屬的團體或事物（敝校、敝姓），也不能加在「父」字上。"},{"level":"basic","topic":"謙敬詞－稱對方的母親","q":"老師和小明談話時提到小明的母親，最得體的稱呼是下列何者？","choices":["家母","令堂","慈母","舍母"],"answer":1,"explain":"「令」是敬詞，專用於稱對方的親屬，稱對方的母親為「令堂」。「家母」是稱自己的母親，用來稱別人的媽媽是誤用；「慈母」只是一般泛稱，不作敬稱使用；「舍」限用於自己的平輩、晚輩，並無「舍母」的說法。"},{"level":"basic","topic":"謙敬詞－家舍令敝的分工","q":"關於「家、舍、令、敝」四個謙敬詞的用法，下列敘述正確的是？","choices":["「家」用來稱對方的長輩，如家兄、家姊","「舍」用來稱自己的長輩，如舍父、舍母","「令」用來敬稱對方的親屬，如令兄、令妹","「敝」用來敬稱對方所屬的團體，如敝校、敝公司"],"answer":2,"explain":"「令」是敬詞，用於稱對方的親屬，如令尊、令堂、令兄、令嬡。「家」用於稱自己的長輩及年長的平輩（家父、家兄），不是稱對方；「舍」用於稱自己的平輩或晚輩（舍弟、舍妹、舍姪），不能稱長輩；「敝」是自謙詞，只用於自己所屬的團體或事物（敝校、敝姓），不可用來稱對方。"},{"level":"adv","topic":"謙敬詞－綜合辨誤","q":"下列各句的謙敬詞，使用「錯誤」的是哪一句？","choices":["改天想到府上拜訪，向伯父伯母請安。","這是拙作，還請您多多指教。","這是我的愚見，不知您有什麼高見？","家父下週八十大壽，歡迎各位到寒舍為令尊祝壽。"],"answer":3,"explain":"「令尊」是敬稱對方的父親，句中祝壽的對象既是「家父」，就不能又說「為令尊祝壽」，前後矛盾，應改為「為家父祝壽」。其餘三句：「府上」稱對方的家、「拙作」謙稱自己的作品、「愚見」稱自己的意見而「高見」稱對方的意見，敬謙分明，用法都正確。"},{"level":"basic","topic":"謙敬詞－稱自己的子女","q":"王先生在聚會中向朋友介紹自己的女兒，下列說法最恰當的是？","choices":["這是我的令嬡。","這是我家的千金。","這是小女。","這是愛女。"],"answer":2,"explain":"自稱自己的女兒用謙詞「小女」，自稱自己的兒子則用「小犬」或「犬子」。「令嬡」與「千金」都是敬稱對方的女兒，不能用來稱自己的女兒；「愛女」帶有讚美意味，也不是自謙的用法。敬稱對方的兒子則說「令郎」。"},{"level":"adv","topic":"謙敬詞－作品與意見的敬謙","q":"陳老師出版新書，想請李教授寫序。下列請託用語最得體的是？","choices":["拜讀您的拙作，獲益良多，懇請為我的大作寫序。","拜讀您的大作，獲益良多，懇請為拙作賜序。","您的高見與我的高見不謀而合，敬請為大作寫序。","在下的大作即將出版，敬請惠賜愚見。"],"answer":1,"explain":"「大作」敬稱他人的作品，「拙作」謙稱自己的作品；「高見」稱對方的意見，「愚見、拙見」稱自己的意見。「拜讀您的大作……懇請為拙作賜序」敬謙分明，最為得體。把「大作」「拙作」完全顛倒、把自己的意見也說成「高見」、把自己的作品說成「大作」又反過來請對方賜「愚見」，都是最常見的誤用。"},{"level":"basic","topic":"書信－信封啟封詞（師長）","q":"小婷寫信給國文老師，信封中路寫「○○○老師」，姓名下方的啟封詞應選用下列何者？","choices":["道啟","鈞啟","大啟","安啟"],"answer":0,"explain":"「道啟」用於師長；「鈞啟」用於長官、上級；「大啟」（或「台啟」）用於一般平輩；「安啟」「福啟」用於祖父母、父母等直系尊親。寫給老師應用「道啟」，把老師的啟封詞寫成「鈞啟」是常見錯誤。"},{"level":"adv","topic":"書信－中式直式信封寫法","q":"關於中式直式信封的寫法，下列敘述正確的是？","choices":["收信人的郵遞區號寫在信封右上角，寄信人的郵遞區號寫在左下角。","收信人的姓名和地址都要寫在信封右路。","信封中路寫的是寄信人的姓名與稱呼。","寄信人姓名下方應寫「敬啟」，以示恭敬。"],"answer":0,"explain":"中式直式信封分三路：右路上方寫收信人地址（郵遞區號在右上角），中路寫收信人姓名、稱呼與啟封詞，左路下方寫寄信人地址、姓名與緘封詞（郵遞區號在左下角）。收信人姓名必須寫在中路而非右路；中路絕不是寄信人；寄信人姓名下方應寫緘封詞「緘」（對長輩用「謹緘」），「敬啟」是要求對方恭敬地開啟，既不合禮，更不該寫在自己名下。"},{"level":"basic","topic":"書信－信箋結構順序","q":"一封完整的書信，在正文之前的三個部分，依序應該是下列哪一組？","choices":["提稱語→稱謂→啟事敬辭","啟事敬辭→稱謂→提稱語","稱謂→啟事敬辭→提稱語","稱謂→提稱語→啟事敬辭"],"answer":3,"explain":"書信結構依序為：稱謂→提稱語→啟事敬辭→正文→結尾應酬語→問候語→自稱署名及末啟詞。要先寫對方的稱謂（如「老師」），再加提稱語（如「道鑒」），接著才是啟事敬辭（如「敬稟者」），順序不可顛倒。"},{"level":"adv","topic":"書信－對尊親的署名與末啟詞","q":"阿哲寫信給祖父，信末署名處最恰當的寫法是？","choices":["孫 ○○ 敬稟","孫 ○○ 手書","孫 ○○ 鈞啟","孫 ○○ 大啟"],"answer":0,"explain":"寫給祖父母、父母等直系尊親，末啟詞用「敬稟」「謹稟」「叩稟」。「手書」「手諭」是長輩寫給晚輩時才用，晚輩對長輩不可使用；「鈞啟」「大啟」是寫在信封上請收信人開啟的啟封詞，放在自己署名之下語意不通，是把信封用語誤植到信箋的典型錯誤。"},{"level":"basic","topic":"書信－提稱語與對象","q":"下列書信「提稱語」與使用對象的配對，正確的是？","choices":["「道鑒」用於平輩朋友","「台鑒」用於師長","「膝下」用於父母","「鈞鑒」用於晚輩"],"answer":2,"explain":"「膝下」「膝前」用於父母、祖父母等直系尊親；「道鑒」「函丈」用於師長；「台鑒」「大鑒」用於平輩；「鈞鑒」用於長官、上級。把「道鑒」與「台鑒」對調，是師長與平輩用語互換的錯誤；「鈞鑒」更不可用在晚輩身上。"},{"level":"adv","topic":"書信－啟封詞誤用辨析","q":"下列信封中路的寫法，何者「不」恰當？","choices":["李大明 校長 鈞啟","王小志 同學 鈞啟","陳美玲 老師 道啟","張志明 先生 大啟"],"answer":1,"explain":"「鈞啟」只用於長官、上級等尊長，寫給學生、晚輩應用「啟」或「收啟」，用「鈞啟」是尊卑顛倒。其餘：對校長（長官）用「鈞啟」、對老師用「道啟」、對平輩先生用「大啟」，都符合規範。"},{"level":"basic","topic":"便條－性質與適用對象","q":"關於「便條」的敘述，下列何者正確？","choices":["便條必須裝入信封並貼上郵票寄出，才算正式。","便條講求簡便，只適合用於彼此熟識的人之間。","便條可以用來向不熟識的長官提出正式請求。","便條只要寫正文即可，署名和日期都可以省略。"],"answer":1,"explain":"便條是最簡便的書信，不用信封、不必郵寄，也不寫提稱語、問候語等客套用語，因此只適用於熟識的親友之間；對不熟識的人或正式場合仍須寫正式書信。便條雖然簡略，但稱謂、正文、署名、日期（時間）四項要素不可省略。"},{"level":"adv","topic":"便條－必備要素","q":"小柔到同學家借書，同學不在，於是留下便條：「明道：今天下午來找你，向你借《臺灣民間故事》一書，已自書架取走，下週一奉還。」這張便條缺少了下列哪兩項必備要素？","choices":["提稱語與問候語","啟事敬辭與末啟詞","署名與日期","地址與郵遞區號"],"answer":2,"explain":"便條的必備要素是稱謂、正文、署名、日期（時間）。這張便條已有稱謂「明道」和正文，卻少了署名與日期，收信人無從得知是誰、何時留的。便條本來就不必寫提稱語、問候語、啟事敬辭、末啟詞，也不需寫地址與郵遞區號，那些是正式書信與信封才有的項目。"},{"level":"basic","topic":"柬帖－喜帖用語「于歸」","q":"喜帖上的「于歸」一詞，是指下列何者？","choices":["男子娶妻","男女訂婚","女子出嫁","夫妻結婚週年"],"answer":2,"explain":"「于歸」語出《詩經‧周南‧桃夭》「之子于歸」，指女子出嫁，用於女方所發的喜帖。男方為兒子娶媳，帖上多用「合卺」「嘉禮」；訂婚則用「文定」，三者場合不同，不可混用。"},{"level":"basic","topic":"柬帖－喪帖（訃聞）用語","q":"下列詞語，何者是用於「訃聞（喪帖）」的？","choices":["燕爾新婚","花好月圓","鸞鳳和鳴","音容宛在"],"answer":3,"explain":"「音容宛在」指死者的聲音、容貌彷彿還在眼前，是訃聞、輓辭的常見用語。「燕爾新婚」「花好月圓」「鸞鳳和鳴」都是祝賀新婚的喜慶用語，用在喪事是喜喪混用的大忌。"},{"level":"adv","topic":"柬帖－喜喪用語不可混用","q":"下列柬帖用語與使用場合的配對，「錯誤」的是哪一項？","choices":["「文定之喜」──訂婚","「懿德永昭」──女性長輩的喪事","「燕爾新婚」──男女結婚","「合卺之喜」──親人過世"],"answer":3,"explain":"「合卺」指新婚夫妻交杯共飲，是結婚的專用語，用在喪事屬於喜喪混用的嚴重錯誤。其餘配對均正確：「文定」指訂婚，「懿德」讚美女性的美德，用於女喪，「燕爾新婚」用於新婚。"},{"level":"adv","topic":"柬帖－依場合選用賀辭","q":"阿明的姑姑下週要訂婚，他想在賀卡上題一句話。下列最合適的是？","choices":["文定厥祥","于歸誌喜","懿德長昭","喬遷之喜"],"answer":0,"explain":"「文定」指訂婚，「文定厥祥」語出《詩經‧大雅‧大明》，是訂婚常見的賀辭。「于歸誌喜」用於女子出嫁（結婚），時機不合；「懿德長昭」是輓女喪的用語，寫在喜慶賀卡上是大忌；「喬遷之喜」則是祝賀搬新居。"},{"level":"basic","topic":"題辭－賀醫院醫師","q":"王醫師開設的診所今天開幕，下列題辭最適合致贈的是？","choices":["杏壇之光","春風化雨","作育英才","杏林春暖"],"answer":3,"explain":"「杏林」典出三國董奉為人治病、受診者種杏成林，用來代稱醫界，因此賀醫院、醫師用「杏林春暖」「華佗再世」「妙手回春」。「杏壇」是孔子講學之處，代稱教育界，「杏壇之光」「春風化雨」「作育英才」都是賀教育界的題辭，最容易與「杏林」混淆，務必分清。"},{"level":"adv","topic":"題辭－杏林與杏壇辨析","q":"醫界與教育界的題辭最容易混淆。下列題辭與致贈對象的配對，正確的是？","choices":["「妙手回春」贈給退休的國文老師","「杏壇之光」贈給獲頒師鐸獎的校長","「華佗再世」贈給新開幕的書局","「春風化雨」贈給醫術高明的外科醫師"],"answer":1,"explain":"「杏壇」代稱教育界，賀獲師鐸獎的校長用「杏壇之光」最恰當。「妙手回春」「華佗再世」是醫界題辭，贈給老師或書局都不合場合；「春風化雨」稱讚教師的教化之功，用於醫師則張冠李戴。口訣：杏林＝醫界，杏壇＝教育界。"},{"level":"basic","topic":"題辭－賀新居落成","q":"表哥買了新房子，喬遷宴上最適合致贈的題辭是？","choices":["美輪美奐","駿業宏開","松鶴延齡","珠聯璧合"],"answer":0,"explain":"「美輪美奐」「潭第鼎新」用於祝賀新居落成或喬遷。「駿業宏開」是賀開業；「松鶴延齡」是賀壽；「珠聯璧合」是賀結婚，場合都不相符。"},{"level":"basic","topic":"題辭－賀商店開業","q":"鄰居的早餐店明天開幕，下列題辭最適合的是？","choices":["弄璋之喜","白首成約","椿萱並茂","大展鴻圖"],"answer":3,"explain":"祝賀商店、公司開業用「大展鴻圖」「駿業宏開」。「弄璋之喜」賀生男；「白首成約」賀結婚；「椿萱並茂」賀父母雙壽（椿指父、萱指母），都不能用於開業。"},{"level":"basic","topic":"題辭－賀生子女","q":"「弄璋之喜」是用來祝賀下列何事？","choices":["生兒子","生女兒","考取大學","男女結婚"],"answer":0,"explain":"古人生男給他玩「璋」（玉器），生女給她玩「瓦」（紡錘），因此「弄璋之喜」賀生男，「弄瓦之喜」賀生女，兩者最容易記反。賀結婚應用「珠聯璧合」「鸞鳳和鳴」。"},{"level":"adv","topic":"題辭－輓辭男喪女喪之別","q":"同學的祖母過世，全班合送輓額，下列題辭最適合的是？","choices":["典型宛在","道範長存","慈雲永護","松柏長青"],"answer":2,"explain":"輓女喪用「慈雲永護」「懿德長昭」；「典型宛在」用於輓男喪，「道範長存」用於輓師長，贈祖母都不合；「松柏長青」是祝壽的題辭，用在喪事是喜喪混用的大忌。"},{"level":"basic","topic":"對聯－基本規則","q":"關於對聯的基本規則，下列敘述正確的是？","choices":["上下聯字數可以不同，只要意思相對即可。","上下聯相同位置的詞語，詞性要互相對應。","上聯末字通常是平聲，下聯末字通常是仄聲。","上下聯相同位置的字，平仄必須完全相同。"],"answer":1,"explain":"對聯要求上下聯字數相同、詞性相對、平仄相對。字數不同即不成對聯；上下聯末字的平仄恰好相反──上聯末字通常收仄聲，下聯末字通常收平聲；相同位置的字是平仄「相對」而非「相同」。"},{"level":"adv","topic":"對聯－張貼位置","q":"春節時要張貼春聯「一元復始」「萬象更新」。當我們面對大門時，正確的張貼方式是？","choices":["上聯貼在左邊，下聯貼在右邊","上聯貼在右邊，下聯貼在左邊","上下聯可任意張貼，沒有規定","上聯貼在門的上方，下聯貼在門的下方"],"answer":1,"explain":"傳統直式書寫由右而左，因此面對門時，上聯貼右、下聯貼左。此聯「一元復始」末字「始」是仄聲，為上聯，貼右邊；「萬象更新」末字「新」是平聲，為下聯，貼左邊。把上下聯貼反是最常見的錯誤；門楣上方貼的是橫批，並非下聯。"},{"level":"adv","topic":"對聯－依內容判斷行業","q":"「但願世間人無病；何妨架上藥生塵。」這副對聯最適合張貼於下列哪一個場所？","choices":["書店","餐廳","中藥房","婚宴會場"],"answer":2,"explain":"上聯期盼世人都沒有病痛，下聯說即使架上的藥積了灰塵也無妨，「藥」字是最明確的線索，屬於典型的醫藥業行業聯，適合張貼於中藥房或診所。行業聯須從內容線索判斷場合，此聯與書店、餐廳無關，更不能用於喜慶的婚宴會場。"}];

const REVIEW_EVERY=10; /* 每出 10 題新題，插一題複習（從已出過的題隨機抽） */
/* 出題紀錄存 sessionStorage：遊戲每隻怪都會重載本頁 iframe，靠這個讓「已出過的題」延續，避免跨關卡撞題 */
const QKEY='qq:'+location.pathname.split('/').pop();
function loadQState(){ try{ const s=JSON.parse(sessionStorage.getItem(QKEY)||'{}');
  seen=Array.isArray(s.seen)?s.seen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK.length):[];
  sinceReview=Number.isInteger(s.sinceReview)?s.sinceReview:0;
  lastIdx=Number.isInteger(s.lastIdx)?s.lastIdx:-1;
  recent=Array.isArray(s.recent)?s.recent:[]; }catch(e){ seen=[]; sinceReview=0; lastIdx=-1; recent=[]; } }
function saveQState(){ try{ sessionStorage.setItem(QKEY,JSON.stringify({seen:seen,sinceReview:sinceReview,lastIdx:lastIdx,recent:recent})); }catch(e){} }

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 出題策略：從「本難度池中尚未出過的題」隨機抽（等同洗牌發牌），出完才重置該池的紀錄 */
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function pickFrom(arr){ let i,n=0; do{ i=arr[Math.floor(Math.random()*arr.length)]; n++; }while(arr.length>1 && i===lastIdx && n<12); return i; }
function nextProblem(){
  let i;
  /* 複習題只從「同難度池內出過、且不在最近 5 題」的題挑；若沒有夠格的就先發新題、把複習延後 */
  const reviewable = seen.filter(x=>poolIdx.indexOf(x)>=0 && recent.indexOf(x)<0);
  if(sinceReview>=REVIEW_EVERY && reviewable.length){
    i=pickFrom(reviewable); sinceReview=0;
  }else{
    let fresh = poolIdx.filter(x=>seen.indexOf(x)<0);
    if(!fresh.length){ seen=seen.filter(x=>poolIdx.indexOf(x)<0); fresh=poolIdx.slice(); }  /* 該難度池出完 → 只清該池紀錄，其他難度保留 */
    i=pickFrom(fresh);
    if(seen.indexOf(i)<0) seen.push(i);
    sinceReview++;
  }
  lastIdx=i; recent.push(i); if(recent.length>5) recent.shift();
  saveQState(); problem=shuffleChoices(BANK[i]); render();
}
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
  loadQState();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();if(d.cmd==='reroll'){if(typeof answered!=='undefined'&&answered)return;var h=document.getElementById('game-hint');if(h)h.remove();if(typeof nextProblem==='function')nextProblem();}});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty','reroll']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
