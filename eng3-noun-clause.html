<style>

    --ink:#1b1d26; --ink-soft:#5b606f;
    --pos:#2563eb; --neg:#ea580c;
    --right:#16a34a; --wrong:#e11d48;
    --line:#e6e8ef; --card:#ffffff; --key:#f3f5f9; --key-press:#e3e7f0; --bg:#f7f8fb;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--bg);
    display:flex;justify-content:center;padding:14px;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.5px;}
  header .sub{font-size:12px;color:var(--ink-soft);}
  .streak{font-family:'Lexend',sans-serif;font-size:13px;color:var(--ink-soft);} .streak b{color:var(--ink);font-weight:600;}
  .levels{display:flex;gap:8px;}
  .lv{flex:1;border:none;border-radius:12px;padding:10px 0;font-family:inherit;font-size:14px;font-weight:500;
      background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);cursor:pointer;transition:.15s;}
  .lv.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 8px 24px -18px rgba(20,25,50,.35);}
  .q{font-size:18px;font-weight:500;line-height:1.65;min-height:52px;}
  .q .tag{display:inline-block;font-size:11px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;margin-bottom:10px;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fbfcfe;
       border-radius:14px;padding:13px 15px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;transition:.12s;line-height:1.4;}
  .opt:active{transform:scale(.99);}

           font-family:'Lexend',sans-serif;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .opt.pick{border-color:var(--ink);}
  .opt.ok{border-color:var(--right);background:#f0fdf4;color:var(--right);} .opt.ok .mk{background:var(--right);color:#fff;}
  .opt.no{border-color:var(--wrong);background:#fff1f4;color:var(--wrong);} .opt.no .mk{background:var(--wrong);color:#fff;}
  .opt.lock{cursor:default;}
  @keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}
  .shake{animation:shake .35s;}
  .explain{margin-top:16px;border-top:1.5px dashed var(--line);padding-top:14px;display:none;}
  .explain.show{display:block;}
  .explain .lead{font-size:12px;color:var(--subj);letter-spacing:1px;margin-bottom:4px;}
  .explain .body{font-size:15px;line-height:1.8;color:var(--ink);}
  .explain .kp{font-size:12px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px;}
  .go{border:none;border-radius:16px;height:56px;width:100%;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:1px;
      background:var(--pos);color:#fff;cursor:pointer;transition:.12s;}
  .go:active{transform:scale(.98);} .go:disabled{opacity:.35;}

<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"that 引導的名詞子句當受詞","q":"Everyone knows ___ the earth goes around the sun.","choices":["what","which","that","whether"],"answer":2,"explain":"know 後面接 that 引導的名詞子句當受詞，敘述一個完整的事實（口語中 that 常省略）。what 引導的名詞子句本身必須缺主詞或受詞（如 what he said），但 the earth goes around the sun 結構完整；which 需要有明確的選擇範圍；whether 表「是否」，與「大家都知道」的確定語氣不合。"},{"level":"basic","topic":"間接問句語序（where + be 動詞）","q":"Excuse me. Could you tell me where ___?","choices":["is the post office","the post office is","does the post office be","the post office does be"],"answer":1,"explain":"疑問詞引導的名詞子句（間接問句）必須還原成「疑問詞＋主詞＋動詞」的肯定句語序，不可倒裝，所以 be 動詞 is 要放在主詞 the post office 後面。is the post office 是直接問句的倒裝語序；be 動詞的句子不使用助動詞 do/does，所以 does the post office be、the post office does be 都是錯誤結構。"},{"level":"basic","topic":"間接問句語序（what + 一般動詞）","q":"I have no idea what ___ after school every day.","choices":["does she do","does she","she do","she does"],"answer":3,"explain":"間接問句要用肯定句語序：疑問詞 what＋主詞 she＋動詞。主詞是第三人稱單數，動詞用 does（此處 does 是一般動詞「做」）。does she do 保留了直接問句的倒裝；does she 缺主要動詞；she do 動詞未加 s。"},{"level":"basic","topic":"whether 引導的名詞子句（是非疑問）","q":"I wonder ___ it will rain tomorrow. I really want to go hiking with my classmates.","choices":["that","what","whether","how"],"answer":2,"explain":"由是非問句 Will it rain tomorrow? 轉成名詞子句時，要用 whether（或 if）表「是否」。that 用來引導陳述事實的子句；what 必須在子句中當主詞或受詞，但 rain 在此不需受詞；how 表方式，語意不合。"},{"level":"basic","topic":"that 名詞子句當主詞補語（The problem is that...）","q":"The problem is ___ we don't have enough time to finish the report.","choices":["that","because","what","so"],"answer":0,"explain":"be 動詞後面用 that 引導的名詞子句當主詞補語。常見錯誤是寫成 The problem is because...，但 because 引導的是副詞子句，不能當補語；what 子句必須缺主詞或受詞，而此處子句結構完整；so 是對等連接詞，不能引導名詞子句。"},{"level":"basic","topic":"間接問句中助動詞的還原（when）","q":"Can you tell me when the movie ___? I don't want to be late.","choices":["does start","do start","start","starts"],"answer":3,"explain":"直接問句 When does the movie start? 變成名詞子句時，助動詞 does 要拿掉，並把時態還給主要動詞，故用 starts。does start、do start 是助動詞殘留（且 do 與單數主詞不合）；start 未加 s 也是間接問句常見錯誤。"},{"level":"basic","topic":"who 當名詞子句主詞時語序不變","q":"Do you know who ___ the window? Mom is really angry now.","choices":["did he break","broke","he broke","was broken"],"answer":1,"explain":"疑問詞 who 本身就是名詞子句的主詞時，後面直接接動詞，不需要再加主詞或助動詞，依語意用過去式 broke。did he break 既保留倒裝又多了一個主詞；he broke 多了主詞 he；was broken 是被動語態，後面不能再接受詞 the window。"},{"level":"basic","topic":"間接問句語序（how）","q":"I don't know how ___ to school every morning. Maybe he takes the MRT.","choices":["does he go","he goes","he go","goes he"],"answer":1,"explain":"名詞子句用「how＋主詞＋動詞」的肯定句語序，主詞 he 是第三人稱單數，動詞加 s。does he go 是直接問句的倒裝語序；he go 動詞形式錯誤；goes he 屬於錯誤倒裝。"},{"level":"basic","topic":"間接問句語序（why + be 動詞過去式）","q":"Nobody knows why ___ so upset at the meeting yesterday.","choices":["Amy was","was Amy","did Amy be","Amy did be"],"answer":0,"explain":"間接問句要用「why＋主詞＋be 動詞」的語序，且 yesterday 表過去，用 was，故為 Amy was。was Amy 是直接問句的倒裝；be 動詞的句子不使用助動詞 did，所以 did Amy be、Amy did be 都是錯的。"},{"level":"basic","topic":"that 名詞子句當主詞","q":"___ Kevin won first prize in the speech contest surprised everyone in our class.","choices":["That","What","Which","It"],"answer":0,"explain":"名詞子句當主詞時要用 That 引導，而且放在句首當主詞時 that 不可省略。What 引導的子句必須缺主詞或受詞，但 Kevin won first prize 結構完整；Which 需要有選擇範圍；It 是代名詞，不能引導子句。"},{"level":"basic","topic":"whether ... or not 的固定用法","q":"I'm not sure ___ or not Lisa will join us for dinner tonight.","choices":["that","if","what","whether"],"answer":3,"explain":"當 or not 緊接在連接詞後面時只能用 whether，不能用 if（若改成 ... if Lisa will join us or not 則可以）。that 不表「是否」；what 必須在子句中當主詞或受詞，但此處子句結構完整。"},{"level":"basic","topic":"改錯：間接問句不可用倒裝語序","q":"Which sentence uses the correct word order in the noun clause (indirect question)?","choices":["Do you know where does Peter live?","Do you know where Peter lives?","Do you know where lives Peter?","Do you know where Peter live?"],"answer":1,"explain":"間接問句必須還原成「疑問詞＋主詞＋動詞」的肯定句語序，助動詞 does 要拿掉並把時態還給主要動詞，故正解為 Do you know where Peter lives?。where does Peter live 保留倒裝與 does；where lives Peter 動詞跑到主詞前；where Peter live 動詞未加 s。"},{"level":"basic","topic":"what 引導的名詞子句當受詞","q":"I didn't hear ___ you said just now. Could you say it again, please?","choices":["that","which","what","if"],"answer":2,"explain":"said 後面缺受詞，所以要用 what（＝the thing that）引導名詞子句，並在子句中兼當 said 的受詞。that 引導的名詞子句結構必須完整；which 需要選擇範圍；if 表「是否」，語意不合。"},{"level":"basic","topic":"名詞子句的時態一致","q":"Tom told me that he ___ really tired, so he went to bed early last night.","choices":["is","will be","has been","was"],"answer":3,"explain":"主要子句動詞 told 是過去式，that 名詞子句的時態也要跟著變成過去式 was，這就是時態一致。is 與 will be 時態不符；has been（現在完成式）不可與 last night 這類明確的過去時間連用。"},{"level":"adv","topic":"句型轉換：直接問句改為名詞子句（how old）","q":"Turn the question \"How old is your brother?\" into a noun clause: \"May I ask ___?\"","choices":["how old is your brother","how old your brother is","how old does your brother","that how old your brother is"],"answer":1,"explain":"直接問句變成名詞子句時要去掉倒裝，改成「疑問詞（組）＋主詞＋動詞」，所以 be 動詞 is 要移到主詞 your brother 之後。how old is your brother 保留倒裝；how old does your brother 用助動詞取代 be 動詞且缺補語；疑問詞本身就是連接詞，前面不可再加 that。"},{"level":"adv","topic":"時態一致的例外：不變的事實","q":"In science class, Mr. Lin taught us that water ___ at 100 degrees Celsius.","choices":["boils","boiled","will boil","is boiling"],"answer":0,"explain":"主要子句雖然是過去式 taught，但名詞子句敘述不變的科學事實或真理時，仍然用現在簡單式 boils，不受時態一致限制。boiled、will boil、is boiling 都會把「永遠成立的事實」誤寫成特定時間發生的動作。"},{"level":"adv","topic":"介系詞後只能用 whether","q":"We are still talking about ___ we should tell the teacher the truth.","choices":["whether","if","that","what"],"answer":0,"explain":"介系詞（此處 about）後面的名詞子句只能用 whether，不能用 if，這是 whether 與 if 最重要的差別之一。that 子句一般不直接放在介系詞後；what 必須在子句中當主詞或受詞，但 tell the teacher the truth 結構已完整。"},{"level":"adv","topic":"do you think 型間接問句的語序","q":"Who do you think ___ the singing contest, Jason or Amy?","choices":["will win","will he win","does he win","winning"],"answer":0,"explain":"主要子句是 do you think 時，疑問詞要提到句首，後面的子句仍用肯定句語序；此處 Who 就是該子句的主詞，所以直接接動詞 will win，不可再加主詞 he。does he win 又多主詞又時態不合；winning 缺少助動詞，不能單獨當動詞。"},{"level":"adv","topic":"找出名詞子句用法錯誤的句子","q":"Which sentence has a mistake in the noun clause?","choices":["I don't know what time the train leaves.","Can you tell me why she is crying?","I wonder how much does this jacket cost.","He asked me whether I liked the movie."],"answer":2,"explain":"I wonder how much does this jacket cost. 保留了直接問句的助動詞與倒裝，應改成 I wonder how much this jacket costs.（拿掉 does，時態還給主要動詞）。其餘三句都正確：前兩句為「疑問詞＋主詞＋動詞」語序，最後一句用 whether 引導是非疑問並符合時態一致。"},{"level":"adv","topic":"間接問句中助動詞 did 的還原","q":"I asked Jenny where ___ the beautiful dress, and she said it was a gift from her aunt.","choices":["did she get","she gets","she get","she got"],"answer":3,"explain":"名詞子句要拿掉助動詞 did，並把過去式還原到主要動詞上，所以用 she got。did she get 是直接問句語序；she gets 時態與 asked、said 不一致；she get 動詞形式錯誤。"},{"level":"adv","topic":"句型轉換：forgot + 間接問句","q":"Which sentence correctly puts the question \"Where did you put my keys?\" after \"I forgot\"?","choices":["I forgot where did you put my keys.","I forgot where you put my keys.","I forgot where you did put my keys.","I forgot that where you put my keys."],"answer":1,"explain":"間接問句要去掉助動詞 did，改成「疑問詞＋主詞＋動詞」，過去式由主要動詞 put 表示（put 的過去式同形）。where did you put 保留倒裝；where you did put 的 did 在此為多餘；疑問詞已是連接詞，前面不能再加 that。"},{"level":"adv","topic":"虛主詞 It 代替 that 名詞子句主詞","q":"___ is surprising that our team won the city championship.","choices":["That","What","It","Which"],"answer":2,"explain":"that 名詞子句當主詞時，常用虛主詞 It 放句首，真正的主詞（that 子句）移到句尾，即 It is surprising that...。That、Which 不能同時當主詞又讓 that 子句留在句尾；What 若要成立必須寫成 What is surprising is that...（需要兩個動詞 is）。"},{"level":"adv","topic":"What 與 That 引導名詞子句的辨析","q":"___ Grandma cooked for us last night tasted really good.","choices":["That","Which","How","What"],"answer":3,"explain":"cooked 後面缺受詞，因此要用 What（＝the thing that，本身兼具受詞功能）引導名詞子句當主詞。若用 That，後面的子句必須結構完整（例如 That Grandma cooked for us made everyone happy.）；Which 需要選擇範圍；How 表方式，語意不合。"},{"level":"adv","topic":"名詞子句可用未來式（對比 if 條件副詞子句）","q":"No one is sure whether people ___ on Mars in the future, but scientists keep trying.","choices":["live","lived","will live","living"],"answer":2,"explain":"whether 在這裡引導名詞子句（說明 not sure 的內容），談未來的事就要用 will live。只有「if 引導的條件副詞子句」（如 If it rains tomorrow, we will stay home.）才用現在式代替未來式，兩者常被搞混。live 是現在式，與 in the future 衝突；lived 是過去式；living 缺少助動詞，不能單獨當動詞。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ let i; do{ i=poolIdx[Math.floor(Math.random()*poolIdx.length)]; }while(poolIdx.length>1 && i===lastIdx); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
