<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"文學常識－《青鳥》作者國籍","q":"童話劇《青鳥》的作者梅特林克，是下列哪一國的作家？","choices":["丹麥","法國","比利時","英國"],"answer":2,"explain":"梅特林克是比利時劇作家，曾獲諾貝爾文學獎，其童話劇《青鳥》以尋找幸福為題材。他雖以法文寫作，國籍卻是比利時，故「法國」是最常見的誘答；丹麥聞名的是童話作家安徒生；英國則與其無關。"},{"level":"basic","topic":"文學常識－《青鳥》文體辨識","q":"作者在文章開頭引述的《青鳥》，就其原本的文學體裁而言，應屬於下列何者？","choices":["長篇小說","敘事長詩","短篇寓言小說","童話劇（劇本）"],"answer":3,"explain":"《青鳥》原是可供舞台演出的童話劇（劇本），並非小說或詩歌。前三個選項雖同為文學作品類型，但都不符合《青鳥》以劇本形式呈現、可搬演於舞台的事實。"},{"level":"basic","topic":"文意理解－故事情節結果","q":"依課文所述，兄妹倆奉命遠行尋找青鳥，最後的結果是什麼？","choices":["在遙遠的國度捕獲青鳥後帶回家中","因為途中畏懼艱難而中途放棄尋找","歷盡艱辛仍遍尋不著，返家後才發現青鳥原來就在自己家裡","雖然找到青鳥，卻在返家途中不慎將牠放走"],"answer":2,"explain":"故事的關鍵轉折在於「遠求不得、返家乃見」，這正是作者立論的基礎。選項一與故事結果相反；選項二誤把兄妹寫成半途而廢，抹去了「歷盡艱辛」的鋪墊；選項四則是憑空添加的情節。"},{"level":"basic","topic":"象徵意義－青鳥的意涵","q":"在《青鳥》故事與本文中，「青鳥」所象徵的意涵是下列何者？","choices":["財富","幸福","自由","智慧"],"answer":1,"explain":"全文以青鳥作為幸福的象徵，「青鳥就在身邊」即等於「幸福就在身邊」。財富、自由、智慧雖也是人們追求的目標，但都不是本文賦予青鳥的象徵義。"},{"level":"basic","topic":"主旨掌握","q":"本文所要傳達的核心主旨是下列何者？","choices":["唯有不斷向遠方追尋，才可能獲得真正的幸福","人生幸福全由際遇決定，個人努力並無意義","幸福並非遙不可及的目標，而就存在於日常生活與身邊的人事物之中","童話故事雖然美好，卻與現實人生毫無關聯"],"answer":2,"explain":"作者藉青鳥故事點明幸福不在天邊而在身邊。選項一正是文中被反省的迷思；選項二流於宿命論，文中並無此意；選項四否定故事的啟發性，與作者借故事說理的用意相反。"},{"level":"basic","topic":"文學常識－作者陳幸蕙","q":"關於本文作者陳幸蕙，下列敘述何者正確？","choices":["為清代著名的古文家，主張文以載道","為台灣當代作家，以散文創作聞名","為專事新詩創作的當代詩人","為以武俠小說著稱的通俗文學作家"],"answer":1,"explain":"陳幸蕙是台灣當代散文作家，作品多從生活取材，清新而富哲思。其餘三項在時代、地域或文類上皆與作者不符。"},{"level":"basic","topic":"文類辨識－本文體裁","q":"就體裁而言，〈青鳥就在身邊〉一文應歸類為下列何者？","choices":["章回小說","現代新詩","應用文中的書信","現代散文"],"answer":3,"explain":"本文為抒情兼說理的現代散文，有敘事、有議論，形式自由。它沒有章回小說的回目與虛構情節，不分行押韻，也不具備書信的稱謂、問候等格式。"},{"level":"basic","topic":"寫作手法－引故事開篇的用意","q":"作者在文章開頭先敘述《青鳥》的故事，主要用意為何？","choices":["作為引子，藉眾人熟悉的故事帶出後文所要闡述的道理","為了介紹外國戲劇發展史，補充文學常識","藉此批評童話情節不合現實邏輯","純粹用來湊足篇幅，與主旨並無關聯"],"answer":0,"explain":"故事在此是「引子」，用來引出議論。選項二把手段當成目的；選項三與作者肯定故事寓意的態度相反；選項四則忽略了故事與主旨密不可分的關係。"},{"level":"basic","topic":"篇章結構－全文脈絡","q":"本文在謀篇布局上的主要脈絡，下列何者最為切合？","choices":["先提出主張，再逐一反駁，最後推翻自己先前的說法","先寫景，次抒情，最後再回到寫景作結","先描寫人物外貌，再依序敘述其一生行誼","先敘述青鳥故事，再由此闡發道理，終而勸勉讀者珍惜身邊的幸福"],"answer":3,"explain":"本文屬「先敘後議」的結構，循「故事→說理→勸勉」層層推進。選項一的自我推翻、選項二的寫景框架、選項三的人物傳記寫法，都不是本文的組織方式。"},{"level":"basic","topic":"寫作手法－借事說理","q":"作者藉《青鳥》這則故事來闡明幸福的道理，這種寫法一般稱為什麼？","choices":["託物言志中的詠物寫景","借事說理","設問激問的問答鋪陳","層層鋪排的排比堆疊"],"answer":1,"explain":"以一則具體事件（故事）為憑藉，導出抽象的道理，即「借事說理」。選項一著重描摹物象以寄託情志，本文並未細寫物態；選項三、四是句式修辭，並非全篇的說理方式。"},{"level":"basic","topic":"詞語理解－遍尋不著","q":"「遍尋不著」一詞的意思，最接近下列何者？","choices":["到處尋找卻始終找不到","偶然遇見卻無心把握","不必尋找便自然出現","因害怕困難而放棄尋找"],"answer":0,"explain":"「遍」是到處、普遍，「不著」即沒有找到，合指四處找遍仍無所獲。選項二、三、四分別偏向「錯失」「自來」「放棄」，都與「找遍」的動作不合。"},{"level":"basic","topic":"詞語理解－知足","q":"下列對「知足」一詞的解釋，何者正確？","choices":["知道自己能力不足，因而發憤上進","滿足於現狀，從此不再學習長進","對已經擁有的感到滿意，不作分外的貪求","明白他人的長處並虛心加以效法"],"answer":2,"explain":"知足是珍惜、滿意於自己已有的，不作無盡的貪求。選項一混淆了「知不足」；選項二把知足曲解為消極怠惰；選項四說的是見賢思齊，三者皆非「知足」的本義。"},{"level":"basic","topic":"修辭與手法辨識－象徵","q":"作者以「青鳥」這一具體的鳥兒寄託「幸福」這一抽象概念，這種表現手法稱為什麼？","choices":["誇飾","象徵","對偶","頂真"],"answer":1,"explain":"以具體可感的事物寄寓抽象意涵，即為象徵。誇飾是言過其實地形容；對偶講求字數相當、詞性相對；頂真是前句末語詞作為後句開頭，三者皆非此處的手法。"},{"level":"adv","topic":"主旨深究－情節與立意的關係","q":"故事中兄妹「歷盡艱辛卻遍尋不著」的情節安排，對凸顯本文主旨有何作用？","choices":["說明幸福必須付出極大代價才能換得","暗示兄妹能力不足，因此不配獲得幸福","以向外苦苦追尋的落空，反襯幸福其實近在身邊，使主旨更加鮮明","強調旅途見聞的豐富精采，轉移讀者對說理的注意"],"answer":2,"explain":"苦尋而不得，正是為了襯托「原來就在家中」的驚覺，形成強烈對照。選項一把「艱辛」誤讀為幸福的代價；選項二加入原文沒有的價值判斷；選項四誤以為情節是為了寫遊歷。"},{"level":"adv","topic":"象徵分析－「家」的意涵","q":"進一步推敲，故事中「家」這個場景在文中所隱含的意義，最可能是下列何者？","choices":["象徵人們難以擺脫的束縛","象徵遙不可及的理想境界","象徵一去不返的童年回憶","象徵平凡的日常與身邊早已擁有的一切"],"answer":3,"explain":"青鳥在家中被發現，「家」自然指向最貼近、最平常而常被忽略的生活現場。選項一將家理解為負面的牢籠；選項二與「就在身邊」正好相反；選項三偏向懷舊，非本文重點。"},{"level":"adv","topic":"手法賞析－夾敘夾議的效果","q":"本文敘事與議論交錯進行的散文筆法，最主要的效果是什麼？","choices":["使抽象的道理有具體事例可依託，讀來既生動又容易領會","使文章結構鬆散，主旨因而模糊不清","使文章成為情節曲折的小說，脫離散文的範疇","使作者的立場隱而不顯，讀者只能自行猜測其態度"],"answer":0,"explain":"夾敘夾議能一面呈現故事、一面點撥義理，避免說理流於空泛。選項二把手法的優點說成缺點；選項三混淆了引述故事與改寫成小說；選項四誤以為作者未表態，實則議論處立場鮮明。"},{"level":"adv","topic":"推論－引子的結構功能","q":"假使刪去文章開頭的《青鳥》故事，對全文最可能造成的影響是什麼？","choices":["主旨會轉變為勸人勇於冒險犯難","說理失去具體依託，讀者較難產生共鳴，說服力也隨之減弱","文章因而更為精簡，主旨反而更加突出","議論部分將無法成立，全文只能淪為記敘文"],"answer":1,"explain":"故事是議論的憑藉，抽掉之後道理便成懸空的教訓。選項一與全文立意不合；選項三忽略引子的鋪墊功能；選項四說法自相矛盾——刪去敘事後留下的反而是議論。"},{"level":"adv","topic":"生活應用－態度落實","q":"下列做法，何者最能落實本文所倡導的生活態度？","choices":["為了追求事業成功，長期忽略家人的陪伴","總覺得別人擁有的比自己好，因而不斷與人比較","把幸福全部寄託在某個尚未達成的遠大目標上","每天留心家人的關懷與生活中的細微小事，並心存感謝"],"answer":3,"explain":"以感恩、細膩之心體會日常，正是作者的勸勉。選項一、三都是「向外苦尋」而錯過身邊幸福的例子；選項二的比較心態更使人難以知足。"},{"level":"adv","topic":"延伸－成語意趣聯繫","q":"下列成語，何者的意趣與兄妹遠行尋鳥、返家方見的經歷最為相近？","choices":["守株待兔","精衛填海","騎驢覓驢","螳臂當車"],"answer":2,"explain":"「騎驢覓驢」比喻所求之物其實就在自己身邊，卻仍向外尋找，與本文旨趣相合。守株待兔喻墨守成規、心存僥倖；精衛填海喻意志堅定不畏艱難；螳臂當車喻不自量力，均不切合。"},{"level":"adv","topic":"主旨深究－誤讀辨析","q":"下列對本文旨意的理解，何者最為恰當？","choices":["作者認為人不該有任何理想與追求，安於現狀即可","作者並非反對努力追求，而是提醒人們別因一味向外求索，而忽略了身邊已有的幸福","作者主張幸福只存在於童話之中，現實人生並不存在幸福","作者認為只要留在家中足不出戶，自然就能得到幸福"],"answer":1,"explain":"文章的批評對象是「只知向外苦求」的心態，而非追求本身。選項一、四把知足曲解為消極不作為；選項三則否定了作者要人在現實生活中發現幸福的用意。"},{"level":"adv","topic":"手法賞析－標題效果","q":"以〈青鳥就在身邊〉為題，在寫作上具有什麼效果？","choices":["直接點出全文主旨，並借用眾所熟知的意象，兼具提示與吸引讀者的作用","刻意隱藏主旨，使讀者讀完全文仍難以判斷作者立場","以疑問方式引發爭辯，留待讀者自行提出反駁","僅交代寫作的時間與地點，與文章內容無涉"],"answer":0,"explain":"標題既含象徵意象（青鳥），又以「就在身邊」直陳主旨，具畫龍點睛之效。選項二與標題的明確性相反；標題並非問句，故選項三不合；選項四完全誤解題目文字。"},{"level":"adv","topic":"意象運用－借用既有文化符號","q":"作者選擇借用「青鳥」而非另創新的比喻來說明幸福，最主要的好處是什麼？","choices":["可以藉此顯示作者閱讀外國文學的廣博","可以使文章完全避免說理的意味","可以讓散文更接近戲劇的表演形式","青鳥早已是人們共同熟悉的幸福符號，借用能省去繁複說明並易於引發共鳴"],"answer":3,"explain":"沿用既有的文化符號，讀者一望即知其義，說理因而更加簡潔有力。選項一將寫作策略誤解為炫學；選項二與本文說理散文的性質不符；選項三混淆了引用戲劇故事與模仿戲劇形式。"},{"level":"adv","topic":"推論與延伸－幸福的關鍵","q":"依據本文的觀點推論，一個人是否感到幸福，關鍵在於什麼？","choices":["是否具備發現與珍惜的心，而不在於擁有多少或走得多遠","是否曾經遠行，見識過廣大的世界","是否比身邊的人擁有更多的財富與名聲","是否能一舉達成心中最大的願望"],"answer":0,"explain":"作者強調幸福需要用心體會，是一種感受能力而非外在條件。選項二正是兄妹遠行卻落空的寫照；選項三、四把幸福繫於比較與外在成就，皆與文旨相違。"},{"level":"adv","topic":"延伸－詩句意趣聯繫","q":"就「向外苦尋而不得，回頭卻發現目標近在眼前」這一情境而言，下列詩句所寫的感受何者與此最為接近？","choices":["眾裡尋他千百度，驀然回首，那人卻在燈火闌珊處","欲窮千里目，更上一層樓","野火燒不盡，春風吹又生","莫愁前路無知己，天下誰人不識君"],"answer":0,"explain":"辛棄疾〈青玉案〉寫遍尋不獲、回首方見，與本文「遠求不得、返家乃見」的頓悟最為神似。王之渙〈登鸛雀樓〉勉人登高望遠；白居易寫野草生命力頑強；高適〈別董大〉為送別勉友之語，均與此情境不合。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], queue=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); queue=[]; }
/* 洗牌後依序發牌：整池抽完才重洗，一輪內不重複；重洗時避免與上一題相接 */
function refillQueue(){ queue = poolIdx.slice();
  for(let k=queue.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=queue[k]; queue[k]=queue[r]; queue[r]=t; }
  if(queue.length>1 && queue[queue.length-1]===lastIdx){ const t=queue[queue.length-1]; queue[queue.length-1]=queue[0]; queue[0]=t; }
}
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ if(!queue.length) refillQueue(); const i=queue.pop(); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
