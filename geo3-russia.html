<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"位置與範圍－世界面積最大的國家","q":"下列關於俄羅斯領土範圍的敘述，何者最正確？","choices":["面積居世界各國之首，領土橫跨歐、亞兩洲","面積僅次於加拿大，領土全部位於亞洲","面積居世界前列，但領土完全位於歐洲","面積不及中國，領土橫跨歐、非兩洲"],"answer":0,"explain":"俄羅斯是世界面積最大的國家（加拿大居次），領土西起東歐、東抵太平洋岸，以烏拉山為界橫跨歐、亞兩洲。「僅次於加拿大且全部位於亞洲」把兩國面積次序顛倒，也忽略其歐洲部分；「完全位於歐洲」與大部分國土位於西伯利亞（亞洲）的事實不符；俄羅斯面積大於中國，領土也未跨入非洲。"},{"level":"basic","topic":"位置與範圍－歐亞分界","q":"傳統上被視為歐洲與亞洲分界的山脈是下列何者？","choices":["安地斯山脈","烏拉山脈","喜馬拉雅山脈","科迪勒拉山系"],"answer":1,"explain":"烏拉山脈南北縱走於俄羅斯境內，習慣上作為歐、亞兩洲的分界，其西為歐洲部分（東歐平原），其東為亞洲部分（西伯利亞）。安地斯山脈與科迪勒拉山系位於美洲，喜馬拉雅山脈位於南亞與東亞之間，皆與歐亞分界無關。"},{"level":"basic","topic":"獨立國協－形成背景","q":"獨立國協（CIS）的成立，與下列哪一項歷史發展直接相關？","choices":["東西德合併為統一的德國","東南亞國家協會擴大成員","蘇聯解體後各加盟共和國相繼獨立","歐洲聯盟向東歐地區擴張"],"answer":2,"explain":"20世紀末蘇聯解體，原本的加盟共和國紛紛成為主權獨立國家，部分國家為維持彼此在經濟、交通與資源上的聯繫而組成獨立國協。兩德統一、東協擴大與歐盟東擴雖屬同一時期或其後的國際變化，但都不是獨立國協成立的直接背景。"},{"level":"basic","topic":"自然環境－植被（泰加林）","q":"西伯利亞地區大面積分布、以耐寒針葉樹為主的森林帶，通稱為下列何者？","choices":["季風林","硬葉林","熱帶雨林","泰加林"],"answer":3,"explain":"高緯地區冬季嚴寒、生長季短，以雲杉、冷杉、落葉松等針葉樹構成廣大森林帶，稱為泰加林（針葉林），是俄羅斯重要的林業資源。季風林分布於季風氣候區，硬葉林為地中海型氣候的代表植被，熱帶雨林需終年高溫多雨，三者的氣候條件都與西伯利亞相反。"},{"level":"basic","topic":"自然環境－永凍土","q":"西伯利亞廣大地區地表以下終年維持凍結狀態的土層，稱為下列何者？","choices":["黑土","永凍土","黃土","沖積土"],"answer":1,"explain":"高緯寒冷地區地下土層終年不融，稱為永凍土，是興建道路、房屋與管線的重大限制。黑土是溫帶草原區發育、肥力高的土壤；黃土由風力搬運堆積而成；沖積土由河流堆積形成，三者皆與「終年凍結」無關。"},{"level":"basic","topic":"自然環境－河川流向","q":"俄羅斯境內的鄂畢河、葉尼塞河與勒那河，在流向上的共同特徵是下列何者？","choices":["向南注入印度洋","向東注入太平洋","向北注入北極海","向西注入波羅的海"],"answer":2,"explain":"西伯利亞地勢大致南高北低，鄂畢河、葉尼塞河、勒那河等大河多由南向北注入北極海。注入印度洋者為南亞、西亞的水系；太平洋與波羅的海雖鄰接俄羅斯，但並非這三條大河的注入海域。"},{"level":"basic","topic":"獨立國協－中亞的氣候","q":"獨立國協成員中，位於中亞的哈薩克、烏茲別克等國，其氣候主要屬於下列何者？","choices":["乾燥氣候，年雨量稀少，沙漠與草原分布廣大","熱帶雨林氣候，終年高溫多雨","溫帶海洋性氣候，全年溫和濕潤","熱帶季風氣候，夏季雨量極為豐沛"],"answer":0,"explain":"中亞深居歐亞大陸內部，距海遙遠且有高山阻擋水氣，年雨量稀少，以溫帶沙漠與溫帶草原等乾燥氣候為主，農業多需仰賴河水灌溉。熱帶雨林與熱帶季風氣候分布於低緯多雨地區；溫帶海洋性氣候需位於中緯大陸西岸並受海洋調節，三者的位置與水分條件都與中亞不符。"},{"level":"basic","topic":"人文與經濟－人口分布","q":"俄羅斯人口與主要都市的分布特徵，下列敘述何者正確？","choices":["主要集中於東部太平洋沿岸","主要集中於北極海沿岸","大致平均分布於全國各地","主要集中於西部的歐洲部分"],"answer":3,"explain":"俄羅斯人口與大都市（如莫斯科、聖彼得堡）多集中在烏拉山以西的歐洲部分，該區緯度較低、平原廣大且開發較早。東部與北極海沿岸氣候嚴寒、交通不便，人口稀疏；國土遼闊而各地自然條件差異極大，也不可能平均分布。"},{"level":"basic","topic":"人文與經濟－資源與輸出","q":"下列哪一組資源在俄羅斯的產量居世界前列，並且是其重要的輸出項目？","choices":["石油與天然氣","咖啡與可可","稻米與蔗糖","天然橡膠與棕櫚油"],"answer":0,"explain":"俄羅斯的石油、天然氣、煤、鐵與森林等資源蘊藏豐富，油氣產量居世界前列，也是主要外銷項目。咖啡、可可、天然橡膠與棕櫚油屬熱帶栽培業產品；稻米與蔗糖需高溫多雨的環境，皆非高緯寒冷的俄羅斯所擅長。"},{"level":"basic","topic":"人文與經濟－交通（西伯利亞大鐵路路線）","q":"西伯利亞大鐵路由莫斯科向東橫貫國土，其東端終點位於下列何處？","choices":["聖彼得堡（波羅的海沿岸）","海參崴（太平洋沿岸）","莫曼斯克（北極海沿岸）","伊爾庫次克（貝加爾湖畔）"],"answer":1,"explain":"西伯利亞大鐵路自莫斯科向東橫越西伯利亞，直抵太平洋岸的海參崴，是俄羅斯最重要的東西向陸運幹線。聖彼得堡位於西北的波羅的海沿岸，莫曼斯克位於北極海沿岸，都在鐵路的西側或北方；伊爾庫次克雖是沿線重要城市，但位於貝加爾湖畔的內陸，並非終點。"},{"level":"basic","topic":"人文與經濟－農業與土壤","q":"俄羅斯與烏克蘭一帶最主要的農業區，主要分布在哪一種土壤所在的地區？","choices":["永凍土","紅壤","灰化土","黑土"],"answer":3,"explain":"溫帶草原長期草類腐爛累積，形成有機質豐富的黑土，是俄羅斯西南部與烏克蘭一帶重要的小麥產區。永凍土終年凍結不利耕作；紅壤分布於高溫多雨的熱帶、副熱帶，養分易被淋洗；灰化土多見於針葉林區，肥力較低。"},{"level":"basic","topic":"自然環境－氣候特徵","q":"下列關於俄羅斯氣候特色的敘述，何者最貼切？","choices":["以熱帶氣候為主，終年高溫多雨","以溫帶海洋性氣候為主，全年溫和濕潤","以大陸性氣候與寒帶氣候為主，冬季寒冷漫長、年溫差大","以地中海型氣候為主，夏乾冬雨"],"answer":2,"explain":"俄羅斯緯度高、內陸範圍廣大，以溫帶大陸性氣候與寒帶氣候為主，冬季漫長嚴寒、年溫差大、降水偏少。熱帶氣候與地中海型氣候分布於中、低緯；溫帶海洋性氣候需位於中緯大陸西岸並受海洋調節，只能形容歐洲西部，而非俄羅斯整體。"},{"level":"basic","topic":"人文與經濟－不凍港的概念","q":"地理課本中所稱的「不凍港」，是指下列哪一種港口？","choices":["冬季海面仍不結冰、全年可供船隻進出的港口","位於赤道無風帶、終年無浪的港口","專供破冰船停泊維修的港口","位於內陸湖泊、不受海象影響的港口"],"answer":0,"explain":"不凍港指冬季港灣海面不會結冰、全年皆可通航的港口，對高緯國家的對外聯繫特別重要，其形成常與暖流流經或緯度較低有關。赤道無風帶指的是低緯風力微弱的海域，與港口是否結冰無關；破冰船基地與內陸湖港則屬望文生義的誤解，皆非不凍港的定義。"},{"level":"basic","topic":"自然環境－凍原","q":"俄羅斯北極海沿岸一帶，因夏季短暫、地下有永凍土，樹木難以生長，僅見苔蘚、地衣與矮小灌木，此種植被帶稱為？","choices":["溫帶草原","莽原","泰加林","凍原"],"answer":3,"explain":"最高緯度的植被帶為凍原（苔原），以苔蘚、地衣與矮小灌木為主。溫帶草原分布於中緯內陸半乾燥區；莽原（熱帶草原）分布於熱帶乾濕季分明的地區；泰加林則位於凍原以南、由針葉樹構成，三者的緯度與氣候條件都不符。"},{"level":"adv","topic":"因果推論－河川特性與航運","q":"西伯利亞的大河水量豐沛、河道寬闊，航運價值卻相當有限，其最主要的原因是下列何者？","choices":["河流短促、落差極大，多急流瀑布","緯度高，冬季長期封凍；春季上游先解凍而下游仍結冰，易釀成凌汛","河道行經沙漠地帶，多數河段常年乾涸","沿岸人口過於稠密，航道長期壅塞"],"answer":1,"explain":"這些大河由南向北流，冬季長時間結冰而無法通航；春季南段（上游）先解凍，北段（下游）仍封凍，融冰之水受阻漫溢成災，加上沿岸人口稀少、貨運需求有限，航運價值因而不高。「短促、多急流瀑布」是山地小河的特徵，與寬闊大河不符；西伯利亞並非乾燥沙漠區，河道不會常年乾涸；該區人口稀疏，也不會出現航道壅塞。"},{"level":"adv","topic":"因果推論－不凍港的重要性","q":"俄羅斯海岸線相當漫長，卻長期重視取得與經營不凍港，最主要的原因是下列何者？","choices":["國內河運網已十分完整，不需海運","沿海多為陡直峭壁，無法興建碼頭","海岸線多位於熱帶，颱風侵襲頻繁","多數海岸位於高緯，冬季封凍使港口停擺，影響對外運輸"],"answer":3,"explain":"俄羅斯海岸多面向北極海與寒冷海域，冬季結冰使港口難以運作，因此終年不凍的港口（如受暖流影響的莫曼斯克）格外重要。其河川多為南北流向且冬季結冰，河運無法取代海運；陡直峭壁並非其海岸的普遍特徵；俄羅斯位於中高緯，也沒有熱帶颱風頻繁侵襲的問題。"},{"level":"adv","topic":"區域比較－人口分布成因","q":"俄羅斯人口與都市的分布極不平均，造成此一分布特徵的最主要原因組合是下列何者？","choices":["東部完全缺乏石油與天然氣等資源","東部地勢低窪，全年洪水氾濫","西部緯度較低、氣候相對溫和，平原廣大、開發較早，產業與交通較發達","西部有廣大熱帶雨林，物產豐富易於維生"],"answer":2,"explain":"歐洲部分（東歐平原）緯度較低、冬季相對沒那麼嚴寒，地形平坦、土壤較佳，開發歷史較久，工商業與交通建設集中，因而聚集大量人口。東部西伯利亞的資源其實相當豐富，只是氣候與交通條件不利；全年洪水氾濫並非東部的普遍現象；高緯的俄羅斯也不可能出現熱帶雨林。"},{"level":"adv","topic":"開發與環境－凍土融解的影響","q":"近年氣溫上升導致西伯利亞永凍土出現融解現象，最可能造成下列何種直接衝擊？","choices":["地基變得不穩，建築物、道路與輸油氣管線容易變形受損","冬季氣溫隨之下降，農作物完全無法生長","河川改為全年結冰，航運中斷時間延長","針葉林在短期內轉變為茂密的熱帶雨林"],"answer":0,"explain":"永凍土是當地建物、道路與管線的天然地基，一旦融解會造成地面塌陷、結構變形，並威脅交通與能源設施安全。氣溫上升不會使冬季轉冷，也不會使河川改為全年結冰（結冰期反而縮短）；植被演替需要漫長時間，高緯的日照與熱量條件更不可能形成熱帶雨林。"},{"level":"adv","topic":"人文與經濟－能源輸出與經濟","q":"就俄羅斯的經濟結構而言，能源輸出所帶來的影響，下列敘述何者較為適當？","choices":["能源出口比重甚低，經濟主要仰賴觀光收入","石油、天然氣等能源出口占外銷相當比重，國際油氣價格波動會明顯影響其經濟收入","因國內能源嚴重不足，必須大量進口油氣","經濟以熱帶栽培業產品出口為主，受國際農產價格影響"],"answer":1,"explain":"油氣是俄羅斯外銷收入的重要來源，因此國際能源價格與市場需求的變動，會透過出口收入影響其整體經濟表現，這是資源出口導向經濟常見的特徵。其經濟並非以觀光或熱帶栽培業產品為主；俄羅斯屬能源輸出國，而非仰賴大量進口油氣的國家。"},{"level":"adv","topic":"人文與經濟－西伯利亞大鐵路的意義","q":"西伯利亞大鐵路對西伯利亞地區的開發具有關鍵意義，最主要的理由是下列何者？","choices":["取代北極海航線，成為觀光旅遊的主要動線","因當地河川多為東西流向，鐵路僅居輔助地位","其主要功能是連接中亞各國的出海港口","彌補河川南北流向且冬季結冰的限制，提供東西向的全年陸運幹線，帶動沿線資源開發與聚落發展"],"answer":3,"explain":"西伯利亞大河為南北流向且冬季封凍，難以承擔東西向的長程運輸；鐵路正好補足此一缺口，使木材、礦產與油氣得以外運，並促成沿線都市興起。它並非以觀光為主要功能，也未取代北極海航線；當地河川是南北流向而非東西流向；其路線橫貫俄羅斯東西直抵太平洋岸，並非為連接中亞國家的出海港口而設。"},{"level":"adv","topic":"情境判讀－地形區辨識","q":"某段考察紀錄提到：「甲地位於烏拉山以東，地勢低平、排水不良，夏季沼澤遍布；乙地位於葉尼塞河以東，地表受河流深切，起伏較大。」甲、乙兩地最可能分別是？","choices":["甲：東歐平原　乙：西西伯利亞平原","甲：中西伯利亞高原　乙：東歐平原","甲：西西伯利亞平原　乙：中西伯利亞高原","甲：中西伯利亞高原　乙：西西伯利亞平原"],"answer":2,"explain":"烏拉山以東、地勢低平且夏季多沼澤者為西西伯利亞平原；葉尼塞河以東、受河流深切而起伏較大者為中西伯利亞高原。東歐平原位於烏拉山以西，不符合「烏拉山以東」的條件；若把兩地的地形性質對調，也與「低平多沼澤」「受切割起伏大」的描述不合。"},{"level":"adv","topic":"因果推論－農業發展的限制","q":"限制俄羅斯農業發展最主要的自然因素，是下列何者？","choices":["地形以高山峻嶺為主，缺乏可耕平原","緯度高使生長季短、又有廣大凍土分布，適耕地主要集中在西南部黑土區","終年高溫多雨，土壤養分淋洗嚴重","河川終年氾濫，使農地長期無法利用"],"answer":1,"explain":"俄羅斯農業的關鍵限制在於熱量不足：緯度高、無霜期短，北部又有廣大永凍土，因此農業重心集中於緯度較低、土壤肥沃的西南部黑土區。俄羅斯擁有廣大平原，並非以高山峻嶺為主；終年高溫多雨而養分淋洗嚴重是熱帶的特徵；春季凌汛屬局部且季節性的現象，不能誇大為全國全年的水患。"},{"level":"adv","topic":"情境判讀－氣候資料判讀","q":"某氣候站資料顯示：夏季月均溫約攝氏十餘度，冬季月均溫遠低於攝氏零度，年溫差極大，年雨量偏少且集中於夏季。該站最可能位於下列何處？","choices":["西伯利亞內陸，屬大陸性氣候，遠離海洋且冬季受強盛高氣壓籠罩","西歐大西洋沿岸，全年受海洋與暖流調節","地中海沿岸，夏季乾熱、冬季溫暖多雨","東南亞低緯地區，終年高溫、雨量豐沛"],"answer":0,"explain":"年溫差極大、冬季酷寒、雨量偏少而集中於夏季，是遠離海洋的大陸性氣候典型特徵，符合西伯利亞內陸的情況。西歐沿岸受海洋與暖流調節，年溫差小、降水較平均；地中海沿岸冬季溫暖並以冬雨為主；東南亞終年高溫多雨，三者的溫差與降水季節分配皆與資料不合。"},{"level":"adv","topic":"開發與環境－資源開發與生態","q":"在西伯利亞進行油氣開採與大規模林木砍伐時，最可能引發的環境問題是下列何者？","choices":["當地氣候轉為溫暖濕潤，森林反而更加茂密","地下永凍土層因此增厚，工程更為穩固","地表植被遭破壞並擾動凍土層，加上生長季短，森林與生態系復原十分緩慢","北極海沿岸因此出現熱帶雨林等新植被帶"],"answer":2,"explain":"高緯地區熱量不足、生長季短，植被一旦破壞便極難自然恢復；施工與開採也會擾動永凍土，造成地表塌陷與污染擴散，因此開發與生態保育須取得平衡。開發不會使氣候轉為溫暖濕潤而使森林更茂密，也不會使凍土層增厚（人為熱源反而加速其融解）；北極海沿岸的熱量條件更不可能形成熱帶雨林。"},{"level":"adv","topic":"獨立國協－中亞的環境問題（鹹海）","q":"中亞的鹹海（阿拉海）湖面在近數十年間大幅縮小，其最主要的人為原因是下列何者？","choices":["湖區周邊大量開採石油，油污使湖水蒸發加快","注入湖中的河川被大量引水灌溉棉花等作物，入湖水量銳減","當地降雨過多，湖水不斷外洩至周邊河谷","湖底地層下陷，湖水滲入地下含水層而流失"],"answer":1,"explain":"注入鹹海的阿姆河與錫爾河，河水長期被大量引去灌溉棉花等耕地，入湖水量大減，加上當地氣候乾燥、蒸發旺盛，湖面因而不斷退縮，並出現鹽分升高、漁業沒落與湖床鹽塵飛揚等問題。石油污染並不會使湖水大量蒸發；中亞屬乾燥氣候，降雨過多之說不成立；湖水滲漏也非造成此一變化的主因。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ let i; do{ i=poolIdx[Math.floor(Math.random()*poolIdx.length)]; }while(poolIdx.length>1 && i===lastIdx); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
