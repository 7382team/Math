    --ink:#1b1d26; --ink-soft:#5b606f;
    --pos:#2563eb; --neg:#ea580c;
    --right:#16a34a; --wrong:#e11d48;

  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,var(--bg);
    display:flex;justify-content:center;padding:14px;}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0;}
  header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.5px;}

  .lv.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 8px 24px -18px rgba(20,25,50,.35);}
  .q{font-size:18px;font-weight:500;line-height:1.65;min-height:52px;}
  .q .tag{display:inline-block;font-size:11px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;margin-bottom:10px;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:16px;}

  .opt.lock{cursor:default;}
  @keyframes shake{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-6px)}}

  .explain .lead{font-size:12px;color:var(--subj);letter-spacing:1px;margin-bottom:4px;}
  .explain .body{font-size:15px;line-height:1.8;color:var(--ink);}
  .explain .kp{font-size:12px;color:var(--subj);background:#fbeeec;border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px;}
  .go{border:none;border-radius:16px;height:56px;width:100%;font-family:inherit;font-size:18px;font-weight:700;letter-spacing:1px;
      background:var(--pos);color:#fff;cursor:pointer;transition:.12s;}
  .go:active{transform:scale(.98);} .go:disabled{opacity:.35;}

<script>
/* ===== bank-start ===== 原創題庫（論語選）：字詞義、文意翻譯、國學常識、成語 */
const BANK=[{"level":"basic","topic":"want + to V","q":"My sister wants ______ a doctor in the future.","choices":["being","be","is","to be"],"answer":3,"explain":"want 是「只接不定詞」的動詞，受詞要用 to + 原形動詞，故選 (D) to be。(A) being 是動名詞，want 後面不接 V-ing；(B) be 缺少 to，原形動詞不能單獨當受詞；(C) is 是變化過的動詞，句中已有主要動詞 wants，一個句子不能有兩個主要動詞。"},{"level":"basic","topic":"enjoy + V-ing","q":"We all enjoy ______ basketball after school.","choices":["to play","playing","play","played"],"answer":1,"explain":"enjoy 是「只接動名詞」的動詞，受詞要用 V-ing，故選 (B) playing。(A) to play 是不定詞，enjoy 不接 to V（最常見的錯誤）；(C) play 是原形動詞，不能直接當受詞；(D) played 是過去式／過去分詞，不能當受詞，且本句是現在式。"},{"level":"basic","topic":"動名詞當主詞","q":"______ English every day is good for you.","choices":["Study","Studies","To studying","Studying"],"answer":3,"explain":"句首缺主詞，動詞要當主詞時必須改成動名詞 V-ing（或改成不定詞 To study），本題選項中只有 (D) Studying 正確；動名詞主詞視為單數，所以後面用 is。(A) Study 是原形動詞，放句首會變成祈使句，與後面的 is 衝突；(B) Studies 是變化過的動詞，動詞不能當主詞；(C) To studying 形式錯誤，不定詞的 to 後面只能接原形動詞（應為 To study）。"},{"level":"basic","topic":"表目的的不定詞","q":"Kevin went to the library ______ some books.","choices":["borrow","borrowing","to borrow","borrowed"],"answer":2,"explain":"表示「為了…（目的）」要用不定詞 to + 原形動詞，故選 (C) to borrow。(A) borrow 少了 to，句中已有主要動詞 went；(B) borrowing 是動名詞，不能單獨表示目的；(D) borrowed 是過去式，一句中不能出現兩個主要動詞。"},{"level":"basic","topic":"It is + adj + to V","q":"It is important ______ enough water every day.","choices":["drink","to drink","drinking","drinks"],"answer":1,"explain":"「It + be + 形容詞 + to V」句型中，It 是虛主詞，真正的主詞是後面的不定詞片語，故選 (B) to drink。(A) drink 少了 to；(C) drinking 是動名詞，這個句型固定用 to V；(D) drinks 是變化過的動詞，句中已有動詞 is。"},{"level":"basic","topic":"介系詞 + V-ing","q":"Thank you for ______ me with my homework.","choices":["help","to help","helped","helping"],"answer":3,"explain":"for 是介系詞，介系詞後面的動詞一律改成動名詞 V-ing，故選 (D) helping。(A) help 是原形動詞，不能接在介系詞後面；(B) to help 是不定詞，介系詞後不接不定詞（常見錯誤）；(C) helped 是過去式／過去分詞，也不能接在介系詞後面。"},{"level":"basic","topic":"finish + V-ing","q":"Did you finish ______ your room?","choices":["cleaning","to clean","clean","cleaned"],"answer":0,"explain":"finish 只接動名詞當受詞，故選 (A) cleaning。(B) to clean 是不定詞，finish 不接 to V；(C) clean 是原形動詞，不能當受詞；(D) cleaned 是過去式／過去分詞，句首已有助動詞 Did，後面也不會再用過去式。"},{"level":"basic","topic":"decide + to V","q":"They decided ______ at home this weekend.","choices":["to stay","staying","stay","stayed"],"answer":0,"explain":"decide 只接不定詞當受詞，故選 (A) to stay。(B) staying 是動名詞，decide 不接 V-ing；(C) stay 少了 to；(D) stayed 是過去式，一句中不能有兩個主要動詞（decided 和 stayed）。"},{"level":"basic","topic":"like 兩者皆可","q":"Amy likes ______ comic books in her free time.","choices":["read","reads","to read","to reading"],"answer":2,"explain":"like 後面接 to V 或 V-ing 都可以（to read 或 reading），但本題四個選項中只有 (C) to read 是正確形式。(A) read 少了 to；(B) reads 是變化過的動詞，句中已有主要動詞 likes；(D) to reading 形式錯誤，不定詞記號 to 後面只能接原形動詞。"},{"level":"basic","topic":"would like + to V","q":"Would you like ______ a cup of tea?","choices":["having","to have","have","had"],"answer":1,"explain":"would like（＝want，想要）後面固定接不定詞 to V，故選 (B) to have。(A) having 是動名詞，would like 不接 V-ing；(C) have 少了 to；(D) had 是過去式，不能當受詞使用。"},{"level":"basic","topic":"mind + V-ing","q":"Would you mind ______ the window? It's very cold.","choices":["to close","close","closed","closing"],"answer":3,"explain":"mind（介意）只接動名詞當受詞，故選 (D) closing；Would you mind + V-ing? 是客氣請求別人做事的句型。(A) to close 是不定詞，mind 不接 to V；(B) close 是原形動詞，不能當受詞；(C) closed 是過去式／過去分詞，形式不合。"},{"level":"basic","topic":"keep + V-ing","q":"Don't keep ______ so loudly. The baby is sleeping.","choices":["talking","to talk","talk","talks"],"answer":0,"explain":"keep（持續）只接動名詞，故選 (A) talking。(B) to talk 是不定詞，keep 不接 to V；(C) talk 是原形動詞，不能當 keep 的受詞；(D) talks 是變化過的動詞，句中已有動詞 keep（否定祈使句 Don't keep...）。"},{"level":"basic","topic":"need + to V","q":"You need ______ earlier if you don't want to be late.","choices":["getting up","to get up","get up","got up"],"answer":1,"explain":"need 當一般動詞時後面接不定詞 to V，故選 (B) to get up。(A) getting up 是動名詞，need 不接 V-ing；(C) get up 少了 to；(D) got up 是過去式，一句中不能有兩個主要動詞，且本句是現在式。"},{"level":"basic","topic":"give up + V-ing","q":"My father gave up ______ two years ago, and now he is much healthier.","choices":["smoke","to smoke","smoked","smoking"],"answer":3,"explain":"give up（放棄）後面只接動名詞，故選 (D) smoking。(A) smoke 是原形動詞，不能當受詞；(B) to smoke 是不定詞，give up 不接 to V；(C) smoked 是過去式，句中已有主要動詞 gave up。"},{"level":"adv","topic":"plan / hope + to V","q":"My parents plan ______ to Japan this winter, and they hope ______ a lot of snow there.","choices":["to travel / to see","traveling / seeing","to travel / seeing","traveling / to see"],"answer":0,"explain":"plan 和 hope 都是「只接不定詞」的動詞，兩個空格都要用 to V，故選 (A) to travel / to see。(B) 兩格都用動名詞是最常見的錯誤；(C)(D) 各錯一半，plan 和 hope 都不能接 V-ing。口訣：want, hope, decide, plan, need, would like 一律接 to V。"},{"level":"adv","topic":"介系詞 + V-ing（選正確句）","q":"Which sentence is correct?","choices":["I use my cellphone for take photos.","I use my cellphone to taking photos.","I use my cellphone for taking photos.","I use my cellphone for to take photos."],"answer":2,"explain":"for 是介系詞，後面的動詞要變成動名詞，for + V-ing 用來說明「東西的用途」，故 (C) for taking photos 正確。(A) 介系詞後面不能接原形動詞 take；(B) 不定詞記號 to 後面只能接原形動詞，應為 to take 而不是 to taking；(D) for 和 to 不能連用，for 後面不可接不定詞。補充：I use my cellphone to take photos.（表目的）也正確，但選項中沒有。"},{"level":"adv","topic":"practice + V-ing（改錯）","q":"Choose the sentence with a grammar mistake.","choices":["We plan to visit Tainan next month.","She finished doing the dishes.","He practices to speak English with his friends.","It's fun to play with my dog."],"answer":2,"explain":"practice 只接動名詞，(C) 應改成 He practices speaking English with his friends.，故答案為 (C)。(A) plan 接 to V 正確；(B) finish 接 V-ing 正確；(D) 「It + be + 形容詞 + to V」句型正確。"},{"level":"adv","topic":"keep / finish + V-ing","q":"Sam kept ______ TV, so he didn't finish ______ his homework.","choices":["watching / doing","to watch / to do","watching / to do","to watch / doing"],"answer":0,"explain":"keep 和 finish 都只接動名詞，兩格都要用 V-ing，故選 (A) watching / doing。(B) 兩格都用不定詞是錯的；(C) finish 不能接 to do；(D) keep 不能接 to watch。注意 didn't finish 只是時態與否定的變化，並不影響後面必須用 V-ing 的規則。"},{"level":"adv","topic":"V-ing 拼字規則","q":"Tina enjoys ______ letters to her pen pal in Japan.","choices":["writeing","write","writting","writing"],"answer":3,"explain":"enjoy 接動名詞，而 write 字尾是不發音的 e，要「去 e 再加 -ing」，寫成 writing，故選 (D)。(A) writeing 沒有去掉 e，拼字錯誤；(B) write 是原形動詞，不能當 enjoy 的受詞；(C) writting 多了一個 t，「重複字尾子音」只用在「短母音＋單子音」結尾的字（如 sit → sitting），write 不適用這個規則。"},{"level":"adv","topic":"同義句轉換","q":"It is not easy to learn a new language. Which sentence has the same meaning?","choices":["Learn a new language is not easy.","Learning a new language is not easy.","To learning a new language is not easy.","Learning a new language are not easy."],"answer":1,"explain":"「It + be + 形容詞 + to V」可以改寫成用動名詞當主詞的句子，且動名詞主詞視為單數，動詞用 is，故選 (B)。(A) 原形動詞 Learn 不能當主詞；(C) to 後面只能接原形動詞，To learning 形式錯誤；(D) 動名詞主詞是單數，不可用 are。"},{"level":"adv","topic":"過去式 + to V","q":"Last night Judy wanted ______ a movie with us, but she was too tired.","choices":["to see","saw","seeing","sees"],"answer":0,"explain":"雖然主要動詞 wanted 是過去式，want 後面仍固定接不定詞 to V，不定詞本身不隨時態改變，故選 (A) to see。(B) saw 是過去式動詞，一句中不能有兩個主要動詞，這是最常見的時態誤用；(C) seeing 是動名詞，want 不接 V-ing；(D) sees 是現在式，時態與形式都不對。"},{"level":"adv","topic":"make + 原形 V／ask + to V","q":"My mom makes me ______ my homework before dinner, and she asks me ______ to bed before ten.","choices":["to do / to go","do / to go","do / go","to do / go"],"answer":1,"explain":"make 是使役動詞，後面接「受詞 + 原形動詞」（省略 to 的不定詞）；ask 則要接「受詞 + to V」，故選 (B) do / to go。(A) make me to do 多了 to；(C) ask me go 少了 to；(D) 兩格剛好相反，完全弄錯。記法：make, let 後面接原形動詞；ask, tell, want 後面接 to V。"},{"level":"adv","topic":"表目的的不定詞","q":"Nick got up at five ______ the first train.","choices":["catch","for catching","to catch","catching"],"answer":2,"explain":"表示「人做某動作的目的」要用不定詞 to V，故選 (C) to catch。(A) catch 少了 to，句中已有主要動詞 got up；(B) for + V-ing 是用來說明「東西的用途」（例：This knife is for cutting bread.），不能用來說明人做動作的目的，for catching 是常見的中式英文；(D) catching 是動名詞，不能單獨表示目的。"},{"level":"adv","topic":"love / like 用法（改錯）","q":"Which sentence is NOT correct?","choices":["My brother loves to play the guitar.","My brother likes playing the guitar.","My brother loves plays the guitar.","My brother loves playing the guitar."],"answer":2,"explain":"like 和 love 後面接 to V 或 V-ing 都可以，但絕不能直接接另一個變化過的動詞，所以 (C) loves plays 錯誤，應改成 loves to play 或 loves playing。(A)(D) 是 love 的兩種正確用法；(B) like + V-ing 也正確。"}];
/* ===== bank-end ===== */

const AB=['A','B','C','D','E'];
let level='basic', poolIdx=[], problem=null, answered=false, streak=0, lastIdx=-1;

function buildPool(){ poolIdx = BANK.map((x,i)=>i).filter(i=> level==='mix' || BANK[i].level===level); if(poolIdx.length<2) poolIdx=BANK.map((x,i)=>i); }
/* 每題把選項順序洗牌（避免正解都固定在 A），並重新對映正解索引；原始 BANK 不動 */
function shuffleChoices(p){ const order=p.choices.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){ const r=Math.floor(Math.random()*(k+1)); const t=order[k]; order[k]=order[r]; order[r]=t; }
  return Object.assign({}, p, { choices: order.map(k=>p.choices[k]), answer: order.indexOf(p.answer) }); }
function nextProblem(){ let i; do{ i=poolIdx[Math.floor(Math.random()*poolIdx.length)]; }while(poolIdx.length>1 && i===lastIdx); lastIdx=i; problem=shuffleChoices(BANK[i]); render(); }
function qText(){ return problem.q; }

function render(){
  answered=false;
  document.getElementById('q').innerHTML=`<span class="tag">${problem.level==='basic'?'基礎':'進階'}</span><div>${problem.q}</div>`;
  const box=document.getElementById('opts'); box.innerHTML='';
  problem.choices.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.i=idx;
    b.innerHTML=`<span class="mk">${AB[idx]}</span><span>${c}</span>`;
    b.onclick=()=>choose(idx); box.appendChild(b);
  });
  document.getElementById('explain').className='explain';
  document.getElementById('go').disabled=true;
}

function choose(idx){
  if(answered) return; answered=true;
  const correct = idx===problem.answer;
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(o=>o.classList.add('lock'));
  opts[problem.answer].classList.add('ok');
  if(!correct){ opts[idx].classList.add('no'); opts[idx].classList.add('shake'); setTimeout(()=>opts[idx].classList.remove('shake'),400); }

  streak = correct?streak+1:0; document.getElementById('streak').textContent=streak;

  if(window.parent!==window){
    window.parent.postMessage({type:'unit-progress', unitDone:1, unitCorrect:correct?1:0}, '*');
    if(!correct){ window.parent.postMessage({type:'unit-mistake', q:qText(), ans:problem.choices[problem.answer], given:problem.choices[idx], choices:problem.choices, steps:`<div>${problem.explain}</div>`, tip:'知識點：'+(problem.topic||'')}, '*'); }
  }

  document.getElementById('ebody').innerHTML=`<span class="kp">知識點 · ${problem.topic||''}</span><br>正解 <b style="color:var(--right)">${AB[problem.answer]}　${problem.choices[problem.answer]}</b><br>${problem.explain}`;
  document.getElementById('explain').className='explain show';
  document.getElementById('go').disabled=false;
}

document.getElementById('go').onclick=()=>{ if(answered) nextProblem(); };
document.querySelectorAll('.lv').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.lv').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); level=b.dataset.lv; buildPool(); nextProblem();
}));
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&answered) nextProblem();
  else if(/^[1-5]$/.test(e.key)&&!answered){ const i=+e.key-1; if(i<problem.choices.length) choose(i); } });

(function(){ const lv=new URLSearchParams(location.search).get('level');
  if(lv==='basic'||lv==='adv'||lv==='mix'){ level=lv; document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('active',b.dataset.lv===lv)); }
})();
buildPool(); nextProblem();
</script>
<script>
/* ===== 遊戲指令介面：外層 RPG 可對本題下技能（hint / fifty）。單獨用瀏覽器開啟時不受影響。 ===== */
(function(){
  function box(){var h=document.getElementById('game-hint');if(!h){h=document.createElement('div');h.id='game-hint';h.style.cssText='margin-top:12px;font-size:13px;background:#fff7ed;border:1.5px solid #fed7aa;color:#9a3412;border-radius:10px;padding:9px 12px;line-height:1.6';var o=document.getElementById('opts');if(o&&o.parentNode){o.parentNode.insertBefore(h,o.nextSibling);}else{(document.querySelector('.card')||document.body).appendChild(h);}}return h;}
  function showHint(){if(answered||!problem)return;box().innerHTML='💡 提示 · 這題的知識點：'+(problem.topic||'');}
  function eliminateOne(){if(answered||!problem)return;var opts=[].slice.call(document.querySelectorAll('.opt')).filter(function(o){return !o.classList.contains('gone')&&(+o.dataset.i)!==problem.answer;});if(!opts.length)return;var p=opts[Math.floor(Math.random()*opts.length)];p.classList.add('gone');p.disabled=true;p.style.opacity='.35';p.style.textDecoration='line-through';p.style.pointerEvents='none';}
  if(typeof nextProblem==='function'){var _n=nextProblem;nextProblem=function(){var h=document.getElementById('game-hint');if(h)h.remove();return _n.apply(this,arguments);};}
  window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='unit-command')return;if(d.cmd==='hint')showHint();if(d.cmd==='fifty')eliminateOne();});
  if(window.parent!==window){window.parent.postMessage({type:'unit-ready',supports:['hint','fifty']},'*');}
})();
</script>
<script>
/* ===== exam-mode-hook：綜合測驗模式，?exam=1 時交由外層 runner 控制 ===== */
(function(){
  if(new URLSearchParams(location.search).get('exam')!=='1') return;
  document.documentElement.setAttribute('data-exam','1');
  var lv=document.querySelector('.levels'); if(lv) lv.style.display='none';
  var go=document.getElementById('go'); if(!go) return;
  function upd(){ var isNext=go.classList.contains('next')||(go.textContent||'').indexOf('下一題')>=0;
    go.style.display=isNext?'none':''; }
  upd();
  try{ new MutationObserver(upd).observe(go,{attributes:true,childList:true,characterData:true,subtree:true}); }catch(e){}
})();
</script>
